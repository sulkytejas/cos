 curve in five minutes if you want. And <span class=\\\"roman\\\">V.<\\/span> emailed about Thursday with a softer studio time, <em class=\\\"accent\\\">11:30<\\/em> instead of <em class=\\\"accent\\\">11:00<\\/em> — I haven't accepted yet.<\\/p>\\n              <\\/div>\\n              <div class=\\\"src-tag\\\">3 sources · drive, gmail, calendar<\\/div>\\n\\n              <!-- Embedded actions -->\\n              <div class=\\\"ssatom eo-source\\\" data-atom>\\n                <div class=\\\"atom-capsule\\\">\\n                  <div class=\\\"cap-glyph\\\"><\\/div>\\n                  <div class=\\\"cap-label\\\">Swap the churn slide<\\/div>\\n                  <div class=\\\"cap-when\\\">5 min<\\/div>\\n                <\\/div>\\n                <div class=\\\"atom-letter\\\">\\n                  <div class=\\\"atom-letter-inner\\\">\\n                    <div class=\\\"letter-row head\\\">What I'd do<\\/div>\\n                    <div class=\\\"letter-row\\\">\\n                      Replace slide 7 (churn) with the M6 cohort curve from sheet \\\"retention_v4\\\". Keep the title; change only the chart and the caption beneath.\\n                    <\\/div>\\n                    <div class=\\\"letter-row head\\\">Reversible<\\/div>\\n                    <div class=\\\"letter-row\\\">\\n                      Yes — I'll keep the old slide as 7a so you can revert before the call if needed.\\n                    <\\/div>\\n                  <\\/div>\\n                <\\/div>\\n              <\\/div>\\n            <\\/div>\\n\\n            <div class=\\\"day-divider\\\">\\n              <span class=\\\"label\\\">now <span class=\\\"roman\\\">09:41<\\/span><\\/span>\\n            <\\/div>\\n\\n          <\\/div>\\n\\n          <!-- ════════ COMPOSE lives in atlas-capture.js (summoned in place) ════════ -->\\n\\n        <\\/div>\\n\\n      <\\/div>\\n      <div class=\\\"island\\\"><\\/div>\\n      <div class=\\\"home\\\"><\\/div>\\n    <\\/div>\\n  <\\/div>\\n\\n  <div class=\\\"legend\\\">\\n    <div class=\\\"row\\\"><dt>Halo<\\/dt><dd>A 22-pixel rim around the entire screen interior. Real Stam stable-fluids solver runs on it. <em>Idle:<\\/em> faint, slow seeds. <em>Thinking:<\\/em> billows jade, frequent injection. <em>Delivered:<\\/em> warm sienna pulse that ebbs. The screen itself is the AI.<\\/dd><\\/div>\\n    <div class=\\\"row\\\"><dt>Conversation<\\/dt><dd>The whole app is one scrolling thread between you and Ayumi. Ayumi speaks in italic serif; you reply in roman. No header, no nav. Cards (briefs, todos, suggestions) are <em>embedded turns,<\\/em> not list items.<\\/dd><\\/div>\\n    <div class=\\\"row\\\"><dt>Morphing brief<\\/dt><dd>Each brief is a capsule that morphs into a letter on tap. Same matter — radius, padding, height all interpolated under one spring (cubic-bezier .34, 1.16, .64, 1). The crease shadow stays after.<\\/dd><\\/div>\\n    <div class=\\\"row\\\"><dt>Breath<\\/dt><dd>When Ayumi is reasoning, a tiny buoyant fluid plume sits inside Ayumi's speech bubble — the visible exhale of cognition. Same solver as the halo; thinking and presence share one substrate.<\\/dd><\\/div>\\n    <div class=\\\"row\\\"><dt>Compose<\\/dt><dd>The capture pill at the bottom is always there. Tap → it morphs upward into a writing field via the same ssatom contract as the brief. Send → it springs back, your turn appears in the conversation, and a soft EO ring emits.<\\/dd><\\/div>\\n    <div class=\\\"row\\\"><dt>Refused<\\/dt><dd>Top navigation. Bottom tab bar. AI chips that announce Ayumi's existence. The halo announces Ayumi's existence. The compose announces Ayumi's input. The conversation IS the app.<\\/dd><\\/div>\\n  <\\/div>\\n\\n<\\/main>\\n\\n<!-- ═══════════════════════════════════════════════════════════\\n     Fluid solver (Stam) + halo render + breath plume + atoms\\n═══════════════════════════════════════════════════════════ -->\\n<script>\\n(() => {\\n  function makeSolver(N, M) {\\n    const W = N + 2, H = M + 2; const size = W * H;\\n    let u  = new Float32Array(size), v  = new Float32Array(size);\\n    let u0 = new Float32Array(size), v0 = new Float32Array(size);\\n    let d  = new Float32Array(size), d0 = new Float32Array(size);\\n    const IX = (i, j) => i + W * j;\\n    function setBnd(b, x) {\\n      for (let i = 1; i <= N; i++) { x[IX(i,0)] = b===2?-x[IX(i,1)]:x[IX(i,1)]; x[IX(i,M+1)] = b===2?-x[IX(i,M)]:x[IX(i,M)]; }\\n      for (let j = 1; j <= M; j++) { x[IX(0,j)] = b===1?-x[IX(1,j)]:x[IX(1,j)]; x[IX(N+1,j)] = b===1?-x[IX(N,j)]:x[IX(N,j)]; }\\n    }\\n    function linSolve(b, x, x0, a, c, iters) {\\n      const invC = 1/c;\\n      for (let k=0;k<iters;k++){ for(let j=1;j<=M;j++) for(let i=1;i<=N;i++) x[IX(i,j)]=(x0[IX(i,j)]+a*(x[IX(i-1,j)]+x[IX(i+1,j)]+x[IX(i,j-1)]+x[IX(i,j+1)]))*invC; setBnd(b,x); }\\n    }\\n    function diffuse(b,x,x0,diff,dt){ const a = dt*diff*N*M; linSolve(b,x,x0,a,1+4*a,6); }\\n    function advect(b,dA,d0A,uA,vA,dt){\\n      const dtx=dt*N, dty=dt*M;\\n      for(let j=1;j<=M;j++) for(let i=1;i<=N;i++){\\n        let x=i-dtx*uA[IX(i,j)]; let y=j-dty*vA[IX(i,j)];\\n        if(x<0.5)x=0.5; if(x>N+0.5)x=N+0.5;\\n        if(y<0.5)y=0.5; if(y>M+0.5)y=M+0.5;\\n        const i0=Math.floor(x), i1=i0+1; const j0=Math.floor(y), j1=j0+1;\\n        const s1=x-i0, s0=1-s1; const t1=y-j0, t0=1-t1;\\n        dA[IX(i,j)] = s0*(t0*d0A[IX(i0,j0)] + t1*d0A[IX(i0,j1)]) + s1*(t0*d0A[IX(i1,j0)] + t1*d0A[IX(i1,j1)]);\\n      }\\n      setBnd(b,dA);\\n    }\\n    function project(uA,vA,p,div){\\n      const hx=1/N, hy=1/M;\\n      for(let j=1;j<=M;j++) for(let i=1;i<=N;i++){\\n        div[IX(i,j)] = -0.5*(hx*(uA[IX(i+1,j)]-uA[IX(i-1,j)])+hy*(vA[IX(i,j+1)]-vA[IX(i,j-1)])); p[IX(i,j)]=0;\\n      }\\n      setBnd(0,div); setBnd(0,p); linSolve(0,p,div,1,4,18);\\n      for(let j=1;j<=M;j++) for(let i=1;i<=N;i++){\\n        uA[IX(i,j)] -= 0.5*(p[IX(i+1,j)]-p[IX(i-1,j)])/hx;\\n        vA[IX(i,j)] -= 0.5*(p[IX(i,j+1)]-p[IX(i,j-1)])/hy;\\n      }\\n      setBnd(1,uA); setBnd(2,vA);\\n    }\\n    function velStep(visc,dt){\\n      let t; t=u0;u0=u;u=t; t=v0;v0=v;v=t;\\n      diffuse(1,u,u0,visc,dt); diffuse(2,v,v0,visc,dt);\\n      project(u,v,u0,v0);\\n      t=u0;u0=u;u=t; t=v0;v0=v;v=t;\\n      advect(1,u,u0,u0,v0,dt); advect(2,v,v0,u0,v0,dt);\\n      project(u,v,u0,v0);\\n    }\\n    function densStep(diff,dt,decay){\\n      d0.set(d); diffuse(0,d,d0,diff,dt);\\n      d0.set(d); advect(0,d,d0,u,v,dt);\\n      for(let i=0;i<size;i++) d[i]*=decay;\\n    }\\n    function applyBuoyancy(strength) {\\n      for (let j = 1; j <= M; j++) for (let i = 1; i <= N; i++) {\\n        const idx = IX(i, j); v[idx] -= d[idx] * strength;\\n      }\\n    }\\n    return {\\n      W,H,N,M,\\n      get u(){return u;}, get v(){return v;}, get d(){return d;},\\n      step(visc, diff, dt, buoy, decay = 0.985) {\\n        if (buoy) applyBuoyancy(buoy);\\n        velStep(visc, dt); densStep(diff, dt, decay);\\n      },\\n      inject(gx,gy,dx,dy,density){\\n        const i=Math.max(1,Math.min(N,Math.floor(gx))), j=Math.max(1,Math.min(M,Math.floor(gy)));\\n        const idx = i + W*j;\\n        u[idx]+=dx; v[idx]+=dy; d[idx]=Math.min(1.8, d[idx]+density);\\n      }\\n    };\\n  }\\n\\n  // ─── HALO — particle smoke (not pixels) ─────────────────────\\n  // Real smoke is many soft Gaussian blobs overlapping. Each\\n  // particle is a pre-rendered radial-gradient sprite drawn at a\\n  // size where its transparent fringe blends into its neighbors.\\n  // The .page surface above masks the screen's interior, so only\\n  // particles drifting in the 22-px rim are visible.\\n  const halo = document.getElementById('halo');\\n  const haloCtx = halo.getContext('2d');\\n  function sizeHalo() {\\n    const r = halo.getBoundingClientRect();\\n    const w = Math.max(2, Math.round(r.width));\\n    const h = Math.max(2, Math.round(r.height));\\n    if (halo.width !== w)  halo.width  = w;\\n    if (halo.height !== h) halo.height = h;\\n  }\\n  sizeHalo();\\n  window.addEventListener('resize', sizeHalo);\\n  // Re-measure once layout has settled — the first call can hit width 0\\n  // if the script runs before the iframe paints.\\n  setTimeout(sizeHalo, 50);\\n  setTimeout(sizeHalo, 250);\\n\\n  // Pre-rendered Gaussian sprites — one per state. The state's\\n  // color tints the smoke; particles carry a reference to the\\n  // sprite that was current at their birth, so a state change\\n  // colors *new* smoke without snapping the old smoke's color.\\n  function makeSprite(rgb, peakAlpha) {\\n    const S = 128;\\n    const c = document.createElement('canvas');\\n    c.width = S; c.height = S;\\n    const sx = c.getContext('2d');\\n    const g = sx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2 - 1);\\n    g.addColorStop(0.00, `rgba(${rgb}, ${peakAlpha})`);\\n    g.addColorStop(0.35, `rgba(${rgb}, ${peakAlpha * 0.45})`);\\n    g.addColorStop(0.70, `rgba(${rgb}, ${peakAlpha * 0.10})`);\\n    g.addColorStop(1.00, `rgba(${rgb}, 0)`);\\n    sx.fillStyle = g;\\n    sx.fillRect(0, 0, S, S);\\n    return c;\\n  }\\n  const SPRITES = {\\n    idle:      makeSprite('80, 95, 115',   0.30),\\n    thinking:  makeSprite('70, 165, 130',  0.55),   // jade — luminous\\n    delivered: makeSprite('150, 90, 55',   0.50),   // sienna, one-shot\\n  };\\n\\n  const STATES = {\\n    idle:      { sizeMin: 36, sizeMax:  60, life: 220 },\\n    thinking:  { sizeMin: 16, sizeMax:  28, life: 240 },\\n    delivered: { sizeMin: 50, sizeMax: 110, life: 300 },\\n  };\\n  let stateName = 'idle';\\n\\n  const particles = [];\\n  const N = 50, M = 100;          // virtual grid for the inject() API\\n\\n  // ─── Ray of light — a parametric rim walker ─────────────────\\n  // The tip walks the perimeter of the screen on a fixed\\n  // parametric path (no aimless drifting into the page interior).\\n  // Each frame, the tip's current position is pushed into a\\n  // bounded trail buffer. The trail is rendered as a thin,\\n  // multi-pass glowing line — outer halo, mid glow, bright core.\\n  // The whole thing reads as a single ray, not a smoke plume.\\n  // The .page surface is inset by --halo-inset (22px) and covers\\n  // everything from there to center. The thought wanders inside\\n  // the visible rim band, perturbed by smooth low-frequency noise\\n  // so it never traces a straight edge — it wavers like a slow\\n  // thought finding its way around the mind.\\n  const RIM_INSET = 11;\\n\\n  // Smooth pseudo-noise built from 4 sin oscillators. Output ~[-1, 1].\\n  // Frequencies span slow (drift) to fast (jitter) so the path has\\n  // both broad wandering and fine waver — not a sine wave.\\n  function smoothNoise(t, phase) {\\n    return (\\n      Math.sin(t * 0.00041 + phase)         * 0.42 +\\n      Math.sin(t * 0.00097 + phase * 1.7)   * 0.28 +\\n      Math.sin(t * 0.00211 + phase * 2.3)   * 0.18 +\\n      Math.sin(t * 0.00373 + phase * 3.1)   * 0.12\\n    );\\n  }\\n\\n  function rimPath(t) {\\n    const W = halo.width, H = halo.height;\\n    const w = W - 2 * RIM_INSET;\\n    const h = H - 2 * RIM_INSET;\\n    const perim = 2 * (w + h);\\n    let u = (((t % 1) + 1) % 1) * perim;\\n    let x, y, nx, ny;\\n    if (u < w)                  { x = RIM_INSET + u;             y = RIM_INSET;             nx = 0;  ny = 1;  }\\n    else if (u - w < h)         { x = W - RIM_INSET;             y = RIM_INSET + (u - w);   nx = -1; ny = 0;  }\\n    else if (u - w - h < w)     { x = W - RIM_INSET - (u-w-h);   y = H - RIM_INSET;         nx = 0;  ny = -1; }\\n    else                        { x = RIM_INSET;                 y = H - RIM_INSET - (u - 2*w - h); nx = 1; ny = 0; }\\n\\n    // Perturb perpendicular AND tangential to the rim direction.\\n    // Larger amplitude + multi-frequency noise + a tangential\\n    // displacement makes the thought wander truly randomly along\\n    // and across the rim, not glide along a smooth arc.\\n    const ms = performance.now();\\n    const perp = smoothNoise(ms, 0.0) * 22 * wanderAmp;     // across the rim\\n    const tang = smoothNoise(ms, 5.7) * 18 * wanderAmp;     // along the rim\\n    // Tangent vector is perpendicular to (nx, ny)\\n    const tx = -ny, ty = nx;\\n    return [x + nx * perp + tx * tang,\\n            y + ny * perp + ty * tang];\\n  }\\n\\n  // Tip state — only x, y are needed now; velocity comes from\\n  // the difference between consecutive parametric positions.\\n  const tip = { x: 0, y: 0 };\\n  let rimT = 0;\\n  let rimSpeed = 0;\\n  let wanderAmp = 1;        // 1 = full wander (thinking); ~0.12 = clean circuit (delivered)\\n  let deliveredAt = 0;     // timestamp the delivered bloom began\\n  let thinkingAt  = 0;     // timestamp thinking began (onset inhale bloom)\\n  [tip.x, tip.y] = rimPath(rimT);\\n\\n  // The trail buffer. Each entry is { x, y, born }. Older entries\\n  // are culled when their age exceeds TRAIL_LIFE_MS.\\n  const trail = [];\\n  const TRAIL_LIFE_MS = 2600;\\n\\n  function step() {\\n    // Re-measure each frame in case the canvas was 0×0 when the\\n    // script first ran (iframe layout race).\\n    if (halo.width < 50 || halo.height < 50) sizeHalo();\\n\\n    // Slower, pleasant pace. ~22 s per full lap. Tangential noise\\n    // varies speed so the thought lingers, then hurries — the way\\n    // a real thought finds its way around the mind.\\n    const ms = performance.now();\\n    const speedJitter = 1 + smoothNoise(ms, 4.2) * 0.55;\\n    let target = 0;\\n    if (stateName === 'thinking') {\\n      target = 0.00100 * speedJitter;\\n      wanderAmp += (1 - wanderAmp) * 0.05;            // ease back to full wander\\n    } else if (stateName === 'delivered') {\\n      // Delivered is an EVENT, not a journey. The traveling thought\\n      // halts and the whole rim BLOOMS gold at once (see render),\\n      // brightening then exhaling inward over ~1.8s, after which it\\n      // settles to idle. No wander, no circuit.\\n      target = 0;\\n      wanderAmp += (0.12 - wanderAmp) * 0.06;\\n      if (deliveredAt && ms - deliveredAt > 2100) {\\n        settleToIdle();\\n      }\\n    } else {\\n      // IDLE — the thought is not gone, it is resting. The tip stops\\n      // travelling and instead breathes in place: a short arc near the\\n      // app mark that gently brightens and dims on a slow cycle.\\n      // Presence without activity.\\n      target = 0;\\n      wanderAmp += (1 - wanderAmp) * 0.05;\\n    }\\n    rimSpeed += (target - rimSpeed) * 0.05;\\n    rimT += rimSpeed;\\n    [tip.x, tip.y] = rimPath(rimT);\\n\\n    // ── IDLE shows nothing — no resting trail. ──────────────\\n\\n    // Record only when actually moving (otherwise we'd stack\\n    // identical points and fail to fade visibly).\\n    const now = performance.now();\\n    if (rimSpeed > 0.00015) {\\n      trail.push({ x: tip.x, y: tip.y, born: now });\\n    }\\n    while (trail.length && now - trail[0].born > TRAIL_LIFE_MS) {\\n      trail.shift();\\n    }\\n\\n    // Burst particles (from solver.inject calls — delivered + atom\\n    // taps) live alongside the trail. Tiny update, then cull.\\n    for (const p of particles) {\\n      p.age++;\\n      p.vx *= 0.985; p.vy *= 0.985;\\n      p.x  += p.vx;  p.y  += p.vy;\\n      p.size += 0.04;\\n    }\\n    for (let i = particles.length - 1; i >= 0; i--) {\\n      if (particles[i].age > particles[i].life) particles.splice(i, 1);\\n    }\\n\\n    // ── Render ──────────────────────────────────────────────\\n    haloCtx.clearRect(0, 0, halo.width, halo.height);\\n\\n    if (trail.length > 1) {\\n      haloCtx.lineCap = 'round';\\n      haloCtx.lineJoin = 'round';\\n\\n      // Color shifts by state: jade while thinking, warm gold once\\n      // the answer is delivered. Old segments keep the line coherent.\\n      const C = (stateName === 'delivered')\\n        ? { aura: '208, 168, 92', mid: '216, 180, 108', core: '250, 240, 214' }\\n        : { aura: '70, 165, 130',  mid: '80, 180, 142',  core: '190, 230, 208' };\\n\\n      // Pass 1 — OUTER AURA (wide, soft)\\n      haloCtx.strokeStyle = `rgba(${C.aura}, 0.40)`;\\n      haloCtx.lineWidth = 18;\\n      for (let i = 1; i < trail.length; i++) {\\n        const age = now - trail[i].born;\\n        const a = 1 - age / TRAIL_LIFE_MS;\\n        if (a <= 0) continue;\\n        haloCtx.globalAlpha = a * a * 0.55;\\n        haloCtx.beginPath();\\n        haloCtx.moveTo(trail[i-1].x, trail[i-1].y);\\n        haloCtx.lineTo(trail[i].x,   trail[i].y);\\n        haloCtx.stroke();\\n      }\\n\\n      // Pass 2 — MID GLOW (soft saturated body)\\n      haloCtx.strokeStyle = `rgba(${C.mid}, 0.72)`;\\n      haloCtx.lineWidth = 5;\\n      for (let i = 1; i < trail.length; i++) {\\n        const age = now - trail[i].born;\\n        const a = 1 - age / TRAIL_LIFE_MS;\\n        if (a <= 0) continue;\\n        const bf = trail[i].breath != null ? trail[i].breath : 1;\\n        haloCtx.globalAlpha = a * 0.70 * bf;\\n        haloCtx.beginPath();\\n        haloCtx.moveTo(trail[i-1].x, trail[i-1].y);\\n        haloCtx.lineTo(trail[i].x,   trail[i].y);\\n        haloCtx.stroke();\\n      }\\n\\n      // Pass 3 — CORE (gentle highlight — thought, not laser)\\n      haloCtx.strokeStyle = `rgba(${C.core}, 0.85)`;\\n      haloCtx.lineWidth = 1.4;\\n      for (let i = 1; i < trail.length; i++) {\\n        const age = now - trail[i].born;\\n        const a = 1 - age / TRAIL_LIFE_MS;\\n        if (a <= 0) continue;\\n        haloCtx.globalAlpha = a * 0.55;\\n        haloCtx.beginPath();\\n        haloCtx.moveTo(trail[i-1].x, trail[i-1].y);\\n        haloCtx.lineTo(trail[i].x,   trail[i].y);\\n        haloCtx.stroke();\\n      }\\n\\n      haloCtx.globalAlpha = 1;\\n    }\\n\\n    // Burst particles render last (delivered flare, atom taps)\\n    for (const p of particles) {\\n      const lifeT = p.age / p.life;\\n      const fade = lifeT < 0.15 ? lifeT / 0.15 : 1 - (lifeT - 0.15) / 0.85;\\n      const alpha = Math.max(0, Math.min(1, fade));\\n      haloCtx.globalAlpha = alpha;\\n      haloCtx.drawImage(\\n        p.sprite,\\n        p.x - p.size / 2,\\n        p.y - p.size / 2,\\n        p.size, p.size\\n      );\\n    }\\n    haloCtx.globalAlpha = 1;\\n\\n    // ── DELIVERED BLOOM ───────────────────────────────────────\\n    // An event, not a journey: the whole rim glows gold at once,\\n    // brightening then exhaling inward. A soft ring of light that\\n    // says \\\"arrived / complete\\\" and dissipates over ~2.1s.\\n    if (stateName === 'delivered' && deliveredAt) {\\n      const W = halo.width, H = halo.height;\\n      const t = Math.min(1, (now - deliveredAt) / 2100);   // 0..1 over the event\\n      // Envelope: rise fast (to ~0.18), hold, exhale out.\\n      const env = t < 0.22\\n        ? (t / 0.22)\\n        : 1 - ((t - 0.22) / 0.78);\\n      const e = Math.max(0, Math.min(1, env));\\n      // The glow band sits just inside the screen edge and its width\\n      // grows as it exhales inward, while its alpha falls.\\n      const band = 10 + (1 - e) * 26;          // px: thin at peak, wide as it fades\\n      haloCtx.save();\\n      haloCtx.globalCompositeOperation = 'source-over';\\n      // Four edge strips drawn as gradients fading toward center.\\n      const g = '212, 172, 96';                // warm gold\\n      function edge(x0, y0, x1, y1, gx0, gy0, gx1, gy1) {\\n        const grad = haloCtx.createLinearGradient(gx0, gy0, gx1, gy1);\\n        grad.addColorStop(0, `rgba(${g}, ${0.55 * e})`);\\n        grad.addColorStop(1, `rgba(${g}, 0)`);\\n        haloCtx.fillStyle = grad;\\n        haloCtx.fillRect(x0, y0, x1 - x0, y1 - y0);\\n      }\\n      edge(0, 0, W, band,             0, 0, 0, band);               // top\\n      edge(0, H - band, W, H,         0, H, 0, H - band);           // bottom\\n      edge(0, 0, band, H,             0, 0, band, 0);               // left\\n      edge(W - band, 0, W, H,         W, 0, W - band, 0);           // right\\n      // A bright hairline exactly on the rim at peak.\\n      haloCtx.globalAlpha = e;\\n      haloCtx.strokeStyle = `rgba(250, 240, 214, ${0.7 * e})`;\\n      haloCtx.lineWidth = 1.4;\\n      haloCtx.strokeRect(RIM_INSET, RIM_INSET, W - 2*RIM_INSET, H - 2*RIM_INSET);\\n      haloCtx.restore();\\n      haloCtx.globalAlpha = 1;\\n    }\\n\\n    // ── THINKING ONSET INHALE ─────────────────────────────────\\n    // A quick, soft jade bloom-in when thinking begins — same DNA\\n    // as the delivered bloom, so the two states read as one family.\\n    // Fires once over ~0.7s, then the wandering thought takes over.\\n    if (stateName === 'thinking' && thinkingAt) {\\n      const W = halo.width, H = halo.height;\\n      const t = (now - thinkingAt) / 700;\\n      if (t >= 1) {\\n        thinkingAt = 0;\\n      } else {\\n        // inhale: rise then settle (gentler + shorter than delivered)\\n        const env = t < 0.35 ? (t / 0.35) : 1 - ((t - 0.35) / 0.65);\\n        const e = Math.max(0, Math.min(1, env)) * 0.7;\\n        const band = 8 + (1 - e) * 20;\\n        const g = '70, 165, 130';            // jade\\n        haloCtx.save();\\n        const strip = (x0, y0, x1, y1, gx0, gy0, gx1, gy1) => {\\n          const grad = haloCtx.createLinearGradient(gx0, gy0, gx1, gy1);\\n          grad.addColorStop(0, `rgba(${g}, ${0.5 * e})`);\\n          grad.addColorStop(1, `rgba(${g}, 0)`);\\n          haloCtx.fillStyle = grad;\\n          haloCtx.fillRect(x0, y0, x1 - x0, y1 - y0);\\n        };\\n        strip(0, 0, W, band,       0, 0, 0, band);\\n        strip(0, H - band, W, H,   0, H, 0, H - band);\\n        strip(0, 0, band, H,       0, 0, band, 0);\\n        strip(W - band, 0, W, H,   W, 0, W - band, 0);\\n        haloCtx.restore();\\n        haloCtx.globalAlpha = 1;\\n      }\\n    }\\n  }\\n\\n  step();\\n  setInterval(step, 32);\\n\\n  // Compatibility API for the rest of the file — older code calls\\n  // solver.inject(gx, gy, dx, dy, density) on grid coords.\\n  const solver = {\\n    inject(gx, gy, dx, dy, density) {\\n      const x = (gx / N) * halo.width;\\n      const y = (gy / M) * halo.height;\\n      const burst = Math.max(1, Math.round(density * 3));\\n      const prof = STATES[stateName];\\n      for (let i = 0; i < burst; i++) {\\n        particles.push({\\n          x: x + (Math.random() - 0.5) * 18,\\n          y: y + (Math.random() - 0.5) * 18,\\n          vx: dx * 0.014 + (Math.random() - 0.5) * 0.25,\\n          vy: dy * 0.014 + (Math.random() - 0.5) * 0.25,\\n          age: 0,\\n          life: 220 + Math.random() * 120,\\n          size: prof.sizeMin + Math.random() * (prof.sizeMax - prof.sizeMin),\\n          wobble: Math.random() * Math.PI * 2,\\n          sprite: SPRITES[stateName],\\n        });\\n      }\\n    },\\n  };\\n  // startSeeds remains a no-op anchor — population is auto-maintained\\n  // from the state profile each frame.\\n  function startSeeds(_) { /* no-op: target-based population */ }\\n\\n  // ─── (No inline vapor plume — the halo signals thinking.) ─────\\n\\n  // ─── STATE TOGGLE ─────────────────────────────────────────\\n  const thinkingTurn = document.getElementById('thinking-turn');\\n  function settleToIdle() {\\n    deliveredAt = 0;\\n    stateName = 'idle';\\n    document.querySelectorAll('.state-toggle button').forEach(x => {\\n      x.classList.toggle('active', x.dataset.state === 'idle');\\n    });\\n  }\\n  function setState(name) {\\n    const prev = stateName;\\n    stateName = name;\\n    if (name === 'delivered') {\\n      deliveredAt = performance.now();\\n    } else {\\n      deliveredAt = 0;\\n    }\\n    // Thinking opens with a soft inhale bloom — same visual DNA as\\n    // delivered, so the two read as one family. Fire only on a fresh\\n    // entry into thinking.\\n    if (name === 'thinking' && prev !== 'thinking') {\\n      thinkingAt = performance.now();\\n    } else if (name !== 'thinking') {\\n      thinkingAt = 0;\\n    }\\n  }\\n  document.querySelectorAll('.state-toggle button').forEach(b => {\\n    b.addEventListener('click', () => {\\n      document.querySelectorAll('.state-toggle button').forEach(x => x.classList.remove('active'));\\n      b.classList.add('active');\\n      setState(b.dataset.state);\\n    });\\n  });\\n\\n  // ─── Index gesture (wayfinding) ──────────────────────────\\n  const appMark = document.getElementById('app-mark');\\n  const indexOverlay = document.getElementById('index-overlay');\\n  if (appMark && indexOverlay) {\\n    appMark.addEventListener('click', () => indexOverlay.classList.toggle('open'));\\n    indexOverlay.addEventListener('click', (e) => { if (e.target === indexOverlay) indexOverlay.classList.remove('open'); });\\n  }\\n\\n  // ─── ssatom: capsule ↔ letter morph ───────────────────────\\n  document.querySelectorAll('[data-atom]').forEach(atom => {\\n    const capsule = atom.querySelector('.atom-capsule');\\n    if (!capsule) return;\\n    capsule.addEventListener('click', (e) => {\\n      const willOpen = !atom.classList.contains('open');\\n      atom.classList.toggle('open');\\n      // EO pulse from tap point\\n      const r = capsule.getBoundingClientRect();\\n      const ring = document.createElement('span');\\n      ring.className = 'eo-ring';\\n      ring.style.left = (e.clientX - r.left) + 'px';\\n      ring.style.top  = (e.clientY - r.top)  + 'px';\\n      capsule.appendChild(ring);\\n      setTimeout(() => ring.remove(), 970);\\n      // and a small bump into the halo so the screen \\\"registers\\\" the action\\n      for (let k = 0; k < 6; k++) {\\n        const side = Math.floor(Math.random() * 4);\\n        let gx, gy;\\n        if (side === 0) { gx = 1 + Math.random()*(N-2); gy = 1 + Math.random() * 4; }\\n        else if (side === 1) { gx = 1 + Math.random()*(N-2); gy = M - 1 - Math.random() * 4; }\\n        else if (side === 2) { gx = 1 + Math.random() * 3; gy = 1 + Math.random()*(M-2); }\\n        else                 { gx = N - 1 - Math.random() * 3; gy = 1 + Math.random()*(M-2); }\\n        solver.inject(gx, gy, (Math.random()-0.5) * 90, (Math.random()-0.5) * 90, 0.7);\\n      }\\n    });\\n  });\\n\\n  // ─── Halo bridge — let the shared capture module drive this\\n  //     screen's halo when a thought is sent. Capture itself lives\\n  //     in atlas-capture.js, summoned in place.\\n  window.__atlasHalo = { setState };\\n})();\\n<\\/script>\\n<!--CAPJS-->\\n\\n\\n<script>\\n(function(){\\n  function nav(h){ try{ parent.postMessage({atlasNav:h},'*'); }catch(e){} }\\n  document.addEventListener('click', function(e){\\n    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\\n    if(!a) return;\\n    var href = a.getAttribute('href') || '';\\n    if(/\\\\.html(\\\\?|#|$)/i.test(href)){ e.preventDefault(); e.stopPropagation(); nav(href); }\\n  }, true);\\n  document.addEventListener('keydown', function(e){\\n    var t = e.target;\\n    if(t && (/(INPUT|TEXTAREA)/.test(t.tagName) || t.isContentEditable)) return;\\n    if(e.key==='ArrowLeft') nav('@prev');\\n    else if(e.key==='ArrowRight') nav('@next');\\n  });\\n})();\\n<\\/script>\\n<\\/body>\\n<\\/html>\\n\",\"brief\":\"<!doctype html>\\n<html lang=\\\"en\\\">\\n<head>\\n<meta charset=\\\"utf-8\\\" />\\n<meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\" />\\n<title>Atlas v0.6 — Brief × Halo<\\/title>\\n\\n<!--FONTS-->\\n\\n<style>\\n  :root {\\n    --desk:        #ededea;\\n    --paper:       #ffffff;\\n    --paper-deep:  #f7f7f5;\\n    --card:        #ffffff;\\n\\n    --ink:         #0d141a;\\n    --ink-2:       #2c3942;\\n    --ink-3:       #6a7480;\\n    --ink-4:       #aab2bb;\\n\\n    --rule:        rgba(40, 44, 52, 0.10);\\n    --rule-soft:   rgba(40, 44, 52, 0.05);\\n\\n    --shadow-1:\\n      0 0.5px 1px rgba(20, 24, 32, 0.04),\\n      2px 4px 10px -4px rgba(20, 24, 32, 0.06),\\n      4px 12px 28px -14px rgba(20, 24, 32, 0.10);\\n    --shadow-2:\\n      0 1px 1px rgba(20, 24, 32, 0.05),\\n      3px 6px 14px -4px rgba(20, 24, 32, 0.09),\\n      6px 16px 32px -10px rgba(20, 24, 32, 0.14);\\n\\n    --teal:        #0089a8;\\n    --teal-deep:   #00576b;\\n    --jade:        #5a8f74;\\n    --forest:      #0d3324;\\n    --ember:       #b8431e;\\n\\n    --serif: 'Instrument Serif', 'Times New Roman', serif;\\n    --sans:  'Manrope', -apple-system, system-ui, sans-serif;\\n    --mono:  'JetBrains Mono', ui-monospace, Menlo, monospace;\\n\\n    --halo-inset:  22px;\\n    --halo-radius: 32px;\\n  }\\n\\n  * { box-sizing: border-box; }\\n  html, body {\\n    margin: 0; padding: 0;\\n    background: var(--desk);\\n    color: var(--ink);\\n    font-family: var(--sans);\\n    -webkit-font-smoothing: antialiased;\\n    -moz-osx-font-smoothing: grayscale;\\n    overflow-x: hidden;\\n  }\\n\\n  main {\\n    min-height: 100vh;\\n    padding: 40px 16px 80px;\\n    display: grid;\\n    grid-template-columns: 1fr;\\n    place-items: start center;\\n    gap: 20px;\\n  }\\n  .page-meta {\\n    width: 100%; max-width: 720px;\\n    display: flex; gap: 12px; align-items: baseline;\\n    color: var(--ink-3);\\n  }\\n  .page-meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); animation: gentle 2.4s ease-in-out infinite; align-self: center; }\\n  @keyframes gentle { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }\\n  .page-meta .micro { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; }\\n  .page-meta .title { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--ink-2); margin-left: auto; }\\n\\n  .state-toggle {\\n    width: 100%; max-width: 393px;\\n    display: flex; gap: 4px; padding: 4px;\\n    background: rgba(40, 44, 52, 0.05);\\n    border-radius: 999px;\\n    border: 1px solid var(--rule-soft);\\n  }\\n  .state-toggle button {\\n    flex: 1; padding: 7px 8px;\\n    background: transparent; border: 0; border-radius: 999px;\\n    font-family: var(--mono); font-size: 10px;\\n    letter-spacing: 0.1em; text-transform: uppercase;\\n    color: var(--ink-3); cursor: pointer;\\n    transition: background 200ms, color 200ms;\\n  }\\n  .state-toggle button.active { background: var(--ink); color: #fff; }\\n\\n  /* ── Phone ──────────────────────────────────────────────── */\\n  .phone {\\n    width: 393px; height: 852px;\\n    background: #0c0d10;\\n    border-radius: 54px; padding: 11px;\\n    position: relative;\\n    box-shadow:\\n      0 1px 0 rgba(255,255,255,0.05) inset,\\n      0 -1px 0 rgba(0,0,0,0.4) inset,\\n      0 40px 90px -30px rgba(20,24,32,0.22),\\n      0 15px 35px -10px rgba(20,24,32,0.12);\\n  }\\n  .phone .screen {\\n    width: 100%; height: 100%;\\n    background: var(--paper-deep);\\n    border-radius: 44px; overflow: hidden; position: relative;\\n  }\\n  .phone .island {\\n    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);\\n    width: 126px; height: 36px; background: #000; border-radius: 999px;\\n    z-index: 80; pointer-events: none;\\n  }\\n  .phone .home {\\n    position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);\\n    width: 140px; height: 5px; background: rgba(0,0,0,0.85);\\n    border-radius: 999px; z-index: 80; pointer-events: none;\\n  }\\n  .halo-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; image-rendering: auto; filter: blur(1.6px); }\\n  .page {\\n    position: absolute;\\n    top: var(--halo-inset); left: var(--halo-inset);\\n    right: var(--halo-inset); bottom: var(--halo-inset);\\n    background: var(--paper);\\n    border-radius: var(--halo-radius);\\n    overflow: hidden; z-index: 2;\\n    box-shadow: inset 0 0 80px rgba(20,24,32,0.04), 0 1px 2px rgba(20,24,32,0.04);\\n  }\\n\\n  .statusbar {\\n    position: absolute; top: 6px; left: 0; right: 0;\\n    display: flex; justify-content: space-between; align-items: center;\\n    padding: 0 22px; z-index: 30;\\n    font-family: -apple-system, \\\"SF Pro\\\", system-ui;\\n    font-weight: 600; font-size: 14.5px; color: var(--ink); pointer-events: none;\\n  }\\n  .statusbar .indicators { display: flex; gap: 5px; align-items: center; }\\n\\n  /* ── Top bar: back + brief crumb ────────────────────────── */\\n  .topbar {\\n    position: absolute; top: 30px; left: 0; right: 0;\\n    display: flex; align-items: center; justify-content: space-between;\\n    padding: 0 20px; z-index: 25;\\n  }\\n  .back {\\n    display: inline-flex; align-items: center; gap: 6px;\\n    background: transparent; border: 0; padding: 0; cursor: pointer;\\n    color: var(--ink-2); font-family: var(--sans); font-size: 14px;\\n    text-decoration: none;\\n  }\\n  .back svg { display: block; }\\n  .crumb {\\n    font-family: var(--mono); font-size: 9.5px;\\n    letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);\\n  }\\n  .crumb-mark { background: transparent; border: 0; padding: 4px 0; cursor: pointer; }\\n  .index-overlay { position: absolute; inset: 0; z-index: 90; pointer-events: none; }\\n  .index-overlay::before { content: ''; position: absolute; inset: 0; background: rgba(13,20,26,0); transition: background 300ms; }\\n  .index-overlay.open { pointer-events: auto; }\\n  .index-overlay.open::before { background: rgba(13,20,26,0.34); }\\n  .index-sheet { position: absolute; top: var(--halo-inset); left: var(--halo-inset); right: var(--halo-inset); background: rgba(255,255,255,0.9); backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2); border-radius: var(--halo-radius) var(--halo-radius) 22px 22px; padding: 56px 24px 24px; transform: translateY(-104%); transition: transform 420ms cubic-bezier(.34,1.12,.64,1); box-shadow: 0 18px 40px -16px rgba(20,24,32,0.22); }\\n  .index-overlay.open .index-sheet { transform: translateY(0) !important; }\\n  .index-sheet .ix-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }\\n  .index-sheet a { display: flex; align-items: baseline; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--rule-soft); text-decoration: none; color: var(--ink); }\\n  .index-sheet a:last-of-type { border-bottom: 0; }\\n  .index-sheet a .n { font-family: var(--serif); font-style: italic; font-size: 24px; }\\n  .index-sheet a .c { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; color: var(--ink-3); }\\n  .index-sheet .handle { width: 40px; height: 4px; border-radius: 999px; background: var(--ink-4); opacity: 0.5; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); }\\n\\n  /* ── Scroll ─────────────────────────────────────────────── */\\n  .conv {\\n    position: absolute; inset: 64px 0 96px 0;\\n    overflow-y: auto; overflow-x: hidden;\\n    padding: 6px 22px 16px; z-index: 10;\\n  }\\n  .conv::-webkit-scrollbar { width: 0; height: 0; }\\n\\n  /* ── Brief masthead — Ayumi's framing line ──────────────── */\\n  .brief-open { padding: 8px 0 4px; }\\n  .brief-open .meta {\\n    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;\\n  }\\n  .brief-open .meta .avatar {\\n    width: 18px; height: 18px; border-radius: 50%;\\n    background: var(--ink); position: relative; overflow: hidden;\\n  }\\n  .brief-open .meta .avatar::after {\\n    content: ''; position: absolute; inset: 0;\\n    background: radial-gradient(circle at 35% 30%, rgba(122,214,198,0.9), rgba(90,143,116,0.5) 60%, rgba(0,0,0,0) 100%);\\n    animation: gentle 2.4s ease-in-out infinite;\\n  }\\n  .brief-open .meta .name { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ink); }\\n  .brief-open .meta .when { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; color: var(--ink-4); margin-left: auto; }\\n  .brief-open .framing {\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 21px; line-height: 1.34; color: var(--ink);\\n    letter-spacing: -0.004em; text-wrap: pretty;\\n  }\\n  .brief-open .framing .roman { font-style: normal; }\\n  .brief-open .framing em.accent {\\n    font-style: normal;\\n    background: linear-gradient(180deg, transparent 64%, rgba(0,137,168,0.16) 64%, rgba(0,137,168,0.16) 92%, transparent 92%);\\n    padding: 0 1px;\\n  }\\n\\n  /* The big title */\\n  .brief-title {\\n    margin: 18px 0 2px;\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 46px; line-height: 0.98; letter-spacing: -0.02em;\\n    color: var(--ink);\\n  }\\n  .brief-sub {\\n    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;\\n    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--ink-3);\\n  }\\n  .brief-sub .when { color: var(--teal-deep); }\\n  .brief-sub .div { width: 1px; height: 9px; background: var(--rule); }\\n\\n  /* ── Section ────────────────────────────────────────────── */\\n  .sec { margin-top: 22px; }\\n  .sec .label {\\n    font-family: var(--mono); font-size: 9px;\\n    letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3);\\n    margin-bottom: 10px;\\n  }\\n\\n  /* Person */\\n  .person { display: flex; gap: 13px; align-items: flex-start; }\\n  .avatar-obsidian {\\n    width: 50px; height: 50px; border-radius: 50%;\\n    background: #14181c; position: relative; overflow: hidden; flex-shrink: 0;\\n    display: flex; align-items: center; justify-content: center;\\n    color: #fffceb; font-family: var(--serif); font-size: 21px;\\n    box-shadow: 0 1px 2px rgba(0,0,0,0.18);\\n  }\\n  .avatar-obsidian::before {\\n    content: ''; position: absolute; inset: 0;\\n    background: radial-gradient(ellipse 50% 40% at 32% 28%, rgba(255,252,235,0.5), rgba(255,252,235,0) 60%);\\n  }\\n  .person .body { flex: 1; min-width: 0; }\\n  .person .name { font-family: var(--serif); font-size: 21px; line-height: 1.1; }\\n  .person .role { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ink-2); margin-top: 2px; }\\n  .person .facts { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }\\n  .person .fact { display: flex; gap: 8px; align-items: baseline; font-family: var(--serif); font-size: 15px; line-height: 1.4; color: var(--ink-2); text-wrap: pretty; }\\n  .person .fact .b { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-4); flex-shrink: 0; transform: translateY(-3px); }\\n\\n  /* Timeline */\\n  .timeline { position: relative; padding-left: 16px; border-left: 1px solid var(--rule); }\\n  .ti { padding: 6px 0 12px; position: relative; }\\n  .ti::before {\\n    content: ''; position: absolute; left: -20.5px; top: 12px;\\n    width: 7px; height: 7px; border-radius: 50%; background: var(--ink);\\n  }\\n  .ti.inferred::before { background: transparent; border: 1px solid var(--ink); }\\n  .ti .date { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; color: var(--ink-3); }\\n  .ti .text { font-family: var(--serif); font-size: 15px; line-height: 1.45; color: var(--ink-2); margin-top: 3px; text-wrap: pretty; }\\n  .ti.inferred .text { font-style: italic; }\\n  .ti .cite {\\n    margin-top: 5px; font-family: var(--mono); font-size: 9px;\\n    letter-spacing: 0.06em; color: var(--teal-deep); cursor: pointer;\\n    display: inline-flex; align-items: center; gap: 5px;\\n    background: transparent; border: 0; padding: 0;\\n  }\\n  .ti .cite::before { content: ''; width: 4px; height: 4px; border-radius: 50%; border: 1px solid var(--teal-deep); }\\n\\n  /* Predictions */\\n  .predict { display: flex; flex-direction: column; }\\n  .pi {\\n    padding: 11px 0; border-bottom: 1px solid var(--rule-soft);\\n    display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: baseline;\\n  }\\n  .pi:last-child { border-bottom: 0; }\\n  .pi .text { font-family: var(--serif); font-style: italic; font-size: 15.5px; line-height: 1.4; color: var(--ink-2); text-wrap: pretty; }\\n  .pi .conf { justify-self: end; font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }\\n  .conf.high { background: #d9e7d8; color: #16321e; }\\n  .conf.med  { background: var(--paper-deep); color: var(--ink-2); border: 1px solid var(--rule); }\\n  .conf.low  { background: #fbe3d9; color: #6c2310; }\\n\\n  /* Tactical — Ayumi's recommendation, jade */\\n  .tactical {\\n    background: linear-gradient(180deg, #dceae0 0%, #cfe2d6 100%);\\n    color: #16321e; border-radius: 12px; padding: 16px 18px;\\n    position: relative; overflow: hidden;\\n  }\\n  .tactical::before {\\n    content: ''; position: absolute; top: -30%; left: -10%;\\n    width: 60%; height: 90%;\\n    background: radial-gradient(circle, rgba(255,255,255,0.5), rgba(255,255,255,0) 60%);\\n    pointer-events: none;\\n  }\\n  .tactical .k { font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(20,50,30,0.7); position: relative; }\\n  .tactical .b { font-family: var(--serif); font-style: italic; font-size: 17px; line-height: 1.45; margin-top: 8px; position: relative; text-wrap: pretty; }\\n  .tactical .cite {\\n    margin-top: 10px; position: relative;\\n    font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em;\\n    color: #1f6647; cursor: pointer; background: transparent; border: 0; padding: 0;\\n    display: inline-flex; align-items: center; gap: 5px;\\n  }\\n  .tactical .cite::before { content: ''; width: 4px; height: 4px; border-radius: 50%; border: 1px solid #1f6647; }\\n\\n  /* Quote */\\n  .quote {\\n    position: relative; padding: 6px 0 6px 18px;\\n    border-left: 2px solid var(--rule);\\n    margin-top: 4px;\\n  }\\n  .quote .b { font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.4; color: var(--ink); text-wrap: pretty; }\\n  .quote .a { margin-top: 8px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; color: var(--ink-3); }\\n\\n  /* Materials checklist */\\n  .checklist { display: flex; flex-direction: column; }\\n  .chk {\\n    display: flex; align-items: center; gap: 11px;\\n    padding: 10px tle\\\">Receipt<\\/div>\\n              <div class=\\\"deck\\\" id=\\\"rt-deck\\\"><\\/div>\\n              <div id=\\\"rt-srcs\\\"><\\/div>\\n              <div class=\\\"anchor\\\">Anchored · obsidian seal<\\/div>\\n            <\\/div>\\n          <\\/div>\\n\\n        <\\/div>\\n      <\\/div>\\n      <div class=\\\"island\\\"><\\/div>\\n      <div class=\\\"home\\\"><\\/div>\\n    <\\/div>\\n  <\\/div>\\n\\n<\\/main>\\n\\n<!--HALOENGINE-->\\n<!--CAPJS-->\\n<script>\\n(() => {\\n  const halo = AtlasHalo.init(document.getElementById('halo'));\\n  window.__atlasHalo = halo;\\n\\n  // State toggle\\n  document.querySelectorAll('.state-toggle button').forEach(b => {\\n    b.addEventListener('click', () => {\\n      document.querySelectorAll('.state-toggle button').forEach(x => x.classList.remove('active'));\\n      b.classList.add('active');\\n      halo.setState(b.dataset.state);\\n    });\\n  });\\n\\n  // Materials checklist\\n  document.querySelectorAll('#checklist .chk').forEach(c => {\\n    c.addEventListener('click', () => c.classList.toggle('on'));\\n  });\\n\\n  // Receipts\\n  const RECEIPTS = {\\n    tw:  { title: 'He liked your <em>tweet<\\/em> about the M6 curve.', deck: 'First signal Karan reads your public writing.',\\n           srcs: [{ k:'email', kind:'twitter', ref:'Twitter · @karanm liked · 2026-03-02 18:42' }] },\\n    em:  { title: 'No reply yet to the <em>data-room email.<\\/em>', deck: 'Thread is open; he read it twice on his phone.',\\n           srcs: [{ k:'email', kind:'gmail', ref:'sent 2026-05-16 09:11 · 2 opens' }] },\\n    tac: { title: 'Lead with <em>retention,<\\/em> not the round.', deck: 'Two traces support this.',\\n           srcs: [{ k:'email', kind:'email', ref:'karan@sequoiacap.com · 2026-01-15 09:33' },\\n                  { k:'voice', kind:'voice', ref:'voice memo · 2026-05-26 walk · 02:11 in' }] },\\n  };\\n  const overlay = document.getElementById('receipt-overlay');\\n  const rt = { title: document.getElementById('rt-titl  class=\\\"amt\\\">₹9,200<\\/span><\\/div>\\n                <div class=\\\"li\\\"><span class=\\\"sw\\\" style=\\\"background:var(--sand)\\\"><\\/span>Food<span class=\\\"amt\\\">₹4,150<\\/span><\\/div>\\n                <div class=\\\"li\\\"><span class=\\\"sw\\\" style=\\\"background:var(--ink-4)\\\"><\\/span>Travel<span class=\\\"amt\\\">₹3,000<\\/span><\\/div>\\n              <\\/div>\\n              <div class=\\\"spend-note\\\">Flights &amp; stays came from your Gmail; food I read off card swipes. The two unbooked legs — about <span class=\\\"gap\\\" data-receipt=\\\"spend-gap\\\">₹4,400<\\/span> — aren't counted yet.<\\/div>\\n            <\\/div>\\n\\n            <!-- RECOMMENDATIONS -->\\n            <div class=\\\"sec\\\">\\n              <div class=\\\"label\\\">You'd love, near you<\\/div>\\n              <div class=\\\"recs\\\">\\n                <div class=\\\"rec\\\">\\n                  <div class=\\\"thumb r2\\\"><span class=\\\"g\\\"><\\/span><\\/div>\\n                  <div class=\\\"body\\\">\\n                    <div class=\\\"nm\\\">Pyramid Café, Tapovan<\\/div>\\n                    <div class=\\\"pl\\\">Rishikesh · 700m from your stay<\\/div>\\n                    <div class=\\\"why\\\">Single-origin pour-overs. <b>You rate specialty coffee everywhere you go<\\/b> — Blue Tokai is your most-visited place in Bangalore.<\\/div>\\n                  <\\/div>\\n                <\\/div>\\n                <div class=\\\"rec\\\">\\n                  <div class=\\\"thumb r1\\\"><span class=\\\"g\\\"><\\/span><\\/div>\\n                  <div class=\\\"body\\\">\\n                    <div class=\\\"nm\\\">Beatles Ashram, dawn slot<\\/div>\\n                    <div class=\\\"pl\\\">Rishikesh · opens 09:00<\\/div>\\n                    <div class=\\\"why\\\">Quiet murals, almost empty before ten. <b>You linger in places like this<\\/b> — you spent 90 min at the Nainital lake at sunrise.<\\/div>\\n                  <\\/div>\\n                <\\/div>\\n                <div class=\\\"rec\\\">\\n                  <div class=\\\"thumb r3\\\"><span class=\\\"g\\\"><\\/span><\\/div>\\n                  <div class=\\\"body\\\">\\n                    <div class=\\\"nm\\\">Kheerganga overnight trek<\\/div>\\n                    <div class=\\\"pl\\\">Kasol · book a day ahead<\\/div>\\n                    <div class=\\\"why\\\">12km, hot spring at the top. <b>Matches the trek you searched twice<\\/b> and your step pace handles the climb.<\\/div>\\n                  <\\/div>\\n                <\\/div>\\n              <\\/div>\\n            <\\/div>\\n\\n            <!-- LIVE TRACKING -->\\n            <div class=\\\"sec\\\">\\n              <div class=\\\"label\\\">Tracking, live<\\/div>\\n              <div class=\\\"track-grid\\\">\\n                <div class=\\\"tcard\\\">\\n                  <div class=\\\"tk\\\"><span class=\\\"d\\\"><\\/span>Places<\\/div>\\n                  <div class=\\\"tv\\\">2<span class=\\\"u\\\"> / 5<\\/span><\\/div>\\n                  <div class=\\\"tsub\\\">Delhi · Nainital logged<\\/div>\\n                  <div class=\\\"dots\\\"><span class=\\\"pd on\\\"><\\/span><span class=\\\"pd on\\\"><\\/span><span class=\\\"pd here\\\"><\\/span><span class=\\\"pd\\\"><\\/span><span class=\\\"pd\\\"><\\/span><\\/div>\\n                <\\/div>\\n                <div class=\\\"tcard\\\">\\n                  <div class=\\\"tk\\\"><span class=\\\"d\\\"><\\/span>Steps · today<\\/div>\\n                  <div class=\\\"tv\\\">11.2<span class=\\\"u\\\">k<\\/span><\\/div>\\n                  <div class=\\\"tsub\\\">+38% over your daily avg<\\/div>\\n                  <div class=\\\"bars\\\"><i style=\\\"height:40%\\\"><\\/i><i style=\\\"height:64%\\\"><\\/i><i style=\\\"height:52%\\\"><\\/i><i style=\\\"height:88%\\\"><\\/i><i style=\\\"height:70%\\\"><\\/i><i style=\\\"height:100%\\\" class=\\\"\\\"><\\/i><i style=\\\"height:30%\\\" class=\\\"dim\\\"><\\/i><\\/div>\\n                <\\/div>\\n                <div class=\\\"tcard wide\\\">\\n                  <div class=\\\"tk\\\"><span class=\\\"d\\\"><\\/span>This trip · so far<\\/div>\\n                  <div class=\\\"tv\\\" style=\\\"font-size:24px;\\\">61<span class=\\\"u\\\">k steps<\\/span> &nbsp;·&nbsp; 1,840<span class=\\\"u\\\">m climbed<\\/span> &nbsp;·&nbsp; 5<span class=\\\"u\\\"> days<\\/span><\\/div>\\n                  <div class=\\\"tsub\\\">From Apple Health · since May 30<\\/div>\\n                <\\/div>\\n              <\\/div>\\n            <\\/div>\\n\\n            <!-- CONNECTORS -->\\n            <div class=\\\"sec\\\">\\n              <div class=\\\"label\\\">To serve you better<\\/div>\\n              <div class=\\\"conn-intro\\\">Here's what I'm reading — and what I'd reach for next. Grant a source and this chapter gets sharper on its own.<\\/div>\\n\\n              <div class=\\\"conn\\\">\\n                <div class=\\\"ic gmail\\\">G<\\/div>\\n                <div class=\\\"m\\\"><div class=\\\"nm\\\">Gmail<\\/div><div class=\\\"role\\\">Found your flights &amp; both hotel bookings.<\\/div><\\/div>\\n                <div class=\\\"act\\\"><span class=\\\"feeding\\\">Feeding<\\/span><\\/div>\\n              <\\/div>\\n\\n              <div class=\\\"conn\\\">\\n                <div class=\\\"ic health\\\">H<\\/div>\\n                <div class=\\\"m\\\"><div class=\\\"nm\\\">Apple Health<\\/div><div class=\\\"role\\\">Steps, climb &amp; sleep across the trip.<\\/div><\\/div>\\n                <div class=\\\"act\\\"><span class=\\\"feeding\\\">Feeding<\\/span><\\/div>\\n              <\\/div>\\n\\n              <div class=\\\"conn\\\">\\n                <div class=\\\"ic maps\\\">M<\\/div>\\n                <div class=\\\"m\\\"><div class=\\\"nm\\\">Maps Timeline<\\/div><div class=\\\"role\\\">Confirms where you actually went.<\\/div><\\/div>\\n                <div class=\\\"act\\\"><span class=\\\"feeding\\\">Feeding<\\/span><\\/div>\\n              <\\/div>\\n\\n              <div class=\\\"conn locked\\\" data-conn=\\\"bank\\\">\\n                <div class=\\\"ic bank\\\">₹<\\/div>\\n                <div class=\\\"m\\\"><div class=\\\"nm\\\">HDFC card<\\/div><div class=\\\"role\\\" data-role>Right now I read swipes from email alerts. Connect the card and I'll track spend to the rupee — live.<\\/div><\\/div>\\n                <div class=\\\"act\\\"><button class=\\\"connect\\\" data-grant=\\\"bank\\\">Connect<\\/button><\\/div>\\n              <\\/div>\\n\\n              <div class=\\\"conn locked\\\" data-conn=\\\"rail\\\">\\n                <div class=\\\"ic rail\\\">R<\\/div>\\n                <div class=\\\"m\\\"><div class=\\\"nm\\\">IRCTC / rail<\\/div><div class=\\\"role\\\" data-role>I'm guessing bus times for your two open legs. With rail access I'd book the safe one before it sells out.<\\/div><\\/div>\\n                <div class=\\\"act\\\"><button class=\\\"connect\\\" data-grant=\\\"rail\\\">Connect<\\/button><\\/div>\\n              <\\/div>\\n\\n              <div class=\\\"conn locked\\\" data-conn=\\\"cal\\\">\\n                <div class=\\\"ic cal\\\">C<\\/div>\\n                <div class=\\\"m\\\"><div class=\\\"nm\\\">Calendar<\\/div><div class=\\\"role\\\" data-role>So the trip blocks your work days and I stop drafting briefs while you're away.<\\/div><\\/div>\\n                <div class=\\\"act\\\"><button class=\\\"connect\\\" data-grant=\\\"cal\\\">Connect<\\/button><\\/div>\\n              <\\/div>\\n            <\\/div>\\n\\n            <!-- HOW I BUILT THIS -->\\n            <div class=\\\"sec\\\">\\n              <div class=\\\"label\\\">How I built this<\\/div>\\n              <div class=\\\"build\\\">\\n                <div class=\\\"bi\\\">\\n                  <div class=\\\"src\\\">cite · gmail · May 22<\\/div>\\n                  <div class=\\\"txt\\\"><b>One flight email.<\\/b> Delhi arr, Chandigarh dep — the spine of the whole trip.<\\/div>\\n                <\\/div>\\n                <div class=\\\"bi inferred\\\">\\n                  <div class=\\\"src\\\">cite · search history · April<\\/div>\\n                  <div class=\\\"txt\\\">You searched <b>\\\"Kheerganga trek\\\"<\\/b> twice. That's why Kasol is a stop, not a guess.<\\/div>\\n                <\\/div>\\n                <div class=\\\"bi inferred\\\">\\n                  <div class=\\\"src\\\">cite · last year's chapter<\\/div>\\n                  <div class=\\\"txt\\\">Your <b>Manali trip<\\/b> taught me you take overnight Volvos and dislike mountain switchbacks.<\\/div>\\n                <\\/div>\\n                <div class=\\\"bi\\\">\\n                  <div class=\\\"src\\\">cite · maps · live<\\/div>\\n                  <div class=\\\"txt\\\">Two stops are <b>confirmed by where you've actually been.<\\/b> The rest I'll firm up as you move.<\\/div>\\n                <\\/div>\\n              <\\/div>\\n            <\\/div>\\n\\n            <div style=\\\"height:28px;\\\"><\\/div>\\n          <\\/div>\\n\\n          <!-- Receipt sheet -->\\n          <div class=\\\"receipt-overlay\\\" id=\\\"receipt-overlay\\\">\\n            <div class=\\\"receipt-card\\\">\\n              <div class=\\\"handle\\\"><\\/div>\\n              <div class=\\\"title\\\" id=\\\"rt-title\\\">Receipt<\\/div>\\n              <div class=\\\"deck\\\" id=\\\"rt-deck\\\"><\\/div>\\n              <div id=\\\"rt-srcs\\\"><\\/div>\\n              <div class=\\\"anchor\\\">Anchored · obsidian seal<\\/div>\\n            <\\/div>\\n          <\\/div>\\n\\n          <!-- Correction sheet (Point 1: quick update to a suggestion) -->\\n          <div class=\\\"correct-overlay\\\" id=\\\"correct-overlay\\\">\\n            <div class=\\\"correct-card\\\">\\n              <div class=\\\"handle\\\"><\\/div>\\n              <div class=\\\"ck\\\"><span class=\\\"av\\\"><\\/span><span id=\\\"c-label\\\">Quick update<\\/span><\\/div>\\n              <div class=\\\"ctitle\\\" id=\\\"c-title\\\">What changed?<\\/div>\\n              <div class=\\\"cwhat\\\" id=\\\"c-what\\\"><\\/div>\\n              <div class=\\\"cchips\\\" id=\\\"c-chips\\\"><\\/div>\\n              <div class=\\\"cwell\\\" id=\\\"c-well\\\"><span class=\\\"cph\\\" id=\\\"c-ph\\\">Or tell me in your words…<\\/span><\\/div>\\n              <button class=\\\"cgo\\\" id=\\\"c-go\\\">Tell Ayumi<\\/button>\\n            <\\/div>\\n          <\\/div>\\n\\n          <!-- Ripple toast (what a correction changed) -->\\n          <div class=\\\"ripple-toast\\\" id=\\\"ripple-toast\\\">\\n            <div class=\\\"rk\\\">What this changed<\\/div>\\n            <div class=\\\"rmain\\\" id=\\\"r-main\\\"><\\/div>\\n            <div class=\\\"rlearn\\\" id=\\\"r-learn\\\"><\\/div>\\n          <\\/div>\\n\\n        <\\/div>\\n      <\\/div>\\n      <div class=\\\"island\\\"><\\/div>\\n      <div class=\\\"home\\\"><\\/div>\\n    <\\/div>\\n  <\\/div>\\n\\n<\\/main>\\n\\n<!--HALOENGINE-->\\n<!--CAPJS-->\\n<script>\\n(() => {\\n  const halo = AtlasHalo.init(document.getElementById('halo'));\\n  window.__atlasHalo = halo;\\n\\n  // ── Receipts ────────────────────────────────────────────\\n  const RECEIPTS = {\\n    flight: { title: 'The whole route, from <em>one email.<\\/em>', deck: 'A single flight confirmation gave me the two fixed points; everything between them is inference I can show you.',\\n      srcs: [{ k:'email', kind:'gmail', ref:'MakeMyTrip · itinerary · 2026-05-22 21:08' },\\n             { k:'search', kind:'search history', ref:'\\\"Kheerganga trek\\\" · ×2 · April' }] },\\n    spend: { title: 'Spend, from <em>two places.<\\/em>', deck: 'Bookings come from your inbox; daily spend I read from card-swipe alerts. No bank login yet.',\\n      srcs: [{ k:'email', kind:'gmail', ref:'Flight + 2 hotel confirmations' },\\n             { k:'card', kind:'card alerts', ref:'HDFC SMS · 9 swipes since May 30' }] },\\n    'spend-gap': { title: 'Two legs <em>not yet counted.<\\/em>', deck: 'I can estimate them, but I won\\\\u2019t add to your total until they\\\\u2019re booked — connect the card and rail and I\\\\u2019ll do both.',\\n      srcs: [{ k:'search', kind:'estimate', ref:'Rishikesh→Kasol ~₹2,400 · Kasol→IXC ~₹2,000' }] },\\n    'kasol-leg': { title: 'Rishikesh → Kasol, <em>split overnight.<\\/em>', deck: 'Direct is 12 hrs of switchbacks. I\\\\u2019d break at Bhuntar so you arrive rested — based on how Manali went.',\\n      srcs: [{ k:'card', kind:'preference', ref:'Manali chapter · \\\"carsick on the ghats\\\"' },\\n             { k:'search', kind:'options', ref:'3 overnight services · ₹2,200–2,600' }] },\\n    'ixc-leg': { title: 'Kasol → Chandigarh, <em>don\\\\u2019t miss IXC.<\\/em>', deck: 'Your flight is 16:20 on the 11th. The last bus that lands you safely leaves Kasol 22:30 on the 10th.',\\n      srcs: [{ k:'email', kind:'flight', ref:'IXC dep 2026-06-11 16:20' },\\n             { k:'search', kind:'options', ref:'HRTC Volvo · last safe departure 22:30' }] },\\n  };\\n  const overlay = document.getElementById('receipt-overlay');\\n  const rt = { title: document.getElementById('rt-title'), deck: document.getElementById('rt-deck'), srcs: document.getElementById('rt-srcs') };\\n  document.querySelectorAll('[data-receipt]').forEach(b => {\\n    b.addEventListener('click', () => {\\n      const r = RECEIPTS[b.dataset.receipt];\\n      if (!r) return;\\n      rt.title.innerHTML = r.title;\\n      rt.deck.textContent = r.deck;\\n      rt.srcs.innerHTML = r.srcs.map(s => `\\n        <div class=\\\"src-row\\\"><div class=\\\"ic ${s.k}\\\"><\\/div>\\n          <div class=\\\"m\\\"><div class=\\\"kind\\\">${s.kind}<\\/div><div class=\\\"ref\\\">${s.ref}<\\/div><\\/div>\\n        <\\/div>`).join('');\\n      overlay.classList.add('open');\\n      halo.setState('thinking');\\n      setTimeout(() => halo.setState('idle'), 1200);\\n    });\\n  });\\n  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });\\n\\n  // ── Connectors — granting one makes the chapter sharper ──\\n  const UNLOCK = {\\n    bank: 'Linked. I\\\\u2019ll track every swipe to the rupee from here.',\\n    rail: 'Linked. Watching seats on your two open legs now.',\\n    cal:  'Linked. Your work days are blocked through Jun 11.',\\n  };\\n  document.querySelectorAll('[data-grant]').forEach(btn => {\\n    btn.addEventListener('click', () => {\\n      const key = btn.dataset.grant;\\n      const conn = btn.closest('.conn');\\n      const role = conn.querySelector('[data-role]');\\n      btn.textContent = 'Linked';\\n      btn.classList.add('linked');\\n      conn.classList.remove('locked');\\n      if (role && UNLOCK[key]) { role.textContent = UNLOCK[key]; role.classList.add('unlocked-note'); }\\n      // Ayumi reacts — a brief think, then a delivered bloom\\n      halo.setState('thinking');\\n      setTimeout(() => halo.setState('delivered'), 700);\\n      setTimeout(() => halo.setState('idle'), 2600);\\n    });\\n  });\\n\\n  // ── Index gesture ───────────────────────────────────────\\n  const appMark = document.getElementById('app-mark');\\n  const indexOverlay = document.getElementById('index-overlay');\\n  appMark.addEventListener('click', () => indexOverlay.classList.toggle('open'));\\n  indexOverlay.addEventListener('click', (e) => { if (e.target === indexOverlay) indexOverlay.classList.remove('open'); });\\n\\n  // ── Point 2: past stops collapse; tap to reveal ─────────\\n  document.querySelectorAll('.stop.done').forEach(stop => {\\n    stop.addEventListener('click', (e) => {\\n      if (e.target.closest('[data-correct]')) return; // let correction buttons through\\n      stop.classList.toggle('open');\\n    });\\n  });\\n\\n  // ── Point 1: quick correction → Ayumi reconciles ────────\\n  const inr = (n) => '₹' + n.toLocaleString('en-IN');\\n\\n  function setSpendTotal(n) {\\n    const big = document.querySelector('.spend-top .big');\\n    if (!big) return;\\n    big.innerHTML = '<span class=\\\"cur\\\">₹<\\/span>' + n.toLocaleString('en-IN');\\n    big.classList.add('flash');\\n    setTimeout(() => big.classList.remove('flash'), 900);\\n  }\\n  function setLegend(label, n) {\\n    document.querySelectorAll('.spend-legend .li').forEach(li => {\\n      if (li.textContent.trim().startsWith(label)) {\\n        const amt = li.querySelector('.amt');\\n        if (amt) amt.textContent = inr(n);\\n      }\\n    });\\n  }\\n  function applyOutcome(o) {\\n    if (!o) return;\\n    if (o.mode && o.modeId) { const el = document.getElementById(o.modeId); if (el) el.textContent = o.mode; }\\n    if (o.price && o.priceId) { const el = document.getElementById(o.priceId); if (el) el.textContent = o.price; }\\n    if (o.spendTotal != null) setSpendTotal(o.spendTotal);\\n    if (o.legend) Object.entries(o.legend).forEach(([k, v]) => setLegend(k, v));\\n    // a booked correction is no longer a \\\"guess\\\" — soften the why line\\n    if (o.modeId) {\\n      const leg = document.getElementById(o.modeId)?.closest('.leg');\\n      if (leg) { const why = leg.querySelector('.why'); if (why && o.why) why.textContent = o.why; }\\n    }\\n    showRipple(o.main, o.learn);\\n    halo.setState('thinking');\\n    setTimeout(() => halo.setState('delivered'), 700);\\n    setTimeout(() => halo.setState('idle'), 2800);\\n  }\\n  function showRipple(main, learn) {\\n    const toast = document.getElementById('ripple-toast');\\n    document.getElementById('r-main').innerHTML = main || 'Logged.';\\n    const learnEl = document.getElementById('r-learn');\\n    if (learn) { learnEl.innerHTML = learn; learnEl.style.display = 'block'; }\\n    else { learnEl.style.display = 'none'; }\\n    toast.classList.add('show');\\n    clearTimeout(toast._t);\\n    toast._t = setTimeout(() => toast.classList.remove('show'), 5400);\\n  }\\n\\n  // The deliberately-wrong guess Ayumi made: assuming a flight to\\n  // Pantnagar (₹4,900). Correcting it ripples into spend + future legs.\\n  const CORRECT = {\\n    'leg-nainital': {\\n      label: 'Correcting · Delhi → Nainital',\\n      title: 'How did you actually get there?',\\n      what: 'I guessed you <b>flew to Pantnagar<\\/b> — ₹4,900. That was just inference. Set me straight.',\\n      ph: '“We took the overnight bus…”',\\n      chips: [\\n        { t: 'Overnight Volvo bus', o: { modeId:'mode-nainital', mode:'Volvo sleeper · Delhi → Nainital', why:'You told me — overnight bus, not the flight.', priceId:'price-nainital', price:'₹1,150', spendTotal:31000, legend:{ Flights:13500, Travel:4150 },\\n          main:'Nainital leg is now the <b>overnight Volvo<\\/b>. I pulled <b>₹3,750<\\/b> off your total.',\\n          learn:'You chose the bus over the flight — so I\\\\u2019ll lead with sleepers on your Kasol leg too, not flights.' } },\\n        { t: 'Shared cab', o: { modeId:'mode-nainital', mode:'Shared cab · Delhi → Nainital', why:'You told me — drove up by cab.', priceId:'price-nainital', price:'₹3,200', spendTotal:33050, legend:{ Flights:13500, Travel:6200 },\\n          main:'Switched to a <b>shared cab<\\/b>. Total drops <b>₹1,700<\\/b>.',\\n          learn:'Noted you\\\\u2019d rather drive these short hops than fly.' } },\\n        { t: 'Train via Kathgodam', o: { modeId:'mode-nainital', mode:'Train + cab · Delhi → Nainital', why:'You told me — train to Kathgodam, then a cab.', priceId:'price-nainital', price:'₹980', spendTotal:30830, legend:{ Flights:13500, Travel:3980 },\\n          main:'Logged the <b>train via Kathgodam<\\/b>. Total drops <b>₹3,920<\\/b>.',\\n          learn:'If you connect IRCTC I\\\\u2019ll check rail first on your two open legs.' } },\\n      ],\\n      free: { modeId:'mode-nainital', mode:'Updated · Delhi → Nainital', priceId:'price-nainital', price:'logged',\\n        main:'Got it — I\\\\u2019ve <b>updated the Nainital leg<\\/b> and re-pointed the spend.',\\n        learn:'Tell me the fare when you have it and I\\\\u2019ll true up your total.' },\\n    },\\n  };\\n  function genericCorrect(key) {\\n    const where = key.replace(/^(stop|leg)-/, '');\\n    const nice = where.charAt(0).toUpperCase() + where.slice(1);\\n    return {\\n      label: 'Quick update · ' + nice,\\n      title: 'What changed?',\\n      what: 'Tell me what actually happened and I\\\\u2019ll fix the record — and learn from it.',\\n      ph: '“Actually we…”',\\n      chips: [],\\n      free: { main:'Logged. I\\\\u2019ve <b>updated this<\\/b> and threaded it back through the trip.', learn:'The more you correct me, the sharper this chapter gets on its own.' },\\n    };\\n  }\\n\\n  const cOverlay = document.getElementById('correct-overlay');\\n  const cLabel = document.getElementById('c-label');\\n  const cTitle = document.getElementById('c-title');\\n  const cWhat = document.getElementById('c-what');\\n  const cChips = document.getElementById('c-chips');\\n  const cWell = document.getElementById('c-well');\\n  const cPh = document.getElementById('c-ph');\\n  const cGo = document.getElementById('c-go');\\n  let cCurrent = null, cChosen = null;\\n\\n  function openCorrect(key) {\\n    const d = CORRECT[key] || genericCorrect(key);\\n    cCurrent = d; cChosen = null;\\n    cLabel.textContent = d.label;\\n    cTitle.textContent = d.title;\\n    cWhat.innerHTML = d.what;\\n    cChips.innerHTML = '';\\n    d.chips.forEach((c, i) => {\\n      const b = document.createElement('button');\\n      b.className = 'cchip'; b.textContent = c.t;\\n      b.addEventListener('click', () => {\\n        cChips.querySelectorAll('.cchip').forEach(x => x.classList.remove('sel'));\\n        b.classList.add('sel');\\n        cChosen = c.o;\\n        cGo.classList.add('ready');\\n      });\\n      cChips.appendChild(b);\\n    });\\n    // reset well\\n    cWell.innerHTML = '';\\n    cWell.appendChild(cPh); cPh.style.display = 'block';\\n    cGo.classList.remove('ready');\\n    cOverlay.classList.add('open');\\n    halo.setState('thinking');\\n    setTimeout(() => halo.setState('idle'), 1000);\\n  }\\n  function closeCorrect() { cOverlay.classList.remove('open'); }\\n\\n  // contenteditable well (free-text correction)\\n  cWell.setAttribute('contenteditable', 'true');\\n  cWell.addEventListener('focus', () => { cPh.style.display = 'none'; });\\n  cWell.addEventListener('input', () => {\\n    const has = cWell.textContent.trim().length > 0;\\n    if (has) { cChosen = null; cChips.querySelectorAll('.cchip').forEach(x => x.classList.remove('sel')); }\\n    cGo.classList.toggle('ready', has || !!cChosen);\\n  });\\n\\n  document.querySelectorAll('[data-correct]').forEach(btn => {\\n    btn.addEventListener('click', (e) => { e.stopPropagation(); openCorrect(btn.dataset.correct); });\\n  });\\n  cOverlay.addEventListener('click', (e) => { if (e.target === cOverlay) closeCorrect(); });\\n  cGo.addEventListener('click', () => {\\n    if (!cCurrent) return;\\n    const outcome = cChosen || cCurrent.free;\\n    closeCorrect();\\n    setTimeout(() => applyOutcome(outcome), 260);\\n  });\\n})();\\n<\\/script>\\n\\n\\n<script>\\n(function(){\\n  function nav(h){ try{ parent.postMessage({atlasNav:h},'*'); }catch(e){} }\\n  document.addEventListener('click', function(e){\\n    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\\n    if(!a) return;\\n    var href = a.getAttribute('href') || '';\\n    if(/\\\\.html(\\\\?|#|$)/i.test(href)){ e.preventDefault(); e.stopPropagation(); nav(href); }\\n  }, true);\\n  document.addEventListener('keydown', function(e){\\n    var t = e.target;\\n    if(t && (/(INPUT|TEXTAREA)/.test(t.tagName) || t.isContentEditable)) return;\\n    if(e.key==='ArrowLeft') nav('@prev');\\n    else if(e.key==='ArrowRight') nav('@next');\\n  });\\n})();\\n<\\/script>\\n<\\/body>\\n<\\/html>\\n\",\"review\":\"<!doctype html>\\n<html lang=\\\"en\\\">\\n<head>\\n<meta charset=\\\"utf-8\\\" />\\n<meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\" />\\n<title>Atlas v0.6 — Review × Halo<\\/title>\\n\\n<!--FONTS-->\\n\\n<style>\\n  :root {\\n    --desk:#ededea; --paper:#ffffff; --paper-deep:#f7f7f5; --card:#ffffff;\\n    --ink:#0d141a; --ink-2:#2c3942; --ink-3:#6a7480; --ink-4:#aab2bb;\\n    --rule:rgba(40,44,52,0.10); --rule-soft:rgba(40,44,52,0.05);\\n    --shadow-1:0 0.5px 1px rgba(20,24,32,0.04),2px 4px 10px -4px rgba(20,24,32,0.06),4px 12px 28px -14px rgba(20,24,32,0.10);\\n    --shadow-2:0 1px 1px rgba(20,24,32,0.05),3px 6px 14px -4px rgba(20,24,32,0.09),6px 16px 32px -10px rgba(20,24,32,0.14);\\n    --teal:#0089a8; --teal-deep:#00576b; --jade:#5a8f74; --forest:#0d3324; --ember:#b8431e;\\n    --serif:'Instrument Serif','Times New Roman',serif;\\n    --sans:'Manrope',-apple-system,system-ui,sans-serif;\\n    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;\\n    --halo-inset:22px; --halo-radius:32px;\\n  }\\n  * { box-sizing:border-box; }\\n  html, body { margin:0; padding:0; background:var(--desk); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; overflow-x:hidden; }\\n  main { min-height:100vh; padding:40px 16px 80px; display:grid; grid-template-columns:1fr; place-items:start center; gap:20px; }\\n  .page-meta { width:100%; max-width:720px; display:flex; gap:12px; align-items:baseline; color:var(--ink-3); }\\n  .page-meta .dot { width:6px; height:6px; border-radius:50%; background:var(--teal); animation:gentle 2.4s ease-in-out infinite; align-self:center; }\\n  @keyframes gentle { 0%,100%{opacity:0.4;} 50%{opacity:1;} }\\n  .page-meta .micro { font-family:var(--mono); font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; }\\n  .page-meta .title { font-family:var(--serif); font-style:italic; font-size:18px; color:var(--ink-2); margin-left:auto; }\\n  .hint { width:100%; max-width:393px; font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3); text-align:center; }\\n\\n  .phone { width:393px; height:852px; background:#0c0d10; border-radius:54px; padding:11px; position:relative;\\n    box-shadow:0 1px
