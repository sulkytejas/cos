app-mark .glyph { font-family:var(--serif); font-style:italic; font-size:19px; color:var(--ink); letter-spacing:-0.02em; }\\n  .app-mark .crumb { font-family:var(--mono); font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-3); }\\n\\n  .conv { position:absolute; inset:64px 0 22px 0; overflow-y:auto; overflow-x:hidden; padding:6px 24px 24px; z-index:10; }\\n  .conv::-webkit-scrollbar { width:0; }\\n\\n  /* Ayumi's framing of overnight work */\\n  .open-line { padding:6px 0 4px; }\\n  .open-line .meta { display:flex; align-items:center; gap:8px; margin-bottom:10px; }\\n  .open-line .avatar { width:18px; height:18px; border-radius:50%; background:var(--ink); position:relative; overflow:hidden; }\\n  .open-line .avatar::after { content:''; position:absolute; inset:0; background:radial-gradient(circle at 35% 30%, rgba(122,214,198,0.9), rgba(90,143,116,0.5) 60%, rgba(0,0,0,0) 100%); animation:gentle 2.4s ease-in-out infinite; }\\n  .open-line .name { font-family:var(--serif); font-style:italic; font-size:14px; color:var(--ink); }\\n  .open-line .when { font-family:var(--mono); font-size:9.5px; color:var(--ink-4); margin-left:auto; }\\n  .open-line .framing { font-family:var(--serif); font-style:italic; font-size:21px; line-height:1.34; color:var(--ink); letter-spacing:-0.004em; text-wrap:pretty; }\\n  .open-line .framing .accent { font-style:normal; background:linear-gradient(180deg, transparent 64%, rgba(0,137,168,0.16) 64%, rgba(0,137,168,0.16) 92%, transparent 92%); padding:0 1px; }\\n\\n  .count-row { margin:18px 0 8px; display:flex; align-items:baseline; justify-content:space-between; }\\n  .count-row .n { font-family:var(--serif); font-size:22px; color:var(--ink); }\\n  .count-row .n em { font-style:italic; }\\n  .count-row .done-all { font-family:var(--mono); font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--teal-deep); background:transparent; border:0; cursor:pointer; }\\n\\n  /* Review cards — swipe/approve/decline */\\n  .stack { display:flex; flex-direction:column; gap:10px; }\\n  .rev {\\n    background:var(--card); border-radius:14px; padding:14px 16px 14px;\\n    box-shadow:var(--shadow-1); position:relative; overflow:hidden;\\n    transition:opacity 360ms ease, transform 360ms cubic-bezier(.34,1.06,.64,1), max-height 360ms ease, margin 360ms ease, padding 360ms ease;\\n    max-height:260px;\\n  }\\n  .rev.resolved { opacity:0; transform:translateX(40px); max-height:0; margin-top:-10px; padding-top:0; padding-bottom:0; pointer-events:none; }\\n  .rev .tagline { display:flex; align-items:center; gap:8px; margin-bottom:8px; }\\n  .rev .tag { font-family:var(--mono); font-size:8.5px; letter-spacing:0.14em; text-transform:uppercase; padding:3px 7px; border-radius:999px; }\\n  .rev .tag.draft { background:#e0f1f4; color:var(--teal-deep); }\\n  .rev .tag.filed { background:var(--paper-deep); color:var(--ink-2); border:1px solid var(--rule); }\\n  .rev .tag.held { background:#fbe3d9; color:#6c2310; }\\n  .rev .tagline .when { font-family:var(--mono); font-size:9px; letter-spacing:0.04em; color:var(--ink-4); margin-left:auto; }\\n  .rev .body { font-family:var(--serif); font-size:16px; line-height:1.4; color:var(--ink); text-wrap:pretty; }\\n  .rev .body .said { font-style:italic; color:var(--ink-2); }\\n  .rev .why { margin-top:8px; font-family:var(--serif); font-style:italic; font-size:13.5px; line-height:1.4; color:var(--ink-3); text-wrap:pretty; }\\n  .rev .cite { margin-top:8px; font-family:var(--mono); font-size:9px; letter-spacing:0.06em; color:var(--teal-deep); }\\n  .rev .actions { margin-top:14px; display:flex; gap:8px; }\\n  .rev .actions button {\\n    flex:1; padding:10px; border-radius:10px; font-family:var(--serif); font-size:14px; cursor:pointer; border:0;\\n    transition:transform 120ms;\\n  }\\n  .rev .actions button:active { transform:scale(0.97); }\\n  .rev .approve { background:var(--ink); color:#fff; }\\n  .rev .decline { background:var(--paper-deep); color:var(--ink-2); border:1px solid var(--rule) !important; }\\n\\n  /* All-clear state */\\n  .clear { text-align:center; padding:60px 24px; opacity:0; transition:opacity 500ms; }\\n  .clear.show { opacity:1; }\\n  .clear .mark { font-family:var(--serif); font-style:italic; font-size:40px; color:var(--ink); line-height:1; }\\n  .clear .sub { font-family:var(--serif); font-style:italic; font-size:16px; color:var(--ink-3); margin-top:12px; text-wrap:pretty; }\\n\\n  /* Index */\\n  .index-overlay { position:absolute; inset:0; z-index:90; pointer-events:none; }\\n  .index-overlay::before { content:''; position:absolute; inset:0; background:rgba(13,20,26,0); transition:background 300ms; }\\n  .index-overlay.open { pointer-events:auto; }\\n  .index-overlay.open::before { background:rgba(13,20,26,0.34); }\\n  .index-sheet { position:absolute; top:var(--halo-inset); left:var(--halo-inset); right:var(--halo-inset); background:rgba(255,255,255,0.9); backdrop-filter:blur(20px) saturate(1.2); -webkit-backdrop-filter:blur(20px) saturate(1.2); border-radius:var(--halo-radius) var(--halo-radius) 22px 22px; padding:56px 24px 24px; transform:translateY(-104%); transition:transform 420ms cubic-bezier(.34,1.12,.64,1); box-shadow:0 18px 40px -16px rgba(20,24,32,0.22); }\\n  .index-overlay.open .index-sheet { transform:translateY(0) !important; }\\n  .index-sheet .ix-label { font-family:var(--mono); font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-3); margin-bottom:14px; }\\n  .index-sheet a { display:flex; align-items:baseline; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--rule-soft); text-decoration:none; color:var(--ink); }\\n  .index-sheet a:last-of-type { border-bottom:0; }\\n  .index-sheet a .n { font-family:var(--serif); font-style:italic; font-size:24px; }\\n  .index-sheet a .c { font-family:var(--mono); font-size:9.5px; letter-spacing:0.06em; color:var(--ink-3); }\\n  .index-sheet .handle { width:40px; height:4px; border-radius:999px; background:var(--ink-4); opacity:0.5; position:absolute; bottom:10px; left:50%; transform:translateX(-50%); }\\n\\n  /* ── View toggle (Cards ↔ Draft) ──────────────────────────── */\\n  .view-toggle { display:flex; gap:4px; padding:4px; margin:2px 0 16px; background:var(--paper-deep); border:1px solid var(--rule-soft); border-radius:999px; }\\n  .view-toggle button { flex:1; padding:7px 8px; background:transparent; border:0; border-radius:999px; font-family:var(--mono); font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-3); cursor:pointer; transition:background 200ms,color 200ms; }\\n  .view-toggle button.active { background:var(--ink); color:#fff; }\\n\\n  /* ── Draft view (morning paragraph, strike to drop) ───────── */\\n  #view-draft { display:none; }\\n  .draft { margin-top:6px; }\\n  .draft .sub { font-family:var(--mono); font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink-4); margin:2px 0 6px; }\\n  .sent { position:relative; padding:11px 0; border-bottom:1px solid var(--rule-soft); cursor:pointer; font-family:var(--serif); font-size:18.5px; line-height:1.46; color:var(--ink); letter-spacing:-0.003em; text-wrap:pretty; -webkit-tap-highlight-color:transparent;\\n    transition:font-size 420ms cubic-bezier(.22,1,.36,1), color 320ms, opacity 420ms, padding 420ms; }\\n  .sent:last-of-type { border-bottom:0; }\\n  .sent .txt { background-image:linear-gradient(var(--ink-3),var(--ink-3)); background-size:0% 1.4px; background-position:0 64%; background-repeat:no-repeat;\\n    transition:background-size 440ms cubic-bezier(.22,1,.36,1); }\\n  .sent.struck { font-size:13px; color:var(--ink-4); opacity:0.6; padding:5px 0; }\\n  .sent.struck .txt { background-size:100% 1.4px; }\\n  .sent .badge { font-family:var(--mono); font-size:8px; letter-spacing:0.1em; text-transform:uppercase; color:var(--teal-deep); margin-left:8px; vertical-align:2px; white-space:nowrap; opacity:0; transition:opacity 200ms; }\\n  .sent:hover .badge { opacity:0.75; }\\n  .sent.struck .badge { display:none; }\\n\\n  .keep-row { margin-top:20px; padding:14px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }\\n  .keep-row .lbl { font-family:var(--mono); font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px; }\\n  .keep-row .txt { font-family:var(--serif); font-style:italic; font-size:15px; line-height:1.5; color:var(--ink-2); text-wrap:pretty; }\\n  .keep-row .txt em { font-style:normal; color:var(--teal-deep); }\\n\\n  .send-chapters { width:100%; margin-top:16px; padding:14px; background:var(--ink); color:#fff; border:0; border-radius:12px; font-family:var(--serif); font-size:16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform 120ms; }\\n  .send-chapters:active { transform:scale(0.98); }\\n  .send-chapters svg { display:block; }\\n\\n  .filed-note { margin-top:16px; padding:0 18px; border:1px solid var(--forest); border-radius:12px; background:#e3ebe7; opacity:0; max-height:0; overflow:hidden; transition:opacity 420ms, max-height 420ms, padding 420ms, margin 420ms; }\\n  .filed-note.show { opacity:1; max-height:320px; padding:16px 18px; }\\n  .filed-note .lbl { font-family:var(--mono); font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--forest); margin-bottom:8px; }\\n  .filed-note .txt { font-family:var(--serif); font-style:italic; font-size:16px; line-height:1.45; color:var(--ink); text-wrap:pretty; }\\n  .filed-note .txt em { font-style:normal; color:var(--forest); }\\n  .filed-note a { display:inline-block; margin-top:12px; font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--forest); text-decoration:none; border-bottom:1px solid rgba(13,51,36,0.3); padding-bottom:2px; }\\n\\n  /* Flying extract dots (draft → chapters) */\\n  .fly-dot { position:fixed; left:0; top:0; width:7px; height:7px; border-radius:50%; pointer-events:none; z-index:120; box-shadow:0 0 0 2px rgba(255,255,255,0.85); }\\n\\n  @media (min-width:980px) {\\n    main { grid-template-columns:1fr 393px 1fr; column-gap:36px; align-items:start; padding:56px 32px 80px; }\\n    .page-meta { grid-column:1 / 4; }\\n    .hint { grid-column:3; max-width:280px; margin-top:12px; text-align:left; }\\n    .phone-wrap { grid-column:2; }\\n  }\\n<\\/style>\\n<!--CAPCSS-->\\n\\n<style id=\\\"frameless-override\\\">\\n  html,body{height:100%!important;margin:0!important;overflow:hidden!important;background:var(--desk,#ededea)!important;}\\n  body{display:flex!important;justify-content:center!important;align-items:stretch!important;}\\n  main{display:block!important;padding:0!important;margin:0!important;min-height:0!important;width:100%!important;max-width:480px!important;grid-template-columns:none!important;place-items:initial!important;gap:0!important;}\\n  .page-meta,.hint,.state-toggle,.legend,.statusbar,.phone .island,.phone .home{display:none!important;}\\n  .phone-wrap{margin:0!important;width:100%!important;grid-column:auto!important;}\\n  .phone{width:100%!important;max-width:480px!important;height:100dvh!important;margin:0 auto!important;padding:0!important;background:transparent!important;border-radius:0!important;box-shadow:none!important;}\\n  .phone .screen{width:100%!important;height:100%!important;border-radius:0!important;}\\n<\\/style>\\n<\\/head>\\n\\n<body data-atlas-page=\\\"review\\\">\\n\\n<main>\\n\\n  <div class=\\\"page-meta\\\">\\n    <span class=\\\"dot\\\"><\\/span>\\n    <span class=\\\"micro\\\">Atlas v0.6 · Review × Halo<\\/span>\\n    <span class=\\\"title\\\">Handled <em>while you slept.<\\/em><\\/span>\\n  <\\/div>\\n\\n  <div class=\\\"hint\\\">Two ways to clear the night — approve the cards, or strike the draft and file the rest. The halo settles when you're done.<\\/div>\\n\\n  <div class=\\\"phone-wrap\\\">\\n    <div class=\\\"phone\\\">\\n      <div class=\\\"screen\\\">\\n\\n        <canvas class=\\\"halo-canvas\\\" id=\\\"halo\\\"><\\/canvas>\\n\\n        <div class=\\\"page\\\">\\n\\n          <div class=\\\"statusbar\\\">\\n            <span>9:41<\\/span>\\n            <div class=\\\"indicators\\\">\\n              <svg width=\\\"17\\\" height=\\\"11\\\" viewBox=\\\"0 0 17 11\\\"><rect x=\\\"0\\\" y=\\\"7\\\" width=\\\"2.6\\\" height=\\\"4\\\" rx=\\\"0.6\\\" fill=\\\"currentColor\\\"/><rect x=\\\"4\\\" y=\\\"5\\\" width=\\\"2.6\\\" height=\\\"6\\\" rx=\\\"0.6\\\" fill=\\\"currentColor\\\"/><rect x=\\\"8\\\" y=\\\"2.5\\\" width=\\\"2.6\\\" height=\\\"8.5\\\" rx=\\\"0.6\\\" fill=\\\"currentColor\\\"/><rect x=\\\"12\\\" y=\\\"0\\\" width=\\\"2.6\\\" height=\\\"11\\\" rx=\\\"0.6\\\" fill=\\\"currentColor\\\"/><\\/svg>\\n              <svg width=\\\"24\\\" height=\\\"11\\\" viewBox=\\\"0 0 24 11\\\"><rect x=\\\"0.5\\\" y=\\\"0.5\\\" width=\\\"20\\\" height=\\\"10\\\" rx=\\\"3\\\" stroke=\\\"currentColor\\\" stroke-opacity=\\\"0.4\\\" fill=\\\"none\\\"/><rect x=\\\"2\\\" y=\\\"2\\\" width=\\\"17\\\" height=\\\"7\\\" rx=\\\"1.6\\\" fill=\\\"currentColor\\\"/><\\/svg>\\n            <\\/div>\\n          <\\/div>\\n\\n          <div class=\\\"topbar\\\">\\n            <a class=\\\"back\\\" href=\\\"Atlas v0.6 - Today × Halo.html\\\">\\n              <svg width=\\\"14\\\" height=\\\"14\\\" viewBox=\\\"0 0 14 14\\\"><path d=\\\"M9 2 L4 7 L9 12\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"1.4\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/><\\/svg>\\n              Today\\n            <\\/a>\\n            <button class=\\\"app-mark\\\" id=\\\"app-mark\\\"><span class=\\\"glyph\\\">A<\\/span><span class=\\\"crumb\\\">Review ▾<\\/span><\\/button>\\n          <\\/div>\\n\\n          <div class=\\\"conv\\\" id=\\\"conv\\\">\\n\\n            <div class=\\\"view-toggle\\\" role=\\\"tablist\\\">\\n              <button data-view=\\\"cards\\\" class=\\\"active\\\">Cards<\\/button>\\n              <button data-view=\\\"draft\\\">Draft<\\/button>\\n            <\\/div>\\n\\n            <div id=\\\"view-cards\\\">\\n\\n            <div class=\\\"open-line\\\">\\n              <div class=\\\"meta\\\">\\n                <span class=\\\"avatar\\\"><\\/span>\\n                <span class=\\\"name\\\">Ayumi<\\/span>\\n                <span class=\\\"when\\\">02:14 → 06:38<\\/span>\\n              <\\/div>\\n              <div class=\\\"framing\\\">I did <span class=\\\"accent\\\">four things<\\/span> overnight and held them for you. Nothing's been sent — your call on each.<\\/div>\\n            <\\/div>\\n\\n            <div class=\\\"count-row\\\">\\n              <span class=\\\"n\\\"><em id=\\\"remaining\\\">4<\\/em> to review<\\/span>\\n              <button class=\\\"done-all\\\" id=\\\"approve-all\\\">Approve all<\\/button>\\n            <\\/div>\\n\\n            <div class=\\\"stack\\\" id=\\\"stack\\\">\\n\\n              <div class=\\\"rev\\\" data-id=\\\"1\\\">\\n                <div class=\\\"tagline\\\"><span class=\\\"tag draft\\\">Draft reply<\\/span><span class=\\\"when\\\">03:42<\\/span><\\/div>\\n                <div class=\\\"body\\\">Reply to <span class=\\\"said\\\">Karan<\\/span> — \\\"Sending the M6 cohort slice ahead of 2:30. See you then.\\\"<\\/div>\\n                <div class=\\\"why\\\">He asked twice; a short ack keeps you warm without overcommitting.<\\/div>\\n                <div class=\\\"cite\\\">trace · gmail thread + your calendar<\\/div>\\n                <div class=\\\"actions\\\"><button class=\\\"approve\\\">Send it<\\/button><button class=\\\"decline\\\">Not yet<\\/button><\\/div>\\n              <\\/div>\\n\\n              <div class=\\\"rev\\\" data-id=\\\"2\\\">\\n                <div class=\\\"tagline\\\"><span class=\\\"tag filed\\\">Filed<\\/span><span class=\\\"when\\\">04:10<\\/span><\\/div>\\n                <div class=\\\"body\\\">Filed 23 newsletters; surfaced <span class=\\\"said\\\">one<\\/span> — the SaaS retention teardown you star things like.<\\/div>\\n                <div class=\\\"why\\\">Matches 9 prior saves. Want it in the Stratyfix thread?<\\/div>\\n                <div class=\\\"cite\\\">trace · inbox rules + save history<\\/div>\\n                <div class=\\\"actions\\\"><button class=\\\"approve\\\">Keep in thread<\\/button><button class=\\\"decline\\\">Just archive<\\/button><\\/div>\\n              <\\/div>\\n\\n              <div class=\\\"rev\\\" data-id=\\\"3\\\">\\n                <div class=\\\"tagline\\\"><span class=\\\"tag held\\\">Held<\\/span><span class=\\\"when\\\">05:05<\\/span><\\/div>\\n                <div class=\\\"body\\\">A recruiter pinged about a Dublin role. I <span class=\\\"said\\\">held it<\\/span> — looked relevant to Ireland MBA.<\\/div>\\n                <div class=\\\"why\\\">Could be noise. Promote to the chapter, or dismiss?<\\/div>\\n                <div class=\\\"cite\\\">trace · linkedin + Ireland watcher<\\/div>\\n                <div class=\\\"actions\\\"><button class=\\\"approve\\\">Add to Ireland<\\/button><button class=\\\"decline\\\">Dismiss<\\/button><\\/div>\\n              <\\/div>\\n\\n              <div class=\\\"rev\\\" data-id=\\\"4\\\">\\n                <div class=\\\"tagline\\\"><span class=\\\"tag draft\\\">Todo drafted<\\/span><span class=\\\"when\\\">06:30<\\/span><\\/div>\\n                <div class=\\\"body\\\">Drafted a todo: <span class=\\\"said\\\">\\\"Confirm V.'s new 11:30 studio time.\\\"<\\/span><\\/div>\\n                <div class=\\\"why\\\">Her email moved the sitting; you haven't replied.<\\/div>\\n                <div class=\\\"cite\\\">trace · gmail + calendar<\\/div>\\n                <div class=\\\"actions\\\"><button class=\\\"approve\\\">Add todo<\\/button><button class=\\\"decline\\\">Skip<\\/button><\\/div>\\n              <\\/div>\\n\\n            <\\/div>\\n\\n            <div class=\\\"clear\\\" id=\\\"clear\\\">\\n              <div class=\\\"mark\\\">All clear.<\\/div>\\n              <div class=\\\"sub\\\">Nothing else waiting. I'll keep watching and bring you the next thing when it matters.<\\/div>\\n            <\\/div>\\n\\n            <\\/div><!-- /view-cards -->\\n\\n            <!-- ════════ VIEW: DRAFT — the morning page, in your voice ════════ -->\\n            <div id=\\\"view-draft\\\">\\n\\n              <div class=\\\"open-line\\\">\\n                <div class=\\\"meta\\\">\\n                  <span class=\\\"avatar\\\"><\\/span>\\n                  <span class=\\\"name\\\">Ayumi<\\/span>\\n                  <span class=\\\"when\\\">02:14 → 06:38<\\/span>\\n                <\\/div>\\n                <div class=\\\"framing\\\">I drafted your morning <span class=\\\"accent\\\">in your own voice.<\\/span> Read it like rereading yourself — strike any line I got wrong, and I'll file the rest into your chapters.<\\/div>\\n              <\\/div>\\n\\n              <div class=\\\"draft\\\" id=\\\"draft\\\">\\n                <div class=\\\"sub\\\">Tap a line to strike it<\\/div>\\n\\n                <p class=\\\"sent\\\" data-id=\\\"s1\\\">\\n                  <span class=\\\"txt\\\">It was a long night.<\\/span>\\n                <\\/p>\\n\\n                <p class=\\\"sent\\\" data-id=\\\"s2\\\" data-todo=\\\"1\\\" data-chapter=\\\"Stratyfix\\\">\\n                  <span class=\\\"txt\\\">Karan asked for retention numbers by Tuesday — I added that to the list.<\\/span><span class=\\\"badge\\\">→ Stratyfix · todo<\\/span>\\n                <\\/p>\\n\\n                <p class=\\\"sent\\\" data-id=\\\"s3\\\" data-todo=\\\"3\\\" data-chapter=\\\"Varanasi\\\">\\n                  <span class=\\\"txt\\\">Three small things for the trip: a Volvo sleeper to Manali, offline maps for the valley, and cash past Kasol where the ATMs go sparse.<\\/span><span class=\\\"badge\\\">→ Varanasi · 3 todos<\\/span>\\n                <\\/p>\\n\\n                <p class=\\\"sent\\\" data-id=\\\"s4\\\" data-decision=\\\"1\\\" data-chapter=\\\"Ireland\\\">\\n                  <span class=\\\"txt\\\">Trinity over UCD — I'd been holding that since April but only said it on yesterday's walk; the network argument tips the balance.<\\/span><span class=\\\"badge\\\">→ Ireland · decision<\\/span>\\n                <\\/p>\\n\\n                <p class=\\\"sent\\\" data-id=\\\"s5\\\" data-journal=\\\"1\\\" data-chapter=\\\"Stratyfix\\\">\\n                  <span class=\\\"txt\\\">You came back to “irreversibility” three times thinking about V.'s objections — that's the real worry, not the burn.<\\/span><span class=\\\"badge\\\">→ Stratyfix · note<\\/span>\\n                <\\/p>\\n\\n                <p class=\\\"sent\\\" data-id=\\\"s6\\\" data-journal=\\\"1\\\" data-chapter=\\\"Stratyfix\\\">\\n                  <span class=\\\"txt\\\">The ARR slide is taking a lot of energy — 14 edits in a week. Noting it, though I'm unsure whether it's a signal or just the deck eating your Tuesdays.<\\/span><span class=\\\"badge\\\">→ Stratyfix · note<\\/span>\\n                <\\/p>\\n              <\\/div>\\n\\n              <div class=\\\"keep-row\\\" id=\\\"keep-row\\\">\\n                <div class=\\\"lbl\\\">If you keep this<\\/div>\\n                <div class=\\\"txt\\\" id=\\\"keep-text\\\">I'll quietly add <em>4 todos, 1 decision and 2 notes<\\/em> to your chapters.<\\/div>\\n              <\\/div>\\n\\n              <button class=\\\"send-chapters\\\" id=\\\"send-chapters\\\">\\n                <span>Send to chapters<\\/span>\\n                <svg width=\\\"15\\\" height=\\\"11\\\" viewBox=\\\"0 0 15 11\\\"><line x1=\\\"0\\\" y1=\\\"5.5\\\" x2=\\\"12\\\" y2=\\\"5.5\\\" stroke=\\\"#fff\\\" stroke-width=\\\"1.2\\\"/><path d=\\\"M9.5 1.5 L13.5 5.5 L9.5 9.5\\\" fill=\\\"none\\\" stroke=\\\"#fff\\\" stroke-width=\\\"1.2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/><\\/svg>\\n              <\\/button>\\n\\n              <div class=\\\"filed-note\\\" id=\\\"filed-note\\\">\\n                <div class=\\\"lbl\\\">Filed<\\/div>\\n                <div class=\\\"txt\\\" id=\\\"filed-text\\\">Your morning is in the chapters — <em>4 todos, 1 decision and 2 notes<\\/em>, all in place.<\\/div>\\n                <a href=\\\"Atlas v0.6 - Chapters × Halo.html\\\">Open chapters →<\\/a>\\n              <\\/div>\\n\\n            <\\/div><!-- /view-draft -->\\n\\n          <\\/div>\\n\\n          <div class=\\\"index-overlay\\\" id=\\\"index-overlay\\\">\\n            <div class=\\\"index-sheet\\\">\\n              <div class=\\\"ix-label\\\">Go to<\\/div>\\n              <a href=\\\"Atlas v0.6 - Today × Halo.html\\\"><span class=\\\"n\\\">Today<\\/span><span class=\\\"c\\\">2 briefs · 3 watching<\\/span><\\/a>\\n              <a href=\\\"Atlas v0.6 - Brief × Halo.html\\\"><span class=\\\"n\\\">Briefs<\\/span><span class=\\\"c\\\">Karan · 14:30<\\/span><\\/a>\\n              <a href=\\\"Atlas v0.6 - Chapters × Halo.html\\\"><span class=\\\"n\\\">Chapters<\\/span><span class=\\\"c\\\">5 threads<\\/span><\\/a>\\n              <a href=\\\"Atlas v0.6 - Search × Halo.html\\\"><span class=\\\"n\\\">Search<\\/span><span class=\\\"c\\\">everything<\\/span><\\/a>\\n              <div class=\\\"handle\\\"><\\/div>\\n            <\\/div>\\n          <\\/div>\\n\\n        <\\/div>\\n      <\\/div>\\n      <div class=\\\"island\\\"><\\/div>\\n      <div class=\\\"home\\\"><\\/div>\\n    <\\/div>\\n  <\\/div>\\n\\n<\\/main>\\n\\n<!--HALOENGINE-->\\n<!--CAPJS-->\\n<script>\\n(() => {\\n  const halo = AtlasHalo.init(document.getElementById('halo'));\\n  window.__atlasHalo = halo;\\n\\n  const stack = document.getElementById('stack');\\n  const remaining = document.getElementById('remaining');\\n  const clear = document.getElementById('clear');\\n  let left = 4;\\n\\n  function resolve(card, approved) {\\n    if (card.classList.contains('resolved')) return;\\n    card.classList.add('resolved');\\n    // a small thinking pulse as Ayumi commits the action\\n    halo.setState('thinking');\\n    left--;\\n    remaining.textContent = left;\\n    setTimeout(() => {\\n      if (left <= 0) {\\n        // queue cleared — Ayumi delivers, then settles\\n        halo.setState('delivered');\\n        clear.classList.add('show');\\n      } else {\\n        halo.setState('idle');\\n      }\\n    }, 700);\\n  }\\n\\n  stack.querySelectorAll('.rev').forEach(card => {\\n    card.querySelector('.approve').addEventListener('click', () => resolve(card, true));\\n    card.querySelector('.decline').addEventListener('click', () => resolve(card, false));\\n  });\\n\\n  document.getElementById('approve-all').addEventListener('click', () => {\\n    const cards = [...stack.querySelectorAll('.rev:not(.resolved)')];\\n    halo.setState('thinking');\\n    cards.forEach((card, i) => {\\n      setTimeout(() => {\\n        card.classList.add('resolved');\\n        left--;\\n        remaining.textContent = Math.max(0, left);\\n        if (left <= 0) { halo.setState('delivered'); clear.classList.add('show'); }\\n      }, i * 180);\\n    });\\n  });\\n\\n  const appMark = document.getElementById('app-mark');\\n  const indexOverlay = document.getElementById('index-overlay');\\n  appMark.addEventListener('click', () => indexOverlay.classList.toggle('open'));\\n  indexOverlay.addEventListener('click', (e) => { if (e.target === indexOverlay) indexOverlay.classList.remove('open'); });\\n\\n  // ── View toggle: Cards ↔ Draft ──────────────────────────────\\n  const viewToggle = document.querySelector('.view-toggle');\\n  const viewCards = document.getElementById('view-cards');\\n  const viewDraft = document.getElementById('view-draft');\\n  viewToggle.addEventListener('click', (e) => {\\n    const btn = e.target.closest('button');\\n    if (!btn) return;\\n    viewToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));\\n    const draft = btn.dataset.view === 'draft';\\n    viewCards.style.display = draft ? 'none' : 'block';\\n    viewDraft.style.display = draft ? 'block' : 'none';\\n    document.getElementById('conv').scrollTop = 0;\\n  });\\n\\n  // ── Draft view: strike sentences, recompute, send ───────────\\n  const draftEl = document.getElementById('draft');\\n  const keepText = document.getElementById('keep-text');\\n  const sendBtn = document.getElementById('send-chapters');\\n  let filedAlready = false;\\n\\n  const num = (s, k) => Number(s.dataset[k] || 0);\\n\\n  function phrase(todo, decision, journal) {\\n    const parts = [];\\n    if (todo)     parts.push(`${todo} todo${todo === 1 ? '' : 's'}`);\\n    if (decision) parts.push(`${decision} decision${decision === 1 ? '' : 's'}`);\\n    if (journal)  parts.push(`${journal} note${journal === 1 ? '' : 's'}`);\\n    return parts.join(', ').replace(/, ([^,]*)$/, ' and $1');\\n  }\\n\\n  function recompute() {\\n    if (filedAlready) return;\\n    let todo = 0, decision = 0, journal = 0;\\n    draftEl.querySelectorAll('.sent:not(.struck)').forEach(s => {\\n      todo += num(s, 'todo'); decision += num(s, 'decision'); journal += num(s, 'journal');\\n    });\\n    const p = phrase(todo, decision, journal);\\n    keepText.innerHTML = p\\n      ? `I'll quietly add <em>${p}<\\/em> to your chapters.`\\n      : `Nothing will be filed — the page is empty.`;\\n    sendBtn.querySelector('span').textContent = p ? 'Send to chapters' : 'Nothing to send';\\n  }\\n\\n  draftEl.querySelectorAll('.sent').forEach(s => {\\n    s.addEventListener('click', () => {\\n      if (filedAlready) return;\\n      s.classList.toggle('struck');\\n      recompute();\\n    });\\n  });\\n\\n  function flyDots() {\\n    try {\\n      const t = document.getElementById('app-mark').getBoundingClientRect();\\n      const tx = t.left + t.width / 2, ty = t.top + t.height / 2;\\n      let i = 0;\\n      draftEl.querySelectorAll('.sent:not(.struck)').forEach(s => {\\n        const n = num(s, 'todo') + num(s, 'decision') + num(s, 'journal');\\n        if (!n) return;\\n        const r = s.getBoundingClientRect();\\n        const kinds = [];\\n        for (let k = 0; k < num(s, 'todo'); k++) kinds.push('var(--forest)');\\n        for (let k = 0; k < num(s, 'decision'); k++) kinds.push('var(--teal)');\\n        for (let k = 0; k < num(s, 'journal'); k++) kinds.push('var(--ink-2)');\\n        kinds.forEach((color, j) => {\\n          const dot = document.createElement('div');\\n          dot.className = 'fly-dot';\\n          dot.style.background = color;\\n          const fx = r.right - 16 - j * 10, fy = r.top + r.height / 2;\\n          dot.style.transform = `translate(${fx}px, ${fy}px) scale(0.6)`;\\n          dot.style.opacity = '0';\\n          document.body.appendChild(dot);\\n          const delay = i * 55; i++;\\n          requestAnimationFrame(() => requestAnimationFrame(() => {\\n            dot.style.transition = `transform 640ms cubic-bezier(.55,0,.35,1) ${delay}ms, opacity 220ms ${delay}ms`;\\n            dot.style.transform = `translate(${tx}px, ${ty}px) scale(1)`;\\n            dot.style.opacity = '1';\\n          }));\\n          setTimeout(() => { dot.style.opacity = '0'; setTimeout(() => dot.remove(), 320); }, delay + 720);\\n        });\\n      });\\n    } catch (e) { /* non-fatal */ }\\n  }\\n\\n  sendBtn.addEventListener('click', () => {\\n    if (filedAlready) return;\\n    let todo = 0, decision = 0, journal = 0;\\n    draftEl.querySelectorAll('.sent:not(.struck)').forEach(s => {\\n      todo += num(s, 'todo'); decision += num(s, 'decision'); journal += num(s, 'journal');\\n    });\\n    filedAlready = true;\\n    halo.setState('thinking');\\n    flyDots();\\n    setTimeout(() => {\\n      halo.setState('delivered');\\n      const p = phrase(todo, decision, journal);\\n      document.getElementById('filed-text').innerHTML = p\\n        ? `Your morning is in the chapters — <em>${p}<\\/em>, all in place.`\\n        : `Nothing to file — the page was empty.`;\\n      document.getElementById('filed-note').classList.add('show');\\n      document.getElementById('keep-row').style.display = 'none';\\n      sendBtn.style.display = 'none';\\n      draftEl.style.opacity = '0.55';\\n      draftEl.style.pointerEvents = 'none';\\n    }, 640);\\n  });\\n})();\\n<\\/script>\\n\\n\\n<script>\\n(function(){\\n  function nav(h){ try{ parent.postMessage({atlasNav:h},'*'); }catch(e){} }\\n  document.addEventListener('click', function(e){\\n    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\\n    if(!a) return;\\n    var href = a.getAttribute('href') || '';\\n    if(/\\\\.html(\\\\?|#|$)/i.test(href)){ e.preventDefault(); e.stopPropagation(); nav(href); }\\n  }, true);\\n  document.addEventListener('keydown', function(e){\\n    var t = e.target;\\n    if(t && (/(INPUT|TEXTAREA)/.test(t.tagName) || t.isContentEditable)) return;\\n    if(e.key==='ArrowLeft') nav('@prev');\\n    else if(e.key==='ArrowRight') nav('@next');\\n  });\\n})();\\n<\\/script>\\n<\\/body>\\n<\\/html>\\n\",\"search\":\"<!doctype html>\\n<html lang=\\\"en\\\">\\n<head>\\n<meta charset=\\\"utf-8\\\" />\\n<meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\" />\\n<title>Atlas v0.6 — Search × Halo<\\/title>\\n\\n<!--FONTS-->\\n\\n<style>\\n  :root {\\n    --desk:#ededea; --paper:#ffffff; --paper-deep:#f7f7f5; --card:#ffffff;\\n    --ink:#0d141a; --ink-2:#2c3942; --ink-3:#6a7480; --ink-4:#aab2bb;\\n    --rule:rgba(40,44,52,0.10); --rule-soft:rgba(40,44,52,0.05);\\n    --shadow-1:0 0.5px 1px rgba(20,24,32,0.04),2px 4px 10px -4px rgba(20,24,32,0.06),4px 12px 28px -14px rgba(20,24,32,0.10);\\n    --shadow-2:0 1px 1px rgba(20,24,32,0.05),3px 6px 14px -4px rgba(20,24,32,0.09),6px 16px 32px -10px rgba(20,24,32,0.14);\\n    --teal:#0089a8; --teal-deep:#00576b; --jade:#5a8f74; --forest:#0d3324; --ember:#b8431e;\\n    --serif:'Instrument Serif','Times New Roman',serif;\\n    --sans:'Manrope',-apple-system,system-ui,sans-serif;\\n    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;\\n    --halo-inset:22px; --halo index:1; pointer-events:none; image-rendering:auto; filter:blur(1.6px); }\\n  .page { position:absolute; top:var(--halo-inset); left:var(--halo-inset); right:var(--halo-inset); bottom:var(--halo-inset); background:var(--paper); border-radius:var(--halo-radius); overflow:hidden; z-index:2; box-shadow:inset 0 0 80px rgba(20,24,32,0.04),0 1px 2px rgba(20,24,32,0.04); }\\n\\n  .statusbar { position:absolute; top:6px; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:0 22px; z-index:30; font-family:-apple-system,\\\"SF Pro\\\",system-ui; font-weight:600; font-size:14.5px; color:var(--ink); pointer-events:none; }\\n  .statusbar .indicators { display:flex; gap:5px; align-items:center; }\\n  .topbar { position:absolute; top:30px; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:25; }\\n  .back { display:inline-flex; align-items:center; gap:6px; background:transparent; border:0; padding:0; cursor:pointer; color:var(--ink-2); font-family:var(--sans); font-size:14px; text-decoration:none; }\\n  .back svg { display:block; }\\n  .app-mark { display:inline-flex; align-items:baseline; gap:7px; cursor:pointer; background:transparent; border:0; padding:4px 0; }\\n  .app-mark .glyph { font-family:var(--serif); font-style:italic; font-size:19px; color:var(--ink); letter-spacing:-0.02em; }\\n  .app-mark .crumb { font-family:var(--mono); font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-3); }\\n\\n  .body-area { position:absolute; inset:64px 0 22px 0; z-index:10; display:flex; flex-direction:column; }\\n\\n  /* Search field */\\n  .search-head { padding:8px 24px 12px; }\\n  .search-field {\\n    display:flex; align-items:center; gap:10px;\\n    background:var(--paper-deep); border:1px solid var(--rule);\\n    border-radius:14px; padding:12px 14px;\\n    transition:border-color 220ms, box-shadow 220ms;\\n  }\\n  .search-field.live { border-color:rgba(0,137,168,0. de 7 has it; I flagged the churn slide to swap.\\\" },\\n    { kw:['karan'], a:\\\"Karan Mehta, Sequoia. Meeting at 14:30. He runs late, reads everything you send, and is waiting on retention numbers.\\\" },\\n    { kw:['ireland','vfs','visa','mba'], a:\\\"Ireland MBA relocation — I'm watching VFS slots every 3 hours; nothing's opened before Jun 28 yet.\\\" },\\n    { kw:['portrait','vandita','studio','sitting'], a:\\\"The portrait sitting moved to 11:30 tomorrow and the studio shifted one block south. A confirm‑todo is waiting in Review.\\\" },\\n  ];\\n\\n  const input = document.getElementById('input');\\n  const fieldWrap = document.getElementById('field-wrap');\\n  const clearBtn = document.getElementById('clear');\\n  const results = document.getElementById('results');\\n  let scope = 'all';\\n\\n  function answerFor(q) {\\n    const ql = q.toLowerCase();\\n    for (const a of ANSWERS) if (a.kw.some(k => ql.includes(k))) return a.a;\\n    return null;\\n  }\\n\\n  function hl(text, q) {\\n    if (!q) return text;\\n    const i = text.toLowerCase().indexOf(q.toLowerCase());\\n    if (i < 0) return text;\\n    return text.slice(0, i) + '<mark>' + text.slice(i, i + q.length) + '<\\/mark>' + text.slice(i + q.length);\\n  }\\n\\n  function render() {\\n    const q = input.textContent.trim();\\n    fieldWrap.classList.toggle('live', q.length > 0);\\n    input.classList.toggle('empty', q.length === 0);\\n\\n    if (!q) {\\n      results.innerHTML = `<div class=\\\"empty-state\\\"><div class=\\\"e1\\\">Ask anything.<\\/div><div class=\\\"e2\\\">Briefs, notes, people, chapters, todos — all in one place.<\\/div><\\/div>`;\\n      halo.setState('idle');\\n      return;\\n    }\\n\\n    // Ayumi \\\"thinks\\\" briefly while we filter\\n    halo.setState('thinking');\\n\\n    const ql = q.toLowerCase();\\n    let hits = CORPUS.filter(item => {\\n      if (scope !== 'all' && item.type !== scope) return false;\\n      return (item.t + ' ' + item.kw).toLowerCase().includes(ql st indexOverlay = document.getElementById('index-overlay');\\n  appMark.addEventListener('click', () => indexOverlay.classList.toggle('open'));\\n  indexOverlay.addEventListener('click', (e) => { if (e.target === indexOverlay) indexOverlay.classList.remove('open'); });\\n})();\\n<\\/script>\\n\\n\\n<script>\\n(function(){\\n  function nav(h){ try{ parent.postMessage({atlasNav:h},'*'); }catch(e){} }\\n  document.addEventListener('click', function(e){\\n    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\\n    if(!a) return;\\n    var href = a.getAttribute('href') || '';\\n    if(/\\\\.html(\\\\?|#|$)/i.test(href)){ e.preventDefault(); e.stopPropagation(); nav(href); }\\n  }, true);\\n  document.addEventListener('keydown', function(e){\\n    var t = e.target;\\n    if(t && (/(INPUT|TEXTAREA)/.test(t.tagName) || t.isContentEditable)) return;\\n    if(e.key==='ArrowLeft') nav('@prev');\\n    else if(e.key==='ArrowRight') nav('@next');\\n  });\\n})();\\n<\\/script>\\n<\\/body>\\n<\\/html>\\n\"}<\u002Fscript>\n  <script>\n  (function(){\n    var ORDER=['today','brief','chapters','northindia','review','search'];\n    var NAMES={today:'Today',brief:'Brief',chapters:'Chapters',northindia:'North India',review:'Review',search:'Search'};\n    var data=JSON.parse(document.getElementById('atlas-screens').textContent);\n    var FONTHEAD = data._fonts ? ('<style>'+data._fonts+'<\u002Fstyle>') : \"<link rel=\\\"preconnect\\\" href=\\\"https://fonts.googleapis.com\\\"><link rel=\\\"preconnect\\\" href=\\\"https://fonts.gstatic.com\\\" crossorigin><link href=\\\"https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap\\\" rel=\\\"stylesheet\\\">\";\n    var cache={};\n    function compose(key){\n      if(cache[key]) return cache[key];\n      var h=data[key]||'';\n      h=h.replace('<!--FONTS-->',FONTHEAD)\n         .replace('<!--CAPCSS-->','<style>'+data._capcss+'<\u002Fstyle>')\n         .replace('<!--HALOENGINE-->','<script>'+data._haloengine+'<\\/script>')\n         .replace('<!--CAPJS-->','<script>'+data._capjs+'<\\/script>');\n      cache[key]=h; return h;\n    }\n    var stage=document.getElementById('stage');\n    var prevBtn=document.getElementById('navprev'), nextBtn=document.getElementById('navnext');\n    var cur=0;\n    function clamp(i){ return (i%ORDER.length+ORDER.length)%ORDER.length; }\n    function show(i){\n      cur=clamp(i); var key=ORDER[cur];\n      stage.srcdoc=compose(key);\n      try{ localStorage.setItem('atlas-combined',key); }catch(e){}\n      try{ history.replaceState(null,'','#'+key); }catch(e){}\n      prevBtn.querySelector('.lab').textContent=NAMES[ORDER[clamp(cur-1)]];\n      nextBtn.querySelector('.lab').textContent=NAMES[ORDER[clamp(cur+1)]];\n    }\n    function keyFromHref(h){\n      h=decodeURIComponent(h||'');\n      if(/North India/i.test(h))return 'northindia';\n      if(/Today/i.test(h))return 'today';\n      if(/Brief/i.test(h))return 'brief';\n      if(/Chapters/i.test(h))return 'chapters';\n      if(/Review/i.test(h))return 'review';\n      if(/Search/i.test(h))return 'search';\n      return null;\n    }\n    window.addEventListener('message',function(e){\n      var d=e.data; if(!d||!d.atlasNav)return;\n      var h=d.atlasNav;\n      if(h==='@prev'){show(cur-1);return;}\n      if(h==='@next'){show(cur+1);return;}\n      var k=keyFromHref(h); if(k){ var i=ORDER.indexOf(k); if(i>=0) show(i); }\n    });\n    prevBtn.addEventListener('click',function(){show(cur-1);});\n    nextBtn.addEventListener('click',function(){show(cur+1);});\n    document.addEventListener('keydown',function(e){\n      if(e.key==='ArrowLeft')show(cur-1);\n      else if(e.key==='ArrowRight')show(cur+1);\n    });\n    var start=(location.hash||'').replace('#','');\n    if(ORDER.indexOf(start)<0){ try{start=localStorage.getItem('atlas-combined');}catch(e){} }\n    if(ORDER.indexOf(start)<0) start='northindia
