document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Atlas COS<\u002Ftitle>\n<style>\n  *{box-sizing:border-box;}\n  html,body{margin:0;height:100%;background:#ededea;overflow:hidden;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}\n  #stage{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#ededea;}\n  .navx{position:fixed;top:50%;transform:translateY(-50%);z-index:10;width:34px;height:78px;\n    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;\n    background:transparent;border:0;cursor:pointer;color:#aab2bb;opacity:.5;\n    transition:opacity .22s ease,color .22s ease;-webkit-tap-highlight-color:transparent;}\n  .navx:hover{opacity:1;color:#2c3942;}\n  .navx svg{display:block;}\n  .navx .lab{font-size:7px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;}\n  .navx.prev{left:7px;} .navx.next{right:7px;}\n  @media (max-width:520px){ .navx{opacity:.42;} }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n  <iframe id=\"stage\" title=\"Atlas COS\"><\u002Fiframe>\n\n  <button class=\"navx prev\" id=\"navprev\" aria-label=\"Previous screen\">\n    <svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><path d=\"M9 2 L4 7 L9 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n    <span class=\"lab\"><\u002Fspan>\n  <\u002Fbutton>\n  <button class=\"navx next\" id=\"navnext\" aria-label=\"Next screen\">\n    <svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><path d=\"M5 2 L10 7 L5 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n    <span class=\"lab\"><\u002Fspan>\n  <\u002Fbutton>\n\n  <script type=\"application/json\" id=\"atlas-screens\">{\"_capcss\":\"/* ════════════════════════════════════════════════════════════════\\n   atlas-capture.css — the summon cue + co-completion sheet.\\n   One module, mounted on every screen. Everything is scoped under\\n   #atlas-capture so it can never collide with a screen's own styles.\\n   Capture is not a destination — it is Ayumi, summoned in place.\\n   ════════════════════════════════════════════════════════════════ */\\n\\n#atlas-capture { position: absolute; inset: 0; z-index: 60; pointer-events: none; }\\n#atlas-capture * { box-sizing: border-box; }\\n\\n/* ── Summon cue — the teal presence dot, slowly rising ──────────── */\\n#atlas-capture .ac-summon {\\n  position: absolute; left: 0; right: 0; bottom: 0;\\n  height: 78px; z-index: 1;\\n  display: flex; justify-content: center; align-items: flex-end;\\n  padding-bottom: 17px;\\n  pointer-events: none; /* the gradient is decorative — only the cue is tappable */\\n  background: linear-gradient(180deg, rgba(255,255,255,0) 0%, var(--paper, #fff) 64%);\\n  -webkit-tap-highlight-color: transparent;\\n}\\n/* When the host screen already has a bottom action/compose bar, lift the cue\\n   above it (set via JS) and drop the paper gradient so nothing is covered. */\\n#atlas-capture.has-bottom-bar .ac-summon {\\n  height: 46px; padding-bottom: 8px; background: none;\\n}\\n#atlas-capture .ac-cue {\\n  position: relative; width: 64px; height: 44px;\\n  display: flex; justify-content: center; align-items: flex-end;\\n  pointer-events: auto; cursor: pointer;\\n  -webkit-tap-highlight-color: transparent;\\n  transition: transform 340ms cubic-bezier(.34,1.1,.64,1);\\n}\\n#atlas-capture .ac-cue:hover,\\n#atlas-capture .ac-cue:active { transform: translateY(-3px); }\\n#atlas-capture .ac-trail {\\n  position: absolute; left: 50%; bottom: 7px; transform: translateX(-50%);\\n  width: 2px; height: 26px; border-radius: 2px;\\n  background: linear-gradient(180deg, rgba(0,137,168,0) 0%, rgba(0,137,168,0.24) 100%);\\n  opacity: 0; animation: ac-trail 4.8s ease-in-out infinite;\\n}\\n#atlas-capture .ac-dot {\\n  position: absolute; left: 50%; bottom: 7px;\\n  width: 7px; height: 7px; border-radius: 50%;\\n  background: var(--teal, #0089a8);\\n  transform: translate(-50%, 0);\\n  animation: ac-dot 4.8s ease-in-out infinite;\\n}\\n@keyframes ac-dot {\\n  0%   { transform: translate(-50%, 6px);  opacity: 0; }\\n  16%  { opacity: 1; }\\n  58%  { opacity: 1; }\\n  76%  { transform: translate(-50%, -26px); opacity: 0; }\\n  100% { transform: translate(-50%, -26px); opacity: 0; }\\n}\\n@keyframes ac-trail {\\n  0%   { opacity: 0; transform: translateX(-50%) scaleY(0.2); }\\n  24%  { opacity: 0.85; }\\n  66%  { opacity: 0.4; }\\n  80%, 100% { opacity: 0; transform: translateX(-50%) scaleY(1); }\\n}\\n@media (prefers-reduced-motion: reduce) {\\n  #atlas-capture .ac-dot, #atlas-capture .ac-trail { animation: none; opacity: 0.9; }\\n  #atlas-capture .ac-dot { transform: translate(-50%, -8px); }\\n}\\n\\n/* ── Dim + sheet ────────────────────────────────────────────────── */\\n#atlas-capture .ac-dim {\\n  position: absolute; inset: 0; z-index: 2;\\n  background: rgba(13,20,26,0); pointer-events: none;\\n  transition: background 360ms;\\n}\\n#atlas-capture.open .ac-dim { background: rgba(13,20,26,0.34); pointer-events: auto; }\\n#atlas-capture.open .ac-summon { pointer-events: none; opacity: 0; transition: opacity 200ms; }\\n\\n#atlas-capture .ac-sheet {\\n  position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 3;\\n  background: var(--paper, #fff); border-radius: 28px;\\n  padding: 15px 16px 14px;\\n  box-shadow: 0 -12px 44px -14px rgba(20,24,32,0.45);\\n  transform: translateY(118%);\\n  transition: transform 480ms cubic-bezier(.34,1.10,.64,1);\\n  pointer-events: auto;\\n}\\n#atlas-capture.open .ac-sheet { transform: translateY(0); }\\n#atlas-capture .ac-grab {\\n  width: 38px; height: 4px; border-radius: 999px;\\n  background: var(--ink-4, #aab2bb); opacity: 0.5; margin: 0 auto 12px;\\n  cursor: grab;\\n}\\n#atlas-capture .ac-ctx {\\n  display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;\\n}\\n#atlas-capture .ac-ctx .ac-pr {\\n  font-family: var(--mono, monospace); font-size: 9px; letter-spacing: 0.18em;\\n  text-transform: uppercase; color: var(--ink-3, #6a7480);\\n}\\n#atlas-capture .ac-ctx .ac-esc {\\n  font-family: var(--mono, monospace); font-size: 8.5px; letter-spacing: 0.1em;\\n  text-transform: uppercase; color: var(--ink-4, #aab2bb);\\n}\\n\\n/* ── The well ───────────────────────────────────────────────────── */\\n#atlas-capture .ac-well {\\n  position: relative; min-height: 150px; border-radius: 14px;\\n  background: var(--paper-deep, #f7f7f5);\\n  box-shadow: inset 0 0 0 1px var(--rule-soft, rgba(40,44,52,0.05));\\n  padding: 15px 15px 14px; overflow: hidden;\\n}\\n#atlas-capture .ac-field {\\n  font-family: var(--serif, 'Instrument Serif', serif); font-size: 18px; line-height: 1.5;\\n  color: var(--ink, #0d141a); white-space: pre-wrap; word-break: break-word;\\n  min-height: 78px; outline: none;\\n}\\n#atlas-capture .ac-field .ink   { color: var(--ink, #0d141a); }\\n#atlas-capture .ac-field .ghost { color: var(--ink-4, #aab2bb); font-style: italic; }\\n#atlas-capture .ac-field .ph    { color: var(--ink-3, #6a7480); font-style: italic; }\\n#atlas-capture .ac-field .int   { font-style: normal; color: var(--teal-deep, #00576b); }\\n#atlas-capture .ac-field .int::before { content: '— '; color: var(--teal, #0089a8); }\\n#atlas-capture .ac-caret {\\n  display: inline-block; width: 1px; height: 18px; background: var(--ink, #0d141a);\\n  vertical-align: -3px; margin: 0 1px; animation: ac-blink 1.1s steps(2,end) infinite;\\n}\\n@keyframes ac-blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }\\n#atlas-capture .ac-penline { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: none; }\\n#atlas-capture .ac-well.voice .ac-penline { display: block; }\\n\\n/* ── Forming tag ────────────────────────────────────────────────── */\\n#atlas-capture .ac-formtag {\\n  display: inline-flex; align-items: center; gap: 8px; margin-top: 13px;\\n  padding: 6px 12px; border-radius: 999px; background: #e0f1f4;\\n  box-shadow: inset 0 0 0 1px rgba(0,137,168,0.15);\\n  opacity: 0; transform: translateY(6px) scale(0.97);\\n  transition: opacity 300ms, transform 300ms cubic-bezier(.34,1.16,.64,1);\\n}\\n#atlas-capture .ac-formtag.show { opacity: 1; transform: none; }\\n#atlas-capture .ac-formtag.locked { background: var(--forest, #0d3324); box-shadow: none; }\\n#atlas-capture .ac-formtag .ac-fk {\\n  font-family: var(--mono, monospace); font-size: 8px; letter-spacing: 0.12em;\\n  text-transform: uppercase; color: var(--teal-deep, #00576b);\\n}\\n#atlas-capture .ac-formtag.locked .ac-fk { color: #9fc4b0; }\\n#atlas-capture .ac-formtag .ac-fv {\\n  font-family: var(--serif, serif); font-style: italic; font-size: 13px; color: var(--ink-2, #2c3942);\\n}\\n#atlas-capture .ac-formtag.locked .ac-fv { color: #eaf3ee; }\\n\\n/* ── Accept hint ────────────────────────────────────────────────── */\\n#atlas-capture .ac-accept {\\n  display: flex; align-items: center; gap: 7px; margin-top: 13px; min-height: 16px;\\n  font-family: var(--mono, monospace); font-size: 8.5px; letter-spacing: 0.08em;\\n  text-transform: uppercase; color: var(--ink-4, #aab2bb); transition: opacity 200ms;\\n}\\n#atlas-capture .ac-accept kbd {\\n  font-family: var(--mono, monospace); font-size: 8.5px; background: #fff;\\n  border: 1px solid var(--rule, rgba(40,44,52,0.10)); border-radius: 4px; padding: 2px 6px;\\n  color: var(--ink-3, #6a7480);\\n}\\n\\n/* ── Question-back ──────────────────────────────────────────────── */\\n#atlas-capture .ac-qback {\\n  margin-top: 13px; padding: 0 14px; border-radius: 12px; background: #fff;\\n  box-shadow: var(--shadow-1, 0 2px 10px -4px rgba(20,24,32,0.1));\\n  opacity: 0; max-height: 0; overflow: hidden;\\n  transition: opacity 320ms, max-height 320ms, padding 320ms, margin 320ms;\\n}\\n#atlas-capture .ac-qback.show { opacity: 1; max-height: 220px; padding: 13px 14px; }\\n#atlas-capture .ac-ql { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }\\n#atlas-capture .ac-ql .ac-av {\\n  width: 16px; height: 16px; border-radius: 50%; background: var(--ink, #0d141a);\\n  position: relative; overflow: hidden;\\n}\\n#atlas-capture .ac-ql .ac-av::after {\\n  content: ''; position: absolute; inset: 0;\\n  background: radial-gradient(circle at 35% 30%, rgba(122,214,198,0.9), rgba(90,143,116,0.5) 60%, rgba(0,0,0,0) 100%);\\n  animation: ac-gentle 2.4s ease-in-out infinite;\\n}\\n@keyframes ac-gentle { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }\\n#atlas-capture .ac-ql .ac-nm {\\n  font-family: var(--mono, monospace); font-size: 8.5px; letter-spacing: 0.14em;\\n  text-transform: uppercase; color: var(--ink-3, #6a7480);\\n}\\n#atlas-capture .ac-q {\\n  font-family: var(--serif, serif); font-style: italic; font-size: 16px; line-height: 1.4;\\n  color: var(--ink, #0d141a); text-wrap: pretty;\\n}\\n#atlas-capture .ac-chips { display: flex; gap: 8px; margin-top: 12px; align-items: center; }\\n#atlas-capture .ac-chip {\\n  padding: 8px 15px; border-radius: 999px; background: var(--ink, #0d141a); color: #fff;\\n  font-family: var(--serif, serif); font-size: 14px; cursor: pointer; border: 0;\\n  transition: transform 120ms;\\n}\\n#atlas-capture .ac-chip:active { transform: scale(0.96); }\\n#atlas-capture .ac-chip.alt { background: transparent; color: var(--ink-2, #2c3942); box-shadow: inset 0 0 0 1px var(--rule, rgba(40,44,52,0.10)); }\\n#atlas-capture .ac-chip.ig {\\n  margin-left: auto; background: transparent; color: var(--ink-4, #aab2bb);\\n  font-family: var(--mono, monospace); font-size: 9px; letter-spacing: 0.1em;\\n  text-transform: uppercase; padding: 8px 4px;\\n}\\n\\n/* ── Controls row ───────────────────────────────────────────────── */\\n#atlas-capture .ac-controls { display: flex; align-items: center; gap: 10px; margin-top: 14px; }\\n#atlas-capture .ac-mic {\\n  width: 42px; height: 42px; border-radius: 50%; background: var(--paper-deep, #f7f7f5);\\n  box-shadow: inset 0 0 0 1px var(--rule, rgba(40,44,52,0.10)); color: var(--ink-2, #2c3942);\\n  display: flex; align-items: center; justify-content: center; cursor: pointer;\\n  transition: background 200ms, color 200ms; flex-shrink: 0;\\n}\\n#atlas-capture .ac-mic.live {\\n  background: var(--forest, #0d3324); color: #fff; box-shadow: 0 0 0 0 rgba(13,51,36,0.3);\\n  animation: ac-mic 1.7s ease-in-out infinite;\\n}\\n@keyframes ac-mic {\\n  0%,100% { box-shadow: 0 0 0 0 rgba(13,51,36,0.26); }\\n  50%     { box-shadow: 0 0 0 9px rgba(13,51,36,0); }\\n}\\n#atlas-capture .ac-src {\\n  font-family: var(--mono, monospace); font-size: 8.5px; letter-spacing: 0.1em;\\n  text-transform: uppercase; color: var(--ink-4, #aab2bb);\\n}\\n#atlas-capture .ac-spacer { flex: 1; }\\n#atlas-capture .ac-capbtn {\\n  background: var(--ink, #0d141a); color: #fff; border: 0; padding: 12px 22px;\\n  border-radius: 999px; font-family: var(--serif, serif); font-size: 16px; cursor: pointer;\\n  transition: transform 120ms, background 200ms, opacity 200ms;\\n}\\n#atlas-capture .ac-capbtn:active { transform: scale(0.97); }\\n#atlas-capture .ac-capbtn:disabled { opacity: 0.4; cursor: default; }\\n\\n/* ── Filed confirmation ─────────────────────────────────────────── */\\n#atlas-capture .ac-filed {\\n  position: absolute; inset: 0; z-index: 4; background: var(--paper, #fff); border-radius: 28px;\\n  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;\\n  text-align: center; padding: 0 30px; opacity: 0; pointer-events: none; transition: opacity 360ms;\\n}\\n#atlas-capture .ac-filed.show { opacity: 1; }\\n#atlas-capture .ac-filed .ac-mark { font-family: var(--serif, serif); font-style: italic; font-size: 34px; color: var(--ink, #0d141a); }\\n#atlas-capture .ac-filed .ac-sub  { font-family: var(--serif, serif); font-style: italic; font-size: 15px; color: var(--ink-3, #6a7480); line-height: 1.5; text-wrap: pretty; }\\n#atlas-capture .ac-filed .ac-tagrow { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }\\n#atlas-capture .ac-filed .ac-tg {\\n  font-family: var(--mono, monospace); font-size: 8.5px; letter-spacing: 0.1em;\\n  text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: #e3ebe7; color: var(--forest, #0d3324);\\n}\\n\",\"_haloengine\":\"// ════════════════════════════════════════════════════════════════\\n//  Atlas COS — Halo Engine\\n//  Ayumi's presence as a single luminous \\\"thought\\\" that lives in the\\n//  22-px rim around the screen. One material, three grammars:\\n//    • idle      — nothing; clean rest\\n//    • thinking  — jade inhale bloom, then a wandering thought (journey)\\n//    • delivered — gold bloom-out from all edges, then settle (event)\\n//\\n//  Usage:\\n//    const halo = AtlasHalo.init(document.getElementById('halo'));\\n//    halo.setState('thinking');   // 'idle' | 'thinking' | 'delivered'\\n//    halo.bump(clientX, clientY); // optional: a small local disturbance\\n//\\n//  The canvas must sit BEHIND a page surface that is inset by ~22px,\\n//  so only the rim is visible.\\n// ════════════════════════════════════════════════════════════════\\nwindow.AtlasHalo = (function () {\\n\\n  function init(canvas, opts) {\\n    opts = opts || {};\\n    const RIM_INSET = opts.rimInset != null ? opts.rimInset : 11;\\n    const ctx = canvas.getContext('2d');\\n\\n    function sizeHalo() {\\n      const r = canvas.getBoundingClientRect();\\n      const w = Math.max(2, Math.round(r.width));\\n      const h = Math.max(2, Math.round(r.height));\\n      if (canvas.width !== w)  canvas.width  = w;\\n      if (canvas.height !== h) canvas.height = h;\\n    }\\n    sizeHalo();\\n    window.addEventListener('resize', sizeHalo);\\n    setTimeout(sizeHalo, 50);\\n    setTimeout(sizeHalo, 250);\\n\\n    // ── Smooth multi-frequency noise (organic wander) ──────────\\n    function smoothNoise(t, phase) {\\n      return (\\n        Math.sin(t * 0.00041 + phase)        * 0.42 +\\n        Math.sin(t * 0.00097 + phase * 1.7)  * 0.28 +\\n        Math.sin(t * 0.00211 + phase * 2.3)  * 0.18 +\\n        Math.sin(t * 0.00373 + phase * 3.1)  * 0.12\\n      );\\n    }\\n\\n    let wanderAmp = 1;\\n    function rimPath(t) {\\n      const W = canvas.width, H = canvas.height;\\n      const w = W - 2 * RIM_INSET;\\n      const h = H - 2 * RIM_INSET;\\n      const perim = 2 * (w + h);\\n      let u = (((t % 1) + 1) % 1) * perim;\\n      let x, y, nx, ny;\\n      if (u < w)              { x = RIM_INSET + u;              y = RIM_INSET;             nx = 0;  ny = 1;  }\\n      else if (u - w < h)     { x = W - RIM_INSET;              y = RIM_INSET + (u - w);   nx = -1; ny = 0;  }\\n      else if (u - w - h < w) { x = W - RIM_INSET - (u - w - h);y = H - RIM_INSET;         nx = 0;  ny = -1; }\\n      else                    { x = RIM_INSET;                  y = H - RIM_INSET - (u - 2*w - h); nx = 1; ny = 0; }\\n      const ms = performance.now();\\n      const perp = smoothNoise(ms, 0.0) * 22 * wanderAmp;\\n      const tang = smoothNoise(ms, 5.7) * 18 * wanderAmp;\\n      const tx = -ny, ty = nx;\\n      return [x + nx * perp + tx * tang, y + ny * perp + ty * tang];\\n    }\\n\\n    const tip = { x: 0, y: 0 };\\n    let rimT = Math.random();          // start somewhere random on the rim\\n    let rimSpeed = 0;\\n    let deliveredAt = 0;\\n    let thinkingAt = 0;\\n    let stateName = 'idle';\\n    [tip.x, tip.y] = rimPath(rimT);\\n\\n    const trail = [];\\n    const TRAIL_LIFE_MS = 2600;\\n\\n    function settleToIdle() {\\n      deliveredAt = 0;\\n      stateName = 'idle';\\n      if (opts.onSettle) opts.onSettle();\\n    }\\n\\n    function step() {\\n      if (canvas.width < 50 || canvas.height < 50) sizeHalo();\\n      const ms = performance.now();\\n      const speedJitter = 1 + smoothNoise(ms, 4.2) * 0.55;\\n      let target = 0;\\n      if (stateName === 'thinking') {\\n        target = 0.00100 * speedJitter;\\n        wanderAmp += (1 - wanderAmp) * 0.05;\\n      } else if (stateName === 'delivered') {\\n        target = 0;\\n        wanderAmp += (0.12 - wanderAmp) * 0.06;\\n        if (deliveredAt && ms - deliveredAt > 2100) settleToIdle();\\n      } else {\\n        target = 0;\\n        wanderAmp += (1 - wanderAmp) * 0.05;\\n      }\\n      rimSpeed += (target - rimSpeed) * 0.05;\\n      rimT += rimSpeed;\\n      [tip.x, tip.y] = rimPath(rimT);\\n\\n      const now = performance.now();\\n      if (rimSpeed > 0.00015) trail.push({ x: tip.x, y: tip.y, born: now });\\n      while (trail.length && now - trail[0].born > TRAIL_LIFE_MS) trail.shift();\\n\\n      // ── Render ──────────────────────────────────────────────\\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\\n\\n      if (trail.length > 1) {\\n        ctx.lineCap = 'round';\\n        ctx.lineJoin = 'round';\\n        const C = (stateName === 'delivered')\\n          ? { aura: '208, 168, 92', mid: '216, 180, 108', core: '250, 240, 214' }\\n          : { aura: '70, 165, 130',  mid: '80, 180, 142',  core: '190, 230, 208' };\\n\\n        // Outer aura\\n        ctx.strokeStyle = `rgba(${C.aura}, 0.40)`;\\n        ctx.lineWidth = 18;\\n        for (let i = 1; i < trail.length; i++) {\\n          const a = 1 - (now - trail[i].born) / TRAIL_LIFE_MS;\\n          if (a <= 0) continue;\\n          ctx.globalAlpha = a * a * 0.55;\\n          ctx.beginPath();\\n          ctx.moveTo(trail[i-1].x, trail[i-1].y);\\n          ctx.lineTo(trail[i].x, trail[i].y);\\n          ctx.stroke();\\n        }\\n        // Mid glow\\n        ctx.strokeStyle = `rgba(${C.mid}, 0.72)`;\\n        ctx.lineWidth = 5;\\n        for (let i = 1; i < trail.length; i++) {\\n          const a = 1 - (now - trail[i].born) / TRAIL_LIFE_MS;\\n          if (a <= 0) continue;\\n          ctx.globalAlpha = a * 0.70;\\n          ctx.beginPath();\\n          ctx.moveTo(trail[i-1].x, trail[i-1].y);\\n          ctx.lineTo(trail[i].x, trail[i].y);\\n          ctx.stroke();\\n        }\\n        // Core\\n        ctx.strokeStyle = `rgba(${C.core}, 0.85)`;\\n        ctx.lineWidth = 1.4;\\n        for (let i = 1; i < trail.length; i++) {\\n          const a = 1 - (now - trail[i].born) / TRAIL_LIFE_MS;\\n          if (a <= 0) continue;\\n          ctx.globalAlpha = a * 0.55;\\n          ctx.beginPath();\\n          ctx.moveTo(trail[i-1].x, trail[i-1].y);\\n          ctx.lineTo(trail[i].x, trail[i].y);\\n          ctx.stroke();\\n        }\\n        ctx.globalAlpha = 1;\\n      }\\n\\n      // ── Delivered bloom (gold, fire-and-settle) ──────────────\\n      if (stateName === 'delivered' && deliveredAt) {\\n        const W = canvas.width, H = canvas.height;\\n        const t = Math.min(1, (now - deliveredAt) / 2100);\\n        const env = t < 0.22 ? (t / 0.22) : 1 - ((t - 0.22) / 0.78);\\n        const e = Math.max(0, Math.min(1, env));\\n        const band = 10 + (1 - e) * 26;\\n        const g = '212, 172, 96';\\n        ctx.save();\\n        const strip = (x0, y0, x1, y1, gx0, gy0, gx1, gy1) => {\\n          const grad = ctx.createLinearGradient(gx0, gy0, gx1, gy1);\\n          grad.addColorStop(0, `rgba(${g}, ${0.55 * e})`);\\n          grad.addColorStop(1, `rgba(${g}, 0)`);\\n          ctx.fillStyle = grad;\\n          ctx.fillRect(x0, y0, x1 - x0, y1 - y0);\\n        };\\n        strip(0, 0, W, band, 0, 0, 0, band);\\n        strip(0, H - band, W, H, 0, H, 0, H - band);\\n        strip(0, 0, band, H, 0, 0, band, 0);\\n        strip(W - band, 0, W, H, W, 0, W - band, 0);\\n        ctx.globalAlpha = e;\\n        ctx.strokeStyle = `rgba(250, 240, 214, ${0.7 * e})`;\\n        ctx.lineWidth = 1.4;\\n        ctx.strokeRect(RIM_INSET, RIM_INSET, W - 2*RIM_INSET, H - 2*RIM_INSET);\\n        ctx.restore();\\n        ctx.globalAlpha = 1;\\n      }\\n\\n      // ── Thinking onset inhale (jade, short) ──────────────────\\n      if (stateName === 'thinking' && thinkingAt) {\\n        const W = canvas.width, H = canvas.height;\\n        const t = (now - thinkingAt) / 700;\\n        if (t >= 1) { thinkingAt = 0; }\\n        else {\\n          const env = t < 0.35 ? (t / 0.35) : 1 - ((t - 0.35) / 0.65);\\n          const e = Math.max(0, Math.min(1, env)) * 0.7;\\n          const band = 8 + (1 - e) * 20;\\n          const g = '70, 165, 130';\\n          ctx.save();\\n          const strip = (x0, y0, x1, y1, gx0, gy0, gx1, gy1) => {\\n            const grad = ctx.createLinearGradient(gx0, gy0, gx1, gy1);\\n            grad.addColorStop(0, `rgba(${g}, ${0.5 * e})`);\\n            grad.addColorStop(1, `rgba(${g}, 0)`);\\n            ctx.fillStyle = grad;\\n            ctx.fillRect(x0, y0, x1 - x0, y1 - y0);\\n          };\\n          strip(0, 0, W, band, 0, 0, 0, band);\\n          strip(0, H - band, W, H, 0, H, 0, H - band);\\n          strip(0, 0, band, H, 0, 0, band, 0);\\n          strip(W - band, 0, W, H, W, 0, W - band, 0);\\n          ctx.restore();\\n          ctx.globalAlpha = 1;\\n        }\\n      }\\n    }\\n\\n    step();\\n    setInterval(step, 32);\\n\\n    function setState(name) {\\n      const prev = stateName;\\n      stateName = name;\\n      deliveredAt = (name === 'delivered') ? performance.now() : 0;\\n      if (name === 'thinking' && prev !== 'thinking') thinkingAt = performance.now();\\n      else if (name !== 'thinking') thinkingAt = 0;\\n    }\\n\\n    return {\\n      setState,\\n      get state() { return stateName; },\\n    };\\n  }\\n\\n  return { init };\\n})();\\n\",\"_capjs\":\"// ════════════════════════════════════════════════════════════════\\n//  atlas-capture.js — Capture, summoned in place.\\n//\\n//  Capture is not a screen you navigate to. It is Ayumi, reachable\\n//  from anywhere: a quiet teal cue at the foot of every surface that\\n//  rises into a co-completion well (tap or swipe up; swipe down / tap\\n//  outside / Esc to return — exactly where you were).\\n//\\n//  You hand Ayumi /div>' +\\n        '<div class=\\\"ac-formtag\\\"><span class=\\\"ac-fk\\\">forming<\\/span><span class=\\\"ac-fv\\\"><\\/span><\\/div>' +\\n        '<div class=\\\"ac-accept\\\"><\\/div>' +\\n        '<div class=\\\"ac-qback\\\">' +\\n          '<div class=\\\"ac-ql\\\"><span class=\\\"ac-av\\\"><\\/span><span class=\\\"ac-nm\\\">Ayumi asks<\\/span><\\/div>' +\\n          '<div class=\\\"ac-q\\\"><\\/div>' +\\n          '<div class=\\\"ac-chips\\\"><\\/div>' +\\n        '<\\/div>' +\\n        '<div class=\\\"ac-controls\\\">' +\\n          '<button class=\\\"ac-mic\\\" title=\\\"Voice\\\" aria-label=\\\"Speak\\\">' +\\n            '<svg width=\\\"18\\\" height=\\\"18\\\" viewBox=\\\"0 0 18 18\\\" fill=\\\"none\\\"><rect x=\\\"6.6\\\" y=\\\"2.2\\\" width=\\\"4.8\\\" height=\\\"9.2\\\" rx=\\\"2.4\\\" fill=\\\"currentColor\\\"/><path d=\\\"M3.6 8.6 C3.6 12.4 6 14.4 9 14.4 C12 14.4 14.4 12.4 14.4 8.6\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"1.3\\\" fill=\\\"none\\\" stroke-linecap=\\\"round\\\"/><line x1=\\\"9\\\" y1=\\\"14.4\\\" x2=\\\"9\\\" y2=\\\"16.4\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"1.3\\\" stroke-linecap=\\\"round\\\"/><\\/svg>' +\\n          '<\\/button>' +\\n          '<span class=\\\"ac-src\\\">type or speak<\\/span>' +\\n          '<span class=\\\"ac-spacer\\\"><\\/span>' +\\n          '<button class=\\\"ac-capbtn\\\" disabled>Capture<\\/button>' +\\n        '<\\/div>' +\\n        '<div class=\\\"ac-filed\\\">' +\\n          '<div class=\\\"ac-mark\\\">Kept.<\\/div>' +\\n          '<div class=\\\"ac-sub\\\"><\\/div>' +\\n          '<div class=\\\"ac-tagrow\\\"><\\/div>' +\\n        '<\\/div>' +\\n      '<\\/div>';\\n    page.appendChild(root);\\n\\n    var $ = function (s) { return root.querySelector(s); };\\n    var summon  = $('.ac-summon');\\n    var cue     = $('.ac-cue');\\n    var dim     = $('.ac-dim');\\n    var sheet   = $('.ac-sheet');\\n    var well    = $('.ac-well');\\n    var field   = $('.ac-field');\\n    var penline = $('.ac-penline');\\n    var formtag = $('.ac-formtag');\\n    var fk = $('.ac-fk'), fv = $('.ac-fv');\\n    var accept  = $('.ac-accept');\\n    var qback   = $('.ac-qback');\\n    var qtext   = $('.ac-q'), qchips = $('.ac-chips');\\n    var mic     = $('.ac-mic');\\n    var srclbl  = $('.ac-src');\\n    var capbtn  = $('.ac-capbtn');\\n    var filed   = $('.ac-filed');\\n    var filedsub = $('.ac-sub'), filedtags = $('.ac-tagrow');\\n\\n    // ── Co-completion dictionary ────────────────────────────────\\n    // Type the start of any; Ayumi ghosts the remainder + structure.\\n    var PREDICTIONS = [\\n      { full: \\\"Karan wants retention by Tuesday — pull the M6 cohort and send it ahead of the 2:30.\\\", kind: 'todo', tag: 'Stratyfix · due Tue', q: { text: \\\"Send it before the call, or wait for his nudge?\\\", a: ['Send ahead', 'Wait'] } },\\n      { full: \\\"Remind me to ask V. about moving the studio sitting to 11:30 — the light's better.\\\", kind: 'todo', tag: 'today', q: null },\\n      { full: \\\"I think we should drop the IP side-letter if it slows the close.\\\", kind: 'decision', tag: 'Stratyfix', q: { text: \\\"Is the side-letter a hard no, or negotiable if he pushes?\\\", a: ['Hard no', 'Negotiable'] } },\\n      { full: \\\"Worried the runway is tighter than we're saying — maybe nine months, not twelve.\\\", kind: 'note', tag: 'Stratyfix · journal', q: { text: \\\"Want the real runway number worked out and put in the brief?\\\", a: ['Yes, add it', 'Not now'] } },\\n      { full: \\\"Book the Volvo sleeper to Manali and grab offline maps for the valley.\\\", kind: 'todo', tag: 'Varanasi · 2 todos', q: null }\\n    ];\\n\\n    var state = resetState();\\n    function resetState() {\\n      return { open: false, typed: '', ghost: '', match: null, locked: false, mode: 'text', voiceTimers: [], captured: false, asked: false, voiceHTML: '' };\\n    }\\n\\n    function predict(typed) {\\n      var lo = typed.trim().toLowerCase();\\n      if (lo.length < 4) return { ghost: '', match: null };\\n      for (var i = 0; i < PREDICTIONS.length; i++) {\\n        if (PREDICTIONS[i].full.toLowerCase().indexOf(lo) === 0) {\\n          return { ghost: PREDICTIONS[i].full.slice(typed.length), match: PREDICTIONS[i] };\\n        }\\n      }\\n      if (lo.length >= 12) return { ghost: \\\" — I'll file this under the right thread.\\\", match: { kind: 'note', tag: 'auto-filed', generic: true, q: null } };\\n      return { ghost: '', match: null };\\n    }\\n\\n    function esc(s) { return s.replace(/&/g, '&amp;').replace(/<\\/g, '&lt;').replace(/>/g, '&gt;'); }\\n\\n    function render() {\\n      if (state.mode === 'voice') {\\n        field.innerHTML = state.voiceHTML || '<span class=\\\"ph\\\">listening…<\\/span>';\\n      } else if (!state.typed && !state.ghost) {\\n        field.innerHTML = '<span class=\\\"ph\\\">Begin anywhere — a word is enough.<\\/span><span class=\\\"ac-caret\\\"><\\/span>';\\n      } else {\\n        field.innerHTML = '<span class=\\\"ink\\\">' + esc(state.typed) + '<\\/span>' +\\n          '<span class=\\\"ac-caret\\\"><\\/span>' +\\n          (state.ghost && !state.locked ? '<span class=\\\"ghost\\\">' + esc(state.ghost) + '<\\/span>' : '');\\n      }\\n      var showReal = state.match && !state.match.generic && (state.ghost || state.locked);\\n      var showGeneric = state.match && state.match.generic && state.locked;\\n      if (showReal || showGeneric) {\\n        fk.textContent = state.locked ? 'kept as' : 'forming';\\n        fv.textContent = state.match.generic ? 'note · auto-filed' : (state.match.kind + ' · ' + state.match.tag);\\n        formtag.classList.add('show');\\n        formtag.classList.toggle('locked', state.locked);\\n      } else {\\n        formtag.classList.remove('show', 'locked');\\n      }\\n      if (state.mode === 'text' && state.ghost && !state.locked) {\\n        accept.innerHTML = '<kbd>tab ↹<\\/kbd> accept Ayumi\\\\u2019s completion · keep typing to override';\\n      } else if (state.locked) {\\n        accept.innerHTML = 'accepted · edit freely, then capture';\\n      } else {\\n        accept.innerHTML = '';\\n      }\\n      capbtn.disabled = !(state.typed || state.locked || state.mode === 'voice');\\n    }\\n\\n    // ── Open / close ────────────────────────────────────────────\\n    function openSheet() {\\n      if (state.open) return;\\n      clearVoice();\\n      state = resetState();\\n      state.open = true;\\n      root.classList.add('open');\\n      filed.classList.remove('show');\\n      qback.classList.remove('show');\\n      well.classList.remove('voice');\\n      mic.classList.remove('live');\\n      srclbl.textContent = 'type or speak';\\n      capbtn.textContent = 'Capture';\\n      render();\\n    }\\n    function closeSheet() {\\n      if (!state.open) return;\\n      state.open = false;\\n      clearVoice(); stopPen();\\n      root.classList.remove('open');\\n      halo().setState('idle');\\n    }\\n    function clearVoice() { state.voiceTimers.forEach(function (t) { clearTimeout(t); }); state.voiceTimers = []; }\\n\\n    // ── If the host screen already has a bottom action/compose bar,\\n    //    lift the cue above it so it never covers or intercepts those\\n    //    controls (e.g. Brief's \\\"Start the meeting\\\").\\n    var bottomBar = page.querySelector('.action-zone, .compose-zone, [data-capture-avoid]');\\n    function placeCue() {\\n      if (!bottomBar) return;\\n      root.classList.add('has-bottom-bar');\\n      var h = Math.round(bottomBar.getBoundingClientRect().height) || 64;\\n      summon.style.bottom = h + 'px';\\n    }\\n    placeCue();\\n    setTimeout(placeCue, 120);\\n    window.addEventListener('resize', placeCue);\\n\\n    // ── Summon: tap, keyboard, swipe up ─────────────────────────\\n    cue.addEventListener('click', openSheet);\\n    cue.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(); } });\\n    var suY = null;\\n    cue.addEventListener('pointerdown', function (e) { suY = e.clientY; });\\n    cue.addEventListener('pointermove', function (e) { if (suY != null && suY - e.clientY > 24) { suY = null; openSheet(); } });\\n    cue.addEventListener('pointerup', function () { suY = null; });\\n    // swipe up anywhere along the bottom edge of the page (when closed)\\n    var edgeY = null;\\n    page.addEventListener('touchstart', function (e) {\\n      if (state.open) return;\\n      var t = e.touches[0]; var r = page.getBoundingClientRect();\\n      if (t.clientY > r.bottom - 64) edgeY = t.clientY; else edgeY = null;\\n    }, { passive: true });\\n    page.addEventListener('touchend', function (e) {\\n      if (edgeY == null || state.open) { edgeY = null; return; }\\n      var dy = edgeY - e.changedTouches[0].clientY; edgeY = null;\\n      if (dy > 36) openSheet();\\n    }, { passive: true });\\n\\n    dim.addEventListener('click', closeSheet);\\n    // swipe the sheet down to dismiss\\n    var shY = null;\\n    sheet.addEventListener('pointerdown', function (e) { if (e.target.closest('.ac-grab') || e.target === sheet) shY = e.clientY; });\\n    window.addEventListener('pointermove', function (e) { if (shY != null && e.clientY - shY > 60) { shY = null; closeSheet(); } });\\n    window.addEventListener('pointerup', function () { shY = null; });\\n\\n    // ── Typing model (keyboard captured only while open) ────────\\n    document.addEventListener('keydown', function (e) {\\n      if (!state.open) return;\\n      if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }\\n      if (state.mode !== 'text') { if (e.key === 'Enter') { e.preventDefault(); onCapture(); } return; }\\n      if (e.key === 'Tab') {\\n        e.preventDefault();\\n        if (state.ghost && !state.locked) { state.typed += state.ghost; state.ghost = ''; state.locked = true; render(); }\\n        return;\\n      }\\n      if (e.key === 'Enter') { e.preventDefault(); onCapture(); return; }\\n      if (e.key === 'Backspace') {\\n        e.preventDefault();\\n        state.locked = false; state.typed = state.typed.slice(0, -1);\\n        var p = predict(state.typed); state.ghost = p.ghost; state.match = p.match;\\n        render(); return;\\n      }\\n      if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) {\\n        e.preventDefault();\\n        state.locked = false; state.typed += e.key;\\n        var pr = predict(state.typed); state.ghost = pr.ghost; state.match = pr.match;\\n        render();\\n      }\\n    });\\n\\n    // ── PenLine — scripted fountain-pen voice line ──────────────\\n    var penRAF = null;\\n    function startPen() {\\n      var ctx = penline.getContext('2d');\\n      var dpr = window.devicePixelRatio || 1;\\n      function fit() { penline.width = penline.clientWidth * dpr; penline.height = penline.clientHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }\\n      fit();\\n      var t0 = 0, sf = 0, st = 0;\\n      function drawLine(W, y, a, rgb) {\\n        var minL = W * 0.46, maxL = W * 0.84, len = minL + (maxL - minL) * a, x1 = (W - len) / 2, x2 = x1 + len, op = 0.10 + 0.64 * a;\\n        [[1, 0], [0.66, 0.4], [0.34, 0.85]].forEach(function (p) {\\n          var ix = (x2 - x1) * p[1] * 0.5;\\n          ctx.strokeStyle = 'rgba(' + rgb + ',' + op + ')';\\n          ctx.lineWidth = (0.85 + 1.05 * a) * p[0]; ctx.lineCap = 'round';\\n          ctx.beginPath(); ctx.moveTo(x1 + ix, y); ctx.lineTo(x2 - ix, y); ctx.stroke();\\n        });\\n      }\\n      function tick(t) {\\n        if (!t0) t0 = t; var ms = t - t0;\\n        var W = penline.clientWidth, H = penline.clientHeight;\\n        ctx.clearRect(0, 0, W, H);\\n        var s = ms / 1000;\\n        var env = Math.max(0, Math.min(1, Math.max(0, Math.sin(s * 3.1) * 0.6 + Math.sin(s * 7.7) * 0.3) * (0.4 + 0.6 * (Math.sin(s * 0.45) * 0.5 + 0.5))));\\n        sf += (env - sf) * (env > sf ? 0.12 : 0.045);\\n        var c = s % 5, tg = (c > 3.6 && c < 4.4) ? Math.sin((c - 3.6) / 0.8 * Math.PI) : 0;\\n        st += (tg - st) * (tg > st ? 0.18 : 0.08);\\n        drawLine(W, H * 0.40, sf * (1 - st * 0.6), '13,51,36');\\n        if (st > 0.02) drawLine(W, H * 0.66, st, '0,137,168');\\n        penRAF = requestAnimationFrame(tick);\\n      }\\n      penRAF = requestAnimationFrame(tick);\\n    }\\n    function stopPen() { if (penRAF) cancelAnimationFrame(penRAF); penRAF = null; }\\n\\n    // ── Voice duet (scripted) ───────────────────────────────────\\n    mic.addEventListener('click', function () {\\n      if (state.mode === 'voice') return;\\n      state.mode = 'voice'; state.locked = false; state.typed = ''; state.ghost = '';\\n      mic.classList.add('live'); well.classList.add('voice'); srclbl.textContent = '0:00 · listening';\\n      halo().setState('thinking'); startPen();\\n      qback.classList.remove('show');\\n      var seq = [\\n        { at: 300,  html: '<span class=\\\"ink\\\">I\\\\u2019m worried the runway math is<\\/span><span class=\\\"ac-caret\\\"><\\/span>' },\\n        { at: 1300, html: '<span class=\\\"ink\\\">I\\\\u2019m worried the runway math is tighter than we\\\\u2019re saying<\\/span> <span class=\\\"int\\\">how tight?<\\/span><span class=\\\"ac-caret\\\"><\\/span>' },\\n        { at: 2600, html: '<span class=\\\"ink\\\">I\\\\u2019m worried the runway math is tighter than we\\\\u2019re saying — maybe nine months, not twelve<\\/span> <span class=\\\"int\\\">logged<\\/span><span class=\\\"ac-caret\\\"><\\/span>' }\\n      ];\\n      seq.forEach(function (s) { state.voiceTimers.push(setTimeout(function () { state.voiceHTML = s.html; render(); }, s.at)); });\\n      state.voiceTimers.push(setTimeout(function () {\\n        state.match = { kind: 'note', tag: 'Stratyfix · journal' };\\n        fk.textContent = 'forming'; fv.textContent = 'note · Stratyfix · journal';\\n        formtag.classList.add('show');\\n        srclbl.textContent = '0:24 · paused';\\n        askQuestion({ text: \\\"Want the real runway number worked out and put in the brief?\\\", a: ['Yes, add it', 'Not now'] });\\n        capbtn.disabled = false;\\n      }, 3800));\\n    });\\n\\n    function askQuestion(q) {\\n      if (!q) return;\\n      qtext.textContent = q.text;\\n      qchips.innerHTML = '';\\n      q.a.forEach(function (label, i) {\\n        var b = document.createElement('button');\\n        b.className = 'ac-chip' + (i === 0 ? '' : ' alt');\\n        b.textContent = label;\\n        b.addEventListener('click', function () { qback.classList.remove('show'); doCapture(label); });\\n        qchips.appendChild(b);\\n      });\\n      var ig = document.createElement('button');\\n      ig.className = 'ac-chip ig'; ig.textContent = 'ignore';\\n      ig.addEventListener('click', function () { qback.classList.remove('show'); });\\n      qchips.appendChild(ig);\\n      qback.classList.add('show');\\n    }\\n\\n    // ── Capture ─────────────────────────────────────────────────\\n    capbtn.addEventListener('click', onCapture);\\n    function onCapture() {\\n      if (state.mode === 'text' && state.match && state.match.q && !state.asked) {\\n        state.asked = true;\\n        if (state.ghost && !state.locked) { state.typed += state.ghost; state.ghost = ''; state.locked = true; render(); }\\n        askQuestion(state.match.q);\\n        return;\\n      }\\n      doCapture();\\n    }\\n    function doCapture(answer) {\\n      if (state.captured) return;\\n      state.captured = true;\\n      clearVoice(); stopPen();\\n      mic.classList.remove('live');\\n      halo().setState('delivered');\\n      var kind = (state.match && state.match.kind) || 'note';\\n      var tag = (state.match && state.match.tag) || 'auto-filed';\\n      var tags = [kind + ' · ' + tag];\\n      if (answer) tags.push('you said: ' + answer.toLowerCase());\\n      filedsub.textContent = state.mode === 'voice'\\n        ? 'Your thought is in the Stratyfix thread. I\\\\u2019ll bring the runway math to your next brief.'\\n        : 'Filed to the right thread. It\\\\u2019s waiting for you where it belongs.';\\n      filedtags.innerHTML = tags.map(function (t) { return '<span class=\\\"ac-tg\\\">' + esc(t) + '<\\/span>'; }).join('');\\n      filed.classList.add('show');\\n      setTimeout(closeSheet, 1700);\\n    }\\n  });\\n})();\\n\",\"_fonts\":\"\",\"today\":\"<!doctype html>\\n<html lang=\\\"en\\\">\\n<head>\\n<meta charset=\\\"utf-8\\\" />\\n<meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\" />\\n<title>Atlas v0.6 — Today × Halo<\\/title>\\n\\n<!--FONTS-->\\n<!--CAPCSS-->\\n\\n<style>\\n  :root {\\n    /* White & quiet — sophistication, simplicity, hint of awe.\\n       The room around the phone is a soft neutral; the page is true\\n       white. The smoke at the edges is what carries the wonder. */\\n    --desk:        #ededea;     /* the room around the phone */\\n    --paper:       #ffffff;     /* page surface inside the halo */\\n    --paper-deep:  #f7f7f5;     /* sunk wells */\\n    --card:        #ffffff;\\n\\n    --ink:         #0d141a;\\n    --ink-2:       #2c3942;\\n    --ink-3:       #6a7480;\\n    --ink-4:       #aab2bb;\\n\\n    --rule:        rgba(40, 44, 52, 0.10);\\n    --rule-soft:   rgba(40, 44, 52, 0.05);\\n\\n    --shadow-1:\\n      0 0.5px 1px rgba(20, 24, 32, 0.04),\\n      2px 4px 10px -4px rgba(20, 24, 32, 0.06),\\n      4px 12px 28px -14px rgba(20, 24, 32, 0.10);\\n    --shadow-2:\\n      0 1px 1px rgba(20, 24, 32, 0.05),\\n      3px 6px 14px -4px rgba(20, 24, 32, 0.09),\\n      6px 16px 32px -10px rgba(20, 24, 32, 0.14);\\n\\n    --teal:        #0089a8;\\n    --teal-deep:   #00576b;\\n    --jade:        #5a8f74;\\n    --forest:      #0d3324;\\n    --ember:       #b8431e;\\n\\n    --serif: 'Instrument Serif', 'Times New Roman', serif;\\n    --sans:  'Manrope', -apple-system, system-ui, sans-serif;\\n    --mono:  'JetBrains Mono', ui-monospace, Menlo, monospace;\\n\\n    --halo-inset:  22px;    /* width of the fluid halo */\\n    --halo-radius: 32px;    /* inner radius of the page surface */\\n  }\\n\\n  * { box-sizing: border-box; }\\n  html, body {\\n    margin: 0; padding: 0;\\n    background: var(--desk);\\n    color: var(--ink);\\n    font-family: var(--sans);\\n    -webkit-font-smoothing: antialiased;\\n    -moz-osx-font-smoothing: grayscale;\\n    overflow-x: hidden;\\n  }\\n\\n  main {\\n    min-height: 100vh;\\n    padding: 40px 16px 80px;\\n    display: grid;\\n    grid-template-columns: 1fr;\\n    place-items: start center;\\n    gap: 20px;\\n  }\\n  .page-meta {\\n    width: 100%; max-width: 720px;\\n    display: flex; gap: 12px; align-items: baseline;\\n    color: var(--ink-3);\\n    padding-bottom: 4px;\\n  }\\n  .page-meta .dot {\\n    width: 6px; height: 6px; border-radius: 50%; background: var(--teal);\\n    animation: gentle 2.4s ease-in-out infinite;\\n    align-self: center;\\n  }\\n  @keyframes gentle { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }\\n  .page-meta .micro {\\n    font-family: var(--mono); font-size: 10.5px;\\n    letter-spacing: 0.16em; text-transform: uppercase;\\n  }\\n  .page-meta .title {\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 18px; color: var(--ink-2);\\n    margin-left: auto;\\n  }\\n\\n  /* ── State toggle (outside the phone) ─────────────────────── */\\n  .state-toggle {\\n    width: 100%; max-width: 393px;\\n    display: flex; gap: 4px; padding: 4px;\\n    background: rgba(70, 50, 28, 0.05);\\n    border-radius: 999px;\\n    border: 1px solid var(--rule-soft);\\n  }\\n  .state-toggle button {\\n    flex: 1;\\n    padding: 7px 8px;\\n    background: transparent; border: 0; border-radius: 999px;\\n    font-family: var(--mono); font-size: 10px;\\n    letter-spacing: 0.1em; text-transform: uppercase;\\n    color: var(--ink-3);\\n    cursor: pointer;\\n    transition: background 200ms, color 200ms;\\n  }\\n  .state-toggle button.active {\\n    background: var(--ink); color: #fff;\\n  }\\n\\n  /* ── Phone frame ──────────────────────────────────────────── */\\n  .phone {\\n    width: 393px; height: 852px;\\n    background: #0c0d10;\\n    border-radius: 54px;\\n    padding: 11px;\\n    position: relative;\\n    box-shadow:\\n      0 1px 0 rgba(255,255,255,0.05) inset,\\n      0 -1px 0 rgba(0,0,0,0.4) inset,\\n      0 40px 90px -30px rgba(60,40,20,0.22),\\n      0 15px 35px -10px rgba(60,40,20,0.12);\\n  }\\n  .phone .screen {\\n    width: 100%; height: 100%;\\n    background: var(--paper-deep);\\n    border-radius: 44px;\\n    overflow: hidden;\\n    position: relative;\\n  }\\n  .phone .island {\\n    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);\\n    width: 126px; height: 36px; background: #000; border-radius: 999px;\\n    z-index: 80; pointer-events: none;\\n  }\\n  .phone .home {\\n    position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);\\n    width: 140px; height: 5px; background: rgba(0,0,0,0.85);\\n    border-radius: 999px; z-index: 80; pointer-events: none;\\n  }\\n\\n  /* ── HALO — the fluid rim ─────────────────────────────────── */\\n  /* Canvas covers the whole screen interior. The .page surface above\\n     is inset by --halo-inset, so the fluid is only visible in the\\n     22px rim around all four edges. */\\n  .halo-canvas {\\n    position: absolute; inset: 0;\\n    width: 100%; height: 100%;\\n    z-index: 1;\\n    pointer-events: none;\\n    /* Particles are pre-softened (radial-gradient Gaussian sprites);\\n       a light global blur merges overlapping particles into smoke. */\\n    image-rendering: auto;\\n    filter: blur(1.6px);\\n  }\\n\\n  /* ── Page surface (paper) ─────────────────────────────────── */\\n  .page {\\n    position: absolute;\\n    top: var(--halo-inset);\\n    left: var(--halo-inset);\\n    right: var(--halo-inset);\\n    bottom: var(--halo-inset);\\n    background: var(--paper);\\n    border-radius: var(--halo-radius);\\n    overflow: hidden;\\n    z-index: 2;\\n    box-shadow:\\n      inset 0 0 80px rgba(60,40,20,0.05),\\n      0 1px 2px rgba(60,40,20,0.04);\\n  }\\n\\n  /* ── Status bar (inside the page now) ─────────────────────── */\\n  .statusbar {\\n    position: absolute;\\n    top: 6px; left: 0; right: 0;\\n    display: flex; justify-content: space-between; align-items: center;\\n    padding: 0 22px;\\n    z-index: 30;\\n    font-family: -apple-system, \\\"SF Pro\\\", system-ui;\\n    font-weight: 600; font-size: 14.5px;\\n    color: var(--ink);\\n    pointer-events: none;\\n  }\\n  .statusbar .indicators { display: flex; gap: 5px; align-items: center; }\\n\\n  /* ── App mark (very small, top-right) ─────────────────────── */\\n  .app-mark {\\n    position: absolute;\\n    top: 30px; left: 22px;\\n    z-index: 25;\\n    display: flex; align-items: baseline; gap: 8px;\\n    background: transparent; border: 0; padding: 0; cursor: pointer;\\n  }\\n  .index-overlay { position: absolute; inset: 0; z-index: 90; pointer-events: none; }\\n  .index-overlay::before { content: ''; position: absolute; inset: 0; background: rgba(13,20,26,0); transition: background 300ms; }\\n  .index-overlay.open { pointer-events: auto; }\\n  .index-overlay.open::before { background: rgba(13,20,26,0.34); }\\n  .index-sheet { position: absolute; top: 22px; left: 22px; right: 22px; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2); border-radius: 32px 32px 22px 22px; padding: 56px 24px 24px; transform: translateY(-104%); transition: transform 420ms cubic-bezier(.34,1.12,.64,1); box-shadow: 0 18px 40px -16px rgba(20,24,32,0.22); }\\n  .index-overlay.open .index-sheet { transform: translateY(0) !important; }\\n  .index-sheet .ix-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }\\n  .index-sheet a { display: flex; align-items: baseline; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--rule-soft); text-decoration: none; color: var(--ink); }\\n  .index-sheet a:last-of-type { border-bottom: 0; }\\n  .index-sheet a .n { font-family: var(--serif); font-style: italic; font-size: 24px; }\\n  .index-sheet a .c { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; color: var(--ink-3); }\\n  .index-sheet .handle { width: 40px; height: 4px; border-radius: 999px; background: var(--ink-4); opacity: 0.5; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); }\\n  .app-mark .glyph {\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 22px; line-height: 1;\\n    color: var(--ink); letter-spacing: -0.02em;\\n  }\\n  .app-mark .crumb {\\n    font-family: var(--mono); font-size: 9.5px;\\n    letter-spacing: 0.16em; text-transform: uppercase;\\n    color: var(--ink-3);\\n  }\\n  .app-mark .when {\\n    font-family: var(--mono); font-size: 9.5px;\\n    color: var(--teal-deep); letter-spacing: 0.04em;\\n    margin-left: 6px;\\n  }\\n\\n  /* ── Conversation scroll ──────────────────────────────────── */\\n  .conv {\\n    position: absolute;\\n    inset: 70px 0 60px 0;\\n    overflow-y: auto; overflow-x: hidden;\\n    padding: 6px 22px 16px;\\n    z-index: 10;\\n  }\\n  .conv::-webkit-scrollbar { width: 0; height: 0; }\\n\\n  /* Day divider — italic timestamp with a hairline either side */\\n  .day-divider {\\n    display: flex; align-items: center; gap: 10px;\\n    margin: 14px 0 14px;\\n    color: var(--ink-3);\\n  }\\n  .day-divider::before, .day-divider::after {\\n    content: ''; flex: 1; height: 1px;\\n    background: var(--rule-soft);\\n  }\\n  .day-divider .label {\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 14px; color: var(--ink-2);\\n  }\\n  .day-divider .label .roman {\\n    font-family: var(--mono); font-style: normal;\\n    font-size: 10px; letter-spacing: 0.14em;\\n    text-transform: uppercase; color: var(--ink-3);\\n    margin-left: 6px;\\n  }\\n\\n  /* ── Turns ────────────────────────────────────────────────── */\\n  .turn {\\n    position: relative;\\n    padding: 10px 0 14px 18px;\\n  }\\n  /* Thread line — a thin vertical rule running down Ayumi's turns */\\n  .turn.ayumi::before {\\n    content: '';\\n    position: absolute;\\n    left: 4px; top: 18px; bottom: 6px;\\n    width: 1px;\\n    background: linear-gradient(180deg, var(--teal-deep) 0%, var(--rule) 100%);\\n    opacity: 0.7;\\n  }\\n  .turn.user { padding-left: 0; }\\n  .turn-meta {\\n    display: flex; align-items: center; gap: 8px;\\n    margin-bottom: 8px;\\n  }\\n  .turn.ayumi .turn-meta .name {\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 14px; color: var(--ink);\\n  }\\n  .turn.user .turn-meta {\\n    justify-content: flex-end;\\n  }\\n  .turn.user .turn-meta .name {\\n    font-family: var(--mono); font-size: 9.5px;\\n    letter-spacing: 0.16em; text-transform: uppercase;\\n    color: var(--ink-3);\\n  }\\n  .turn-meta .when {\\n    font-family: var(--mono); font-size: 9.5px;\\n    letter-spacing: 0.06em; color: var(--ink-3);\\n  }\\n  .turn.ayumi .turn-meta::before {\\n    content: '';\\n    position: absolute;\\n    left: -2px; top: 6px;\\n    width: 12px; height: 12px;\\n    border-radius: 50%;\\n    background: var(--ink);\\n    overflow: hidden;\\n  }\\n  /* The little jade pulse inside Ayumi's avatar dot */\\n  .turn.ayumi .turn-meta::after {\\n    content: '';\\n    position: absolute;\\n    left: 1px; top: 9px;\\n    width: 6px; height: 6px;\\n    border-radius: 50%;\\n    background: radial-gradient(circle at 35% 30%, rgba(122,214,198,0.95), rgba(90,143,116,0.5) 60%, rgba(0,0,0,0) 100%);\\n    animation: gentle 2.4s ease-in-out infinite;\\n  }\\n\\n  /* Ayumi's prose */\\n  .turn.ayumi .body {\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 17px; line-height: 1.46;\\n    color: var(--ink);\\n    text-wrap: pretty;\\n    letter-spacing: -0.002em;\\n  }\\n  .turn.ayumi .body .roman {\\n    font-style: normal; color: var(--ink);\\n  }\\n  .turn.ayumi .body em.accent {\\n    font-style: normal;\\n    background: linear-gradient(180deg, transparent 65%, rgba(0,137,168,0.18) 65%, rgba(0,137,168,0.18) 92%, transparent 92%);\\n    padding: 0 1px;\\n  }\\n  .turn.ayumi .body p { margin: 0; }\\n  .turn.ayumi .body p + p { margin-top: 8px; }\\n  .turn.ayumi .src-tag {\\n    margin-top: 8px;\\n    font-family: var(--mono); font-size: 9px;\\n    letter-spacing: 0.06em; color: var(--ink-4);\\n  }\\n\\n  /* User turn */\\n  .turn.user .bubble {\\n    align-self: flex-end;\\n    background: var(--ink);\\n    color: #fff;\\n    padding: 10px 14px;\\n    border-radius: 18px 18px 4px 18px;\\n    font-family: var(--sans); font-size: 14.5px; line-height: 1.4;\\n    max-width: 78%;\\n    margin-left: auto;\\n    box-shadow: var(--shadow-1);\\n  }\\n  .turn.user .row { display: flex; }\\n\\n  /* ── Embedded brief card (the ssatom — morphing capsule ↔ letter) */\\n  .ssatom {\\n    margin-top: 12px;\\n    transition:\\n      max-height 600ms cubic-bezier(.34, 1.16, .64, 1),\\n      transform 600ms cubic-bezier(.34, 1.16, .64, 1);\\n    transform-origin: top left;\\n    will-change: transform, max-height;\\n  }\\n  .ssatom .atom-capsule {\\n    background: var(--card);\\n    border-radius: 999px;\\n    padding: 8px 12px 8px 16px;\\n    display: flex; align-items: center; gap: 10px;\\n    box-shadow: var(--shadow-1);\\n    cursor: pointer;\\n    transition:\\n      border-radius 600ms cubic-bezier(.34, 1.16, .64, 1),\\n      padding 600ms cubic-bezier(.34, 1.16, .64, 1);\\n    width: fit-content;\\n    max-width: 100%;\\n  }\\n  .ssatom .cap-glyph {\\n    width: 18px; height: 18px; border-radius: 4px;\\n    background: var(--ink);\\n    position: relative;\\n    overflow: hidden;\\n    flex-shrink: 0;\\n  }\\n  .ssatom .cap-glyph::after {\\n    content: '';\\n    position: absolute; inset: 0;\\n    background: radial-gradient(circle at 30% 25%, rgba(255,252,235,0.55), rgba(255,252,235,0) 60%);\\n  }\\n  .ssatom .cap-label {\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 15px; line-height: 1;\\n    color: var(--ink);\\n    flex: 1; min-width: 0;\\n    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\\n  }\\n  .ssatom .cap-when {\\n    font-family: var(--mono); font-size: 9.5px;\\n    color: var(--teal-deep); letter-spacing: 0.04em;\\n    flex-shrink: 0;\\n  }\\n  /* Atom-letter morph: grid-template-rows 0fr → 1fr animates reliably\\n     even when max-height transitions are throttled by the compositor. */\\n  .ssatom .atom-letter {\\n    display: grid;\\n    grid-template-rows: 0fr;\\n    opacity: 0;\\n    background: var(--card);\\n    border-radius: 0 0 8px 8px;\\n    box-shadow: none;\\n    transition:\\n      grid-template-rows 600ms cubic-bezier(.34, 1.06, .64, 1),\\n      opacity 240ms ease 60ms,\\n      box-shadow 600ms ease;\\n    position: relative;\\n  }\\n  .ssatom .atom-letter-inner {\\n    min-height: 0;\\n    overflow: hidden;\\n    padding: 0 14px;\\n  }\\n  /* OPEN state */\\n  .ssatom.open .atom-capsule {\\n    border-radius: 8px 8px 0 0;\\n    padding: 12px 14px 10px;\\n    box-shadow:\\n      0 0.5px 1px rgba(60,40,20,0.05),\\n      2px 4px 10px -4px rgba(60,40,20,0.07);\\n    width: 100%;\\n  }\\n  .ssatom.open .atom-letter {\\n    grid-template-rows: 1fr;\\n    opacity: 1;\\n    box-shadow:\\n      2px 4px 10px -4px rgba(60,40,20,0.07),\\n      4px 12px 28px -14px rgba(60,40,20,0.12);\\n    border-top: 1px solid rgba(60,40,20,0.08);\\n  }\\n  .ssatom.open .atom-letter-inner {\\n    padding: 0 14px 14px;\\n  }\\n  .ssatom.open .atom-letter::before {\\n    content: '';\\n    position: absolute;\\n    left: 0; right: 0; top: 0;\\n    height: 4px;\\n    background: linear-gradient(180deg, rgba(60,40,20,0.10) 0%, rgba(60,40,20,0) 100%);\\n    pointer-events: none;\\n    z-index: 2;\\n  }\\n  .ssatom .letter-row {\\n    margin-top: 12px;\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 14.5px; line-height: 1.5;\\n    color: var(--ink-2); text-wrap: pretty;\\n  }\\n  .ssatom .letter-row.head {\\n    margin-top: 14px;\\n    font-family: var(--mono); font-style: normal;\\n    font-size: 9.5px; letter-spacing: 0.16em;\\n    text-transform: uppercase; color: var(--ink-3);\\n  }\\n  .ssatom .letter-list {\\n    margin-top: 6px;\\n    display: flex; flex-direction: column;\\n  }\\n  .ssatom .letter-open {\\n    display: inline-block;\\n    margin-top: 14px;\\n    font-family: var(--mono); font-size: 10px;\\n    letter-spacing: 0.12em; text-transform: uppercase;\\n    color: var(--teal-deep); text-decoration: none;\\n    border-bottom: 1px solid rgba(0,87,107,0.3);\\n    padding-bottom: 2px;\\n  }\\n  .ssatom .letter-list li {\\n    list-style: none;\\n    padding: 8px 0;\\n    border-bottom: 1px solid var(--rule-soft);\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 14.5px; line-height: 1.4;\\n    color: var(--ink); display: flex; gap: 8px; align-items: baseline;\\n  }\\n  .ssatom .letter-list li:last-child { border-bottom: 0; }\\n  .ssatom .letter-list li .pct {\\n    font-family: var(--mono); font-style: normal; font-size: 10px;\\n    color: var(--ink-3); letter-spacing: 0.04em;\\n    flex-shrink: 0;\\n    background: #d9e7d8; color: #16321e;\\n    padding: 2px 7px; border-radius: 999px;\\n  }\\n  .ssatom .letter-list li .pct.low { background: #fbe3d9; color: #6c2310; }\\n\\n  /* ── Thinking turn (with vapor plume) ─────────────────────\\n     The plume is NOT pixel art. We run the solver at higher\\n     resolution, render with smooth scaling (no image-rendering:\\n     pixelated), then apply CSS blur + saturate so the result\\n     reads as vapor: translucent, wispy, gently rising. */\\n  .turn.ayumi.thinking .body {\\n    display: flex; align-items: center; gap: 10px;\\n    font-size: 14.5px; color: var(--ink-2);\\n    font-style: italic;\\n  }\\n  .thinking-pulse {\\n    width: 7px; height: 7px; border-radius: 50%;\\n    background: var(--jade);\\n    flex-shrink: 0;\\n    position: relative;\\n    animation: thinking-breathe 1.4s ease-in-out infinite;\\n  }\\n  .thinking-pulse::after {\\n    content: '';\\n    position: absolute;\\n    inset: -4px;\\n    border-radius: 50%;\\n    background: radial-gradient(circle, rgba(90,143,116,0.45), rgba(90,143,116,0) 70%);\\n    animation: thinking-breathe 1.4s ease-in-out infinite;\\n  }\\n  @keyframes thinking-breathe {\\n    0%, 100% { opacity: 0.55; transform: scale(1); }\\n    50%      { opacity: 1;    transform: scale(1.18); }\\n  }\\n\\n  /* ── EO pulse ring (used on capsule open and on Send) ─────── */\\n  .eo-source { position: relative; overflow: visible; }\\n  .eo-ring {\\n    position: absolute; width: 14px; height: 14px;\\n    border-radius: 50%;\\n    background: radial-gradient(circle, rgba(122,214,198,0.55), rgba(122,214,198,0) 70%);\\n    transform: translate(-50%, -50%);\\n    animation: eo-ring 950ms cubic-bezier(.2,.7,.2,1) forwards;\\n    pointer-events: none;\\n    z-index: 5;\\n  }\\n  @keyframes eo-ring { 0% { width: 12px; height: 12px; opacity: 1; } 100% { width: 380px; height: 380px; opacity: 0; } }\\n\\n  /* ── Compose pill (the ssatom at the bottom) ──────────────── */\\n  .compose-zone {\\n    position: absolute;\\n    left: 0; right: 0; bottom: 0;\\n    z-index: 30;\\n    padding: 8px 22px 14px;\\n    background: linear-gradient(180deg, rgba(251,248,241,0) 0%, var(--paper) 35%);\\n  }\\n  .compose {\\n    background: var(--card);\\n    border: 1px solid var(--rule);\\n    border-radius: 26px;\\n    padding: 8px 8px 8px 18px;\\n    display: flex; align-items: center; gap: 10px;\\n    box-shadow: var(--shadow-1);\\n    cursor: text;\\n    transition:\\n      min-height 520ms cubic-bezier(.34, 1.10, .64, 1),\\n      padding 520ms cubic-bezier(.34, 1.10, .64, 1),\\n      border-radius 520ms cubic-bezier(.34, 1.10, .64, 1);\\n    min-height: 52px;\\n    overflow: hidden;\\n    position: relative;\\n  }\\n  .compose .placeholder {\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 15px; color: var(--ink-3);\\n    flex: 1;\\n    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\\n  }\\n  .compose .voice-btn,\\n  .compose .send-btn {\\n    width: 36px; height: 36px; border-radius: 50%;\\n    background: var(--ink); color: #fff;\\n    border: 0; display: inline-flex; align-items: center; justify-content: center;\\n    cursor: pointer; flex-shrink: 0;\\n    box-shadow: 0 1px 2px rgba(60,40,20,0.16);\\n    transition: background 200ms;\\n  }\\n  .compose .voice-btn svg, .compose .send-btn svg { display: block; }\\n  /* Composing state */\\n  .compose.composing {\\n    min-height: 200px;\\n    border-radius: 18px;\\n    padding: 14px 12px 12px 16px;\\n    align-items: flex-start;\\n    flex-direction: column;\\n  }\\n  .compose.composing .placeholder {\\n    display: block;\\n    white-space: normal;\\n    font-family: var(--serif); font-style: italic;\\n    font-size: 16px; line-height: 1.4;\\n    color: var(--ink);\\n    flex: 1;\\n    width: 100%;\\n    min-height: 120px;\\n  }\\n  .compose.composing .placeholder.empty { color: var(--ink-3); }\\n  .compose.composing .placeholder::after {\\n    content: '';\\n    display: inline-block;\\n    width: 1px; height: 16px;\\n    background: var(--ink);\\n    vertical-align: -2px; margin-left: 1px;\\n    animation: cur-blink 1s steps(2,end) infinite;\\n  }\\n  @keyframes cur-blink { 0%,50% { opacity: 1;} 51%,100% { opacity: 0;} }\\n  .compose.composing .controls {\\n    width: 100%;\\n    display: flex; align-items: center; justify-content: space-between;\\n    margin-top: 10px;\\n  }\\n  .compose.composing .controls .hint {\\n    font-family: var(--mono); font-size: 9.5px;\\n    letter-spacing: 0.12em; text-transform: uppercase;\\n    color: var(--ink-3);\\n  }\\n  .compose .controls { display: none; }\\n  .compose.composing .controls { display: flex; }\\n  .compose.composing .voice-btn { display: none; }\\n  .compose.composing .send-btn {\\n    background: var(--forest);\\n  }\\n\\n  /* ── Legend ───────────────────────────────────────────────── */\\n  .legend {\\n    width: 100%; max-width: 720px;\\n    margin-top: 8px;\\n    display: grid; grid-template-columns: 1fr; gap: 16px;\\n    padding: 22px;\\n    border: 1px solid var(--rule);\\n    border-radius: 6px;\\n    background: var(--card);\\n    box-shadow: var(--shadow-1);\\n  }\\n  .legend .row { display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: baseline; }\\n  .legend dt { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\\n  .legend dd { margin: 0; font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--ink-2); line-height: 1.5; text-wrap: pretty; }\\n  .legend dd em { font-style: normal; color: var(--ink); }\\n\\n  @media (min-width: 980px) {\\n    main {\\n      grid-template-columns: 1fr 393px 1fr;\\n      column-gap: 36px;\\n      align-items: start;\\n      padding: 56px 32px 80px;\\n    }\\n    .page-meta { grid-column: 1 / 4; max-width: none; padding-bottom: 0; }\\n    .state-toggle { grid-column: 3; max-width: 280px; margin-top: 8px; }\\n    .phone-wrap { grid-column: 2; }\\n    .legend { grid-column: 2 / 4; max-width: none; margin-top: 24px; }\\n  }\\n<\\/style>\\n\\n<style id=\\\"frameless-override\\\">\\n  html,body{height:100%!important;margin:0!important;overflow:hidden!important;background:var(--desk,#ededea)!important;}\\n  body{display:flex!important;justify-content:center!important;align-items:stretch!important;}\\n  main{display:block!important;padding:0!important;margin:0!important;min-height:0!important;width:100%!important;max-width:480px!important;grid-template-columns:none!important;place-items:initial!important;gap:0!important;}\\n  .page-meta,.hint,.state-toggle,.legend,.statusbar,.phone .island,.phone .home{display:none!important;}\\n  .phone-wrap{margin:0!important;width:100%!important;grid-column:auto!important;}\\n  .phone{width:100%!important;max-width:480px!important;height:100dvh!important;margin:0 auto!important;padding:0!important;background:transparent!important;border-radius:0!important;box-shadow:none!important;}\\n  .phone .screen{width:100%!important;height:100%!important;border-radius:0!important;}\\n<\\/style>\\n<\\/head>\\n\\n<body data-atlas-page=\\\"today\\\">\\n\\n<main>\\n\\n  <div class=\\\"page-meta\\\">\\n    <span class=\\\"dot\\\"><\\/span>\\n    <span class=\\\"micro\\\">Atlas v0.6 · Halo · Conversational OS<\\/span>\\n    <span class=\\\"title\\\">Today is <em>Wednesday, May 20.<\\/em><\\/span>\\n  <\\/div>\\n\\n  <div class=\\\"state-toggle\\\" role=\\\"tablist\\\">\\n    <button data-state=\\\"idle\\\" class=\\\"active\\\">Idle<\\/button>\\n    <button data-state=\\\"thinking\\\">Thinking<\\/button>\\n    <button data-state=\\\"delivered\\\">Delivered<\\/button>\\n  <\\/div>\\n\\n  <div class=\\\"phone-wrap\\\">\\n    <div class=\\\"phone\\\">\\n      <div class=\\\"screen\\\">\\n\\n        <!-- HALO: full-screen fluid sim. The .page above will mask its center,\\n             leaving a 22px rim where the fluid breathes. -->\\n        <canvas class=\\\"halo-canvas\\\" id=\\\"halo\\\"><\\/canvas>\\n\\n        <!-- PAGE: warm paper surface inset 22px — this is the masking layer.\\n             Everything legible lives here. -->\\n        <div class=\\\"page\\\">\\n\\n          <div class=\\\"statusbar\\\">\\n            <span>9:41<\\/span>\\n            <div class=\\\"indicators\\\">\\n              <svg width=\\\"17\\\" height=\\\"11\\\" viewBox=\\\"0 0 17 11\\\"><rect x=\\\"0\\\" y=\\\"7\\\" width=\\\"2.6\\\" height=\\\"4\\\" rx=\\\"0.6\\\" fill=\\\"currentColor\\\"/><rect x=\\\"4\\\" y=\\\"5\\\" width=\\\"2.6\\\" height=\\\"6\\\" rx=\\\"0.6\\\" fill=\\\"currentColor\\\"/><rect x=\\\"8\\\" y=\\\"2.5\\\" width=\\\"2.6\\\" height=\\\"8.5\\\" rx=\\\"0.6\\\" fill=\\\"currentColor\\\"/><rect x=\\\"12\\\" y=\\\"0\\\" width=\\\"2.6\\\" height=\\\"11\\\" rx=\\\"0.6\\\" fill=\\\"currentColor\\\"/><\\/svg>\\n              <svg width=\\\"24\\\" height=\\\"11\\\" viewBox=\\\"0 0 24 11\\\"><rect x=\\\"0.5\\\" y=\\\"0.5\\\" width=\\\"20\\\" height=\\\"10\\\" rx=\\\"3\\\" stroke=\\\"currentColor\\\" stroke-opacity=\\\"0.4\\\" fill=\\\"none\\\"/><rect x=\\\"2\\\" y=\\\"2\\\" width=\\\"17\\\" height=\\\"7\\\" rx=\\\"1.6\\\" fill=\\\"currentColor\\\"/><\\/svg>\\n            <\\/div>\\n          <\\/div>\\n\\n          <button class=\\\"app-mark\\\" id=\\\"app-mark\\\">\\n            <span class=\\\"glyph\\\">A<\\/span>\\n            <span class=\\\"crumb\\\">Atlas · Today ▾<\\/span>\\n            <span class=\\\"when\\\">May 20<\\/span>\\n          <\\/button>\\n\\n          <div class=\\\"index-overlay\\\" id=\\\"index-overlay\\\">\\n            <div class=\\\"index-sheet\\\">\\n              <div class=\\\"ix-label\\\">Go to<\\/div>\\n              <a href=\\\"Atlas v0.6 - Brief × Halo.html\\\"><span class=\\\"n\\\">Briefs<\\/span><span class=\\\"c\\\">Karan · 14:30<\\/span><\\/a>\\n              <a href=\\\"Atlas v0.6 - Chapters × Halo.html\\\"><span class=\\\"n\\\">Chapters<\\/span><span class=\\\"c\\\">5 threads<\\/span><\\/a>\\n              <a href=\\\"Atlas v0.6 - Review × Halo.html\\\"><span class=\\\"n\\\">Review<\\/span><span class=\\\"c\\\">4 overnight<\\/span><\\/a>\\n              <a href=\\\"Atlas v0.6 - Search × Halo.html\\\"><span class=\\\"n\\\">Search<\\/span><span class=\\\"c\\\">everything<\\/span><\\/a>\\n              <div class=\\\"handle\\\"><\\/div>\\n            <\\/div>\\n          <\\/div>\\n\\n\\n          <!-- ════════ THE CONVERSATION ════════ -->\\n          <div class=\\\"conv\\\" id=\\\"conv\\\">\\n\\n            <div class=\\\"day-divider\\\">\\n              <span class=\\\"label\\\">while you slept <span class=\\\"roman\\\">02:14 → 06:38<\\/span><\\/span>\\n            <\\/div>\\n\\n            <!-- 1. Ayumi opens — wide italic prose -->\\n            <div class=\\\"turn ayumi\\\">\\n              <div class=\\\"turn-meta\\\">\\n                <span class=\\\"name\\\">Ayumi<\\/span>\\n                <span class=\\\"when\\\">06:38<\\/span>\\n              <\\/div>\\n              <div class=\\\"body\\\">\\n                <p>I worked through the night. A note from <span class=\\\"roman\\\">Karan<\\/span> landed at <span class=\\\"roman\\\">03:42<\\/span> — I held it.<\\/p>\\n                <p>Drafted you a brief for <em class=\\\"accent\\\">14:30<\\/em>, opened with the cohort, not the round. The portrait sitting tomorrow shifted one block south — folded under your stack.<\\/p>\\n              <\\/div>\\n              <div class=\\\"src-tag\\\">6 sources · email, voice memo, calendar, deck v3<\\/div>\\n\\n              <!-- Embedded brief — the ssatom -->\\n              <div class=\\\"ssatom eo-source\\\" data-atom>\\n                <div class=\\\"atom-capsule\\\">\\n                  <div class=\\\"cap-glyph\\\"><\\/div>\\n                  <div class=\\\"cap-label\\\">Karan, in 90 minutes.<\\/div>\\n                  <div class=\\\"cap-when\\\">14:30<\\/div>\\n                <\\/div>\\n                <div class=\\\"atom-letter\\\">\\n                  <div class=\\\"atom-letter-inner\\\">\\n                    <div class=\\\"letter-row head\\\">Person<\\/div>\\n                    <div class=\\\"letter-row\\\">\\n                      Karan Mehta · Partner at Sequoia · led your A round in '22. He runs late — plan for 20 minutes, not 30.\\n                    <\\/div>\\n                    <div class=\\\"letter-row head\\\">Likely to come up<\\/div>\\n                    <ul class=\\\"letter-list\\\">\\n                      <li><span class=\\\"pct\\\">0.94<\\/span> Net retention by cohort — M6 and M12.<\\/li>\\n                      <li><span class=\\\"pct\\\">0.88<\\/span> Whether seed is enough to skip an A.<\\/li>\\n                      <li><span class=\\\"pct low\\\">0.31<\\/span> The IP side-letter.<\\/li>\\n                    <\\/ul>\\n                    <div class=\\\"letter-row head\\\">Open with<\\/div>\\n                    <div class=\\\"letter-row\\\">\\n                      Retention, not the round. He'll be impatient otherwise — and the cohort is the strongest thing you have.\\n                    <\\/div>\\n                    <a class=\\\"letter-open\\\" href=\\\"Atlas v0.6 - Brief × Halo.html\\\">Open full brief →<\\/a>\\n                  <\\/div>\\n                <\\/div>\\n              <\\/div>\\n            <\\/div>\\n\\n            <!-- 2. User replies -->\\n            <div class=\\\"turn user\\\">\\n              <div class=\\\"turn-meta\\\">\\n                <span class=\\\"when\\\">07:15<\\/span>\\n                <span class=\\\"name\\\">you<\\/span>\\n              <\\/div>\\n              <div class=\\\"row\\\">\\n                <div class=\\\"bubble\\\">thanks — anything else I should know before the call?<\\/div>\\n              <\\/div>\\n            <\\/div>\\n\\n            <!-- 3. Ayumi thinks (with breath plume) -->\\n            <div class=\\\"turn ayumi thinking\\\" id=\\\"thinking-turn\\\">\\n              <div class=\\\"turn-meta\\\">\\n                <span class=\\\"name\\\">Ayumi<\\/span>\\n                <span class=\\\"when\\\">07:15<\\/span>\\n              <\\/div>\\n              <div class=\\\"body\\\">\\n                <span class=\\\"thinking-pulse\\\"><\\/span>\\n                <span>reading the deck and yesterday's voice memo…<\\/span>\\n              <\\/div>\\n            <\\/div>\\n\\n            <!-- 4. Ayumi answers -->\\n            <div class=\\\"turn ayumi\\\">\\n              <div class=\\\"turn-meta\\\">\\n                <span class=\\\"name\\\">Ayumi<\\/span>\\n                <span class=\\\"when\\\">07:16<\\/span>\\n              <\\/div>\\n              <div class=\\\"body\\\">\\n                <p>Two small things. Your <em class=\\\"accent\\\">deck v3<\\/em> still has the old churn slide — I can swap it for the cohort
